<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>智能体工作台 · 城市信控智能体</title>
<link rel="stylesheet" href="/debug/assets/debug-shell.css"/>
<script defer src="/debug/assets/debug-ui.js"></script>
<style>
:root{
  --bg:#f0f5ff;--surface:#fff;--surface2:#f6f9ff;--surface3:#eef4ff;
  --border:#dce8f8;--border2:#c8daf5;
  --accent:#1a7fff;--accent2:#00b5a3;--warn:#e68a00;--danger:#e53935;
  --success:#1da462;--purple:#6c3acb;--indigo:#3d52c7;--text:#0d1b2e;--muted:#5f7a9c;--r:10px;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;}
body{background:var(--bg);color:var(--text);font-family:"PingFang SC",-apple-system,BlinkMacSystemFont,sans-serif;font-size:14px;min-height:100vh;display:flex;flex-direction:column;}

/* ===== TOP NAV ===== */
.topnav{display:flex;align-items:center;gap:12px;padding:0 20px;height:54px;background:#fff;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:200;box-shadow:0 1px 8px rgba(26,127,255,.07);flex-shrink:0;}
.logo-text{font-size:15px;font-weight:700;color:var(--accent);}
.nav-links{display:flex;gap:3px;margin-left:12px;}
.nav-link{padding:5px 10px;border-radius:6px;font-size:12px;color:var(--muted);cursor:pointer;text-decoration:none;border:1px solid transparent;}
.nav-link:hover{background:var(--surface2);}
.nav-link.active{background:rgba(26,127,255,.07);color:var(--accent);border-color:rgba(26,127,255,.2);}
.topnav-right{margin-left:auto;display:flex;align-items:center;gap:6px;}
.phase-chip{padding:4px 10px;border-radius:6px;font-size:11px;font-weight:600;white-space:nowrap;text-decoration:none;}
.phase-chip.done{color:var(--success);background:rgba(29,164,98,.08);}
.phase-chip.active{color:var(--accent);background:rgba(26,127,255,.1);border:1px solid rgba(26,127,255,.2);}
.phase-chip.pending{color:var(--muted);background:var(--surface2);opacity:.6;}
.phase-arrow{font-size:11px;color:var(--muted);}

/* ===== LAYOUT ===== */
.workbench{display:flex;flex:1;overflow:hidden;height:calc(100vh - 54px);min-width:0;min-height:0;}

/* ===== LEFT: OBJECT POOL ===== */
.obj-pool{width:280px;flex-shrink:0;display:flex;flex-direction:column;background:#fff;border-right:1px solid var(--border);overflow:hidden;min-height:0;max-height:100%;overscroll-behavior:contain;}
.pool-header{padding:11px 14px;border-bottom:1px solid var(--border);flex-shrink:0;}
.pool-title{font-size:13px;font-weight:700;color:var(--text);}
.pool-subtitle{font-size:11px;color:var(--muted);margin-top:2px;}
.pool-tabs{display:flex;flex-wrap:wrap;flex-shrink:0;border-bottom:1px solid var(--border);background:var(--surface2);}
.pool-tab{flex:1 1 50%;min-width:116px;padding:7px 3px;text-align:center;font-size:10px;font-weight:700;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;transition:all .15s;user-select:none;display:flex;align-items:center;justify-content:center;gap:3px;white-space:nowrap;}
.pool-tab.active{color:var(--accent);border-bottom-color:var(--accent);background:rgba(26,127,255,.04);}
.pool-tab:hover:not(.active){background:rgba(0,0,0,.02);}
.pool-tab-cnt{padding:1px 4px;border-radius:6px;font-size:8px;font-weight:800;background:rgba(26,127,255,.1);color:var(--accent);}
.pool-search{padding:8px 12px;border-bottom:1px solid var(--border);flex-shrink:0;}
.pool-search input{width:100%;padding:6px 10px;border-radius:7px;border:1px solid var(--border);background:var(--surface2);font-size:12px;color:var(--text);outline:none;}
.pool-search input:focus{border-color:var(--accent);}
.pool-scroll{flex:1 1 auto;min-height:0;max-height:100%;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;scrollbar-gutter:stable;}
.pool-scroll::-webkit-scrollbar{width:3px;}
.pool-scroll::-webkit-scrollbar-thumb{background:var(--border2);}
.pool-group-body{}
.pool-item{display:flex;align-items:center;gap:8px;padding:8px 12px 8px 16px;cursor:pointer;border-left:2px solid transparent;transition:all .15s;}
.pool-item:hover{background:var(--surface2);border-left-color:var(--accent);}
.pool-item.active{background:rgba(26,127,255,.06);border-left-color:var(--accent);}
.pool-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.pd-critical{background:var(--danger);}
.pd-warning{background:var(--warn);}
.pd-ok{background:var(--success);}
.pd-info{background:var(--accent);}
.pool-item-info{flex:1;min-width:0;}
.pool-item-name{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pool-item-desc{font-size:10px;color:var(--muted);margin-top:2px;}
.pool-item-badge{font-size:9px;font-weight:700;padding:2px 6px;border-radius:8px;flex-shrink:0;white-space:nowrap;}
.pib-critical{background:rgba(229,57,53,.1);color:var(--danger);}
.pib-warning{background:rgba(230,138,0,.1);color:var(--warn);}
.pib-ok{background:rgba(29,164,98,.1);color:var(--success);}
.pib-running{background:rgba(108,58,203,.1);color:var(--purple);}
.pool-empty{padding:24px;text-align:center;color:var(--muted);font-size:12px;}

/* ===== RIGHT: PHASE CONTENT ===== */
.phase-content{width:clamp(560px,38vw,720px);flex:0 0 clamp(560px,38vw,720px);min-width:520px;min-height:0;max-height:100%;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;background:var(--bg);border-left:1px solid var(--border);overscroll-behavior:contain;-webkit-overflow-scrolling:touch;scrollbar-gutter:stable;}
.phase-content::-webkit-scrollbar{width:4px;}
.phase-content::-webkit-scrollbar-thumb{background:var(--border2);}
.obj-banner{padding:14px 20px;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap;flex-shrink:0;position:sticky;top:0;z-index:100;box-shadow:0 1px 5px rgba(26,127,255,.05);}
.obj-banner-icon{font-size:22px;}
.obj-banner-info{flex:1 1 220px;min-width:0;}
.obj-banner-name{font-size:16px;font-weight:700;}
.obj-banner-meta{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.5;overflow-wrap:anywhere;}
.obj-actions{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto;justify-content:flex-end;}
.obj-action{padding:6px 12px;border-radius:7px;font-size:11px;font-weight:600;border:1px solid var(--border);background:var(--surface2);color:var(--text);text-decoration:none;cursor:pointer;transition:all .15s;}
.obj-action:hover{border-color:var(--accent);color:var(--accent);}
.obj-action.primary{background:rgba(26,127,255,.08);border-color:rgba(26,127,255,.3);color:var(--accent);}
.obj-action.warn{background:rgba(230,138,0,.07);border-color:rgba(230,138,0,.3);color:var(--warn);}
.phase-nav-bar{display:flex;align-items:stretch;gap:6px;padding:8px 20px;background:#fff;border-bottom:1px solid var(--border);position:sticky;top:88px;z-index:99;box-shadow:0 1px 4px rgba(26,127,255,.05);flex-wrap:wrap;}
.pnb-btn{flex:1 1 96px;padding:7px 10px;border-radius:7px;font-size:11px;font-weight:700;border:1px solid var(--border);background:var(--surface2);color:var(--muted);cursor:pointer;transition:all .15s;white-space:nowrap;}
.pnb-btn:hover{border-color:var(--accent);color:var(--accent);background:rgba(26,127,255,.04);}
.pnb-btn.active{background:rgba(26,127,255,.1);color:var(--accent);border-color:rgba(26,127,255,.3);}
#tabContent{padding:16px 20px;display:flex;flex-direction:column;gap:12px;min-width:0;flex:0 0 auto;}

/* ===== CARDS (shared inside tabs) ===== */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:0 2px 12px rgba(26,127,255,.04);min-width:0;}
.card-head{padding:11px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:1px solid var(--border);flex-wrap:wrap;}
.card-title{font-size:13px;font-weight:700;}
.card-body{padding:10px 16px 14px;min-width:0;overflow-x:auto;}

/* ===== KPI / Evidence (shared) ===== */
.kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:7px;margin-bottom:8px;}
.kpi-cell{background:#fff;border:1px solid var(--border);border-radius:7px;padding:8px 10px;text-align:center;}
.kpi-cell-val{font-size:18px;font-weight:800;line-height:1;}
.kpi-cell-label{font-size:10px;color:var(--muted);margin-top:3px;}
.ev-grid{display:flex;flex-wrap:wrap;gap:6px;margin:7px 0;}
.ev-chip{background:#fff;border:1px solid var(--border);border-radius:6px;padding:4px 9px;font-size:11px;}
.ev-label{color:var(--muted);}
.ev-val{font-weight:700;margin-left:3px;}
.ev-val.danger{color:var(--danger);}
.ev-val.warn{color:var(--warn);}
.issue-list{display:flex;flex-direction:column;gap:8px;}
.issue-card{border-radius:9px;border:1px solid;padding:12px 14px;}
.issue-card.dynamic{border-color:rgba(230,138,0,.3);background:rgba(230,138,0,.02);}
.issue-card.signal_control{border-color:rgba(229,57,53,.25);background:rgba(229,57,53,.02);}
.issue-card.static{border-color:rgba(26,127,255,.2);background:rgba(26,127,255,.02);}
.issue-card.static_issue{border-color:rgba(26,127,255,.25);background:rgba(26,127,255,.02);}
.issue-card.dynamic_issue{border-color:rgba(230,138,0,.25);background:rgba(230,138,0,.02);}
.issue-card.signal_issue{border-color:rgba(229,57,53,.25);background:rgba(229,57,53,.02);}
.issue-header{display:flex;align-items:flex-start;gap:10px;margin-bottom:9px;}
.issue-icon-box{width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
.issue-icon{width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;}
.ic-dynamic{background:rgba(230,138,0,.1);}
.ic-signal{background:rgba(229,57,53,.1);}
.ic-static{background:rgba(26,127,255,.1);}
.ic-s{background:rgba(26,127,255,.1);}
.ic-d{background:rgba(230,138,0,.1);}
.ic-g{background:rgba(229,57,53,.1);}
.issue-meta{flex:1;min-width:0;}
.issue-name{font-size:13px;font-weight:700;}
.issue-cat-tag{font-size:10px;color:var(--muted);margin-top:2px;}
.issue-cat{font-size:10px;color:var(--muted);margin-top:2px;}
.issue-badges{display:flex;gap:5px;flex-wrap:wrap;margin-left:auto;}
.ib{padding:2px 8px;border-radius:20px;font-size:10px;font-weight:700;}
.ib-danger{background:rgba(229,57,53,.1);color:var(--danger);}
.ib-warn{background:rgba(230,138,0,.1);color:var(--warn);}
.ib-info{background:rgba(26,127,255,.08);color:var(--accent);}
.badge{padding:2px 6px;border-radius:20px;font-size:10px;font-weight:700;}
.b-danger{background:rgba(229,57,53,.1);color:var(--danger);}
.b-warn{background:rgba(230,138,0,.1);color:var(--warn);}
.b-info{background:rgba(26,127,255,.1);color:var(--accent);}
.b-ok{background:rgba(29,164,98,.1);color:var(--success);}
.evidence-grid{display:flex;flex-wrap:wrap;gap:6px;margin:7px 0;}
.issue-reason{font-size:12px;color:rgba(13,27,46,.75);line-height:1.7;padding:8px 10px;border-radius:7px;border-left:3px solid;background:rgba(0,0,0,.02);margin:8px 0;}
.issue-card.dynamic .issue-reason,.issue-card.dynamic_issue .issue-reason{border-color:var(--warn);}
.issue-card.signal_control .issue-reason,.issue-card.signal_issue .issue-reason{border-color:var(--danger);}
.issue-card.static .issue-reason,.issue-card.static_issue .issue-reason{border-color:var(--accent);}
.conf-row{display:flex;align-items:center;gap:7px;font-size:11px;}
.conf-track{flex:1;height:5px;background:var(--border);border-radius:3px;overflow:hidden;}
.conf-fill{height:100%;border-radius:3px;}

/* ===== LLM panel ===== */
.llm-panel{background:linear-gradient(135deg,rgba(26,127,255,.04),rgba(0,181,163,.03));border:1px solid rgba(26,127,255,.15);border-radius:9px;padding:13px;}
.llm-tag{display:inline-flex;align-items:center;gap:4px;font-size:10px;padding:2px 8px;border-radius:20px;background:rgba(26,127,255,.08);color:var(--accent);font-weight:600;margin-bottom:7px;}
.llm-text{font-size:12px;line-height:1.85;color:rgba(13,27,46,.82);}
.llm-btn-row{display:flex;gap:7px;margin-top:10px;}
.llm-btn{font-size:11px;padding:5px 11px;border-radius:7px;border:1px solid var(--border);background:#fff;color:var(--muted);cursor:pointer;text-decoration:none;transition:all .15s;}
.llm-btn:hover{border-color:var(--accent);color:var(--accent);}
.llm-actions{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;}
.spin{display:inline-block;width:13px;height:13px;border:2px solid rgba(26,127,255,.2);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;}
@keyframes spin{to{transform:rotate(360deg);}}
.fallback-note{font-size:10px;color:var(--warn);margin-top:5px;}

/* ===== Map panel ===== */
.wb-map-panel{flex:1 1 auto;min-width:420px;overflow:hidden;transition:flex-basis .25s,min-width .25s;border-right:1px solid var(--border);position:relative;background:#dfe8f5;}
.wb-map-panel.collapsed{flex:0 0 0;min-width:0;border-right:0;}
.wb-map-container{width:100%;height:100%;}
.wb-analysis-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px;}
.wb-analysis-title{font-size:12px;font-weight:800;color:var(--text);}
.wb-analysis-target{font-size:10px;color:var(--muted);max-width:190px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:right;}
.wb-analysis-node{position:relative;width:16px;height:16px;border-radius:50%;background:var(--accent);border:2px solid rgba(255,255,255,.92);box-shadow:0 0 14px rgba(26,127,255,.65),0 0 32px rgba(26,127,255,.2);cursor:pointer;}
.wb-analysis-node.warn{background:var(--warn);box-shadow:0 0 16px rgba(230,138,0,.7),0 0 34px rgba(230,138,0,.22);}
.wb-analysis-node.danger{background:var(--danger);box-shadow:0 0 18px rgba(229,57,53,.8),0 0 38px rgba(229,57,53,.25);}
.wb-analysis-node.success{background:var(--success);box-shadow:0 0 16px rgba(29,164,98,.68),0 0 34px rgba(29,164,98,.2);}
.wb-analysis-node::after{content:"";position:absolute;inset:-9px;border-radius:50%;border:1px solid currentColor;color:inherit;animation:wbAnalysisRipple 2.2s ease-out infinite;}
.wb-flow-dot{width:9px;height:9px;border-radius:50%;background:var(--accent2);border:1px solid rgba(255,255,255,.9);box-shadow:0 0 10px rgba(0,181,163,.75);animation:wbFlowDot 1.8s ease-in-out infinite;}
.wb-flow-dot.hot{background:var(--danger);box-shadow:0 0 12px rgba(229,57,53,.85);}
.wb-signal-flow-particle{width:8px;height:8px;border-radius:50%;background:#00b5a3;border:1px solid rgba(255,255,255,.95);box-shadow:0 0 12px rgba(0,181,163,.88),0 0 24px rgba(26,127,255,.36);}
.wb-signal-hop-label{background:rgba(13,27,46,.9);border:1px solid rgba(0,181,163,.35);border-radius:999px;color:#e5fffb;font-size:9px;font-weight:800;padding:2px 6px;white-space:nowrap;box-shadow:0 4px 14px rgba(26,64,120,.18);}
.wb-signal-flow-note{background:rgba(13,27,46,.92);border:1px solid rgba(0,181,163,.4);border-radius:8px;color:#e5fffb;font-size:10px;font-weight:800;padding:5px 8px;white-space:nowrap;box-shadow:0 6px 20px rgba(0,0,0,.24);}
.wb-analysis-label{background:rgba(13,27,46,.92);border:1px solid rgba(26,127,255,.35);border-radius:8px;padding:6px 9px;color:#fff;font-size:10px;font-weight:800;line-height:1.35;white-space:nowrap;box-shadow:0 6px 20px rgba(0,0,0,.28);}
.wb-analysis-label small{display:block;color:rgba(255,255,255,.65);font-size:8px;font-weight:600;margin-top:1px;}
.wb-analysis-label.danger{border-color:rgba(229,57,53,.45);color:#ffe0e0;}
.wb-analysis-label.success{border-color:rgba(29,164,98,.45);color:#e3ffed;}
.wb-map-popup{position:absolute;right:14px;bottom:14px;z-index:55;width:330px;max-height:52vh;background:rgba(255,255,255,.96);border:1px solid var(--border);border-radius:12px;box-shadow:0 14px 42px rgba(26,64,120,.2);overflow:hidden;display:none;}
.wb-map-popup.visible{display:flex;flex-direction:column;}
.wb-map-popup-head{display:flex;align-items:center;gap:9px;padding:10px 12px;border-bottom:1px solid var(--border);}
.wb-map-popup-title{font-size:13px;font-weight:800;flex:1;min-width:0;}
.wb-map-popup-sub{font-size:10px;color:var(--muted);margin-top:2px;}
.wb-map-popup-close{cursor:pointer;color:var(--muted);font-weight:800;}
.wb-map-popup-tabs{display:flex;border-bottom:1px solid var(--border);background:var(--surface2);}
.wb-map-popup-tab{flex:1;text-align:center;padding:7px 4px;font-size:10px;font-weight:800;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;}
.wb-map-popup-tab.active{color:var(--accent);border-bottom-color:var(--accent);background:#fff;}
.wb-map-popup-body{padding:10px 12px;overflow:auto;}
.wb-map-popup-foot{display:flex;gap:7px;padding:9px 12px;border-top:1px solid var(--border);background:var(--surface2);}
.wb-mpp-card{border:1px solid var(--border);border-radius:8px;background:#fff;padding:9px;margin-bottom:7px;font-size:11px;line-height:1.65;}
.wb-mpp-title{font-size:11px;font-weight:800;margin-bottom:5px;}
.wb-mpp-kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:8px;}
.wb-mpp-kpi{text-align:center;border:1px solid var(--border);border-radius:8px;background:var(--surface2);padding:7px 5px;}
.wb-mpp-kpi-val{font-size:16px;font-weight:900;}
.wb-mpp-kpi-lab{font-size:9px;color:var(--muted);margin-top:2px;}
.wb-action-link{flex:1;text-align:center;padding:7px 10px;border-radius:7px;border:1px solid rgba(26,127,255,.3);background:rgba(26,127,255,.08);color:var(--accent);font-size:11px;font-weight:800;text-decoration:none;}
@keyframes wbAnalysisRipple{0%{opacity:.85;transform:scale(.45)}75%,100%{opacity:0;transform:scale(2.15)}}
@keyframes wbFlowDot{0%,100%{transform:scale(.8);opacity:.75}50%{transform:scale(1.35);opacity:1}}

/* ===== Empty state ===== */
.ws-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;gap:10px;color:var(--muted);padding:48px;}
.ws-empty-icon{font-size:52px;opacity:.4;}
.ws-empty-title{font-size:16px;font-weight:700;color:var(--text);}
.ws-empty-desc{font-size:13px;text-align:center;line-height:1.7;}

/* ========== TAB 1: SCENE COGNITION ========== */
.mode-tabs{display:flex;gap:0;border-bottom:2px solid var(--border);margin-bottom:14px;flex-wrap:wrap;}
.mode-tab{padding:8px 18px;border:none;background:none;font-size:12px;font-weight:700;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .2s;color:var(--muted);white-space:normal;text-align:left;}
.mode-tab.periodic.active{color:var(--accent2);border-bottom-color:var(--accent2);}
.mode-tab.realtime.active{color:var(--danger);border-bottom-color:var(--danger);}
.mode-badge{display:inline-block;font-size:9px;padding:1px 5px;border-radius:10px;margin-left:4px;font-weight:700;vertical-align:middle;}
.badge-periodic{background:rgba(0,181,163,.1);color:var(--accent2);}
.badge-realtime{background:rgba(229,57,53,.1);color:var(--danger);}
.scene-attrs{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:12px;}
.scene-attr{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:10px;text-align:center;cursor:pointer;transition:all .2s;}
.scene-attr:hover,.scene-attr.active{border-color:var(--accent2);background:rgba(0,181,163,.05);}
.scene-attr-icon{font-size:22px;margin-bottom:4px;}
.scene-attr-name{font-size:11px;font-weight:700;}
.scene-attr-pct{font-size:13px;font-weight:800;color:var(--accent2);margin-top:3px;}
.scene-attr-desc{font-size:10px;color:var(--muted);margin-top:2px;line-height:1.5;}
.hour-chart{display:flex;align-items:flex-end;gap:2px;height:60px;margin:10px 0;}
.hour-bar{flex:1;min-width:6px;border-radius:3px 3px 0 0;position:relative;cursor:pointer;transition:all .2s;}
.hour-bar:hover{opacity:.8;}
.hour-labels{display:flex;gap:2px;font-size:9px;color:var(--muted);}
.hour-label{flex:1;text-align:center;overflow:hidden;}
.pattern-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;}
.pattern-chip{padding:4px 10px;border-radius:20px;font-size:11px;font-weight:600;border:1px solid;}
.pc-peak{color:var(--danger);background:rgba(229,57,53,.06);border-color:rgba(229,57,53,.2);}
.pc-normal{color:var(--accent);background:rgba(26,127,255,.06);border-color:rgba(26,127,255,.2);}
.pc-low{color:var(--success);background:rgba(29,164,98,.06);border-color:rgba(29,164,98,.2);}
.rt-metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:7px;margin-bottom:12px;}
.rt-metric{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:9px 10px;}
.rt-metric-val{font-size:18px;font-weight:800;line-height:1;}
.rt-metric-label{font-size:10px;color:var(--muted);margin-top:3px;}
.rt-metric-delta{font-size:11px;font-weight:700;margin-top:4px;}
.delta-up{color:var(--danger);}
.delta-down{color:var(--success);}
.rt-metric.alert{border-color:rgba(229,57,53,.35);background:rgba(229,57,53,.03);}
.rt-metric.warn-metric{border-color:rgba(230,138,0,.35);background:rgba(230,138,0,.03);}
.rt-metric.ok{border-color:rgba(29,164,98,.3);background:rgba(29,164,98,.03);}
.event-panel{border-radius:8px;padding:10px 12px;border:1px solid;margin-bottom:8px;}
.ep-warning{background:rgba(230,138,0,.04);border-color:rgba(230,138,0,.25);}
.ep-danger{background:rgba(229,57,53,.04);border-color:rgba(229,57,53,.25);}
.ep-ok{background:rgba(29,164,98,.04);border-color:rgba(29,164,98,.2);}
.ep-head{display:flex;align-items:center;gap:7px;margin-bottom:5px;}
.ep-icon{font-size:14px;}
.ep-label{font-size:12px;font-weight:700;}
.ep-desc{font-size:11px;color:var(--muted);line-height:1.6;}
.profile-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px;}
.profile-col{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:12px;}
.profile-col-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid var(--border);}
.profile-item{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;font-size:12px;margin-bottom:6px;}
.profile-label{color:var(--muted);flex:1;line-height:1.5;}
.profile-val{font-weight:700;max-width:58%;text-align:right;line-height:1.5;word-break:break-word;}
.supply-col .profile-col-title{color:var(--accent);}
.demand-col .profile-col-title{color:var(--warn);}
.state-col .profile-col-title{color:var(--danger);}
.meter{width:100%;height:6px;background:var(--border);border-radius:3px;overflow:hidden;margin-top:3px;}
.meter-fill{height:100%;border-radius:3px;transition:width .6s ease;}
.profile-note{margin-top:10px;padding-top:8px;border-top:1px dashed var(--border);font-size:11px;color:var(--muted);line-height:1.6;}
.hotspot-list{display:flex;flex-direction:column;gap:7px;}
.hotspot-item{display:flex;align-items:center;gap:9px;background:var(--surface2);border-radius:8px;padding:9px 11px;border:1px solid var(--border);}
.hotspot-icon{font-size:18px;width:30px;text-align:center;}
.hotspot-info .name{font-size:12px;font-weight:600;}
.hotspot-info .desc{font-size:10px;color:var(--muted);margin-top:2px;line-height:1.5;}
.hotspot-badge{margin-left:auto;font-size:10px;padding:2px 7px;border-radius:20px;font-weight:600;flex-shrink:0;}
.badge-high{background:rgba(229,57,53,.1);color:var(--danger);}
.badge-mid{background:rgba(230,138,0,.1);color:var(--warn);}
.flow-viz{display:grid;grid-template-columns:minmax(140px,1fr) auto minmax(140px,1fr);gap:10px;align-items:center;margin:10px 0;}
.flow-box{border-radius:8px;padding:10px;text-align:center;}
.flow-in{background:rgba(26,127,255,.06);border:1px solid rgba(26,127,255,.2);}
.flow-out{background:rgba(0,181,163,.06);border:1px solid rgba(0,181,163,.2);}
.flow-num{font-size:20px;font-weight:800;}
.flow-label{font-size:10px;color:var(--muted);margin-top:3px;}
.flow-mid{text-align:center;}
.flow-diff-badge{padding:5px 10px;border-radius:8px;font-size:13px;font-weight:800;border:1px solid;}
.boundary-list{display:flex;flex-direction:column;gap:5px;}
.boundary-item{display:flex;align-items:center;gap:8px;padding:7px 10px;background:#fff;border:1px solid var(--border);border-radius:7px;}
.bi-direction{font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;flex-shrink:0;}
.bi-in{background:rgba(26,127,255,.08);color:var(--accent);}
.bi-out{background:rgba(0,181,163,.08);color:var(--accent2);}
.bi-name{font-size:11px;font-weight:600;flex:1;}
.bi-flow{font-size:12px;font-weight:700;}
.bi-bar{flex:2;height:6px;background:var(--border);border-radius:3px;overflow:hidden;}
.bi-bar-fill{height:100%;border-radius:3px;}
.bi-sat{font-size:10px;font-weight:700;min-width:36px;text-align:right;}

/* ========== TAB 2: PROBLEM DIAGNOSIS ========== */
.diag-mode-tabs{display:flex;gap:0;border-bottom:2px solid var(--border);margin-bottom:12px;flex-wrap:wrap;}
.diag-mode-tab{padding:8px 16px;border:none;background:none;font-size:12px;font-weight:700;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .2s;color:var(--muted);white-space:normal;text-align:left;}
.diag-mode-tab.realtime.active{color:var(--danger);border-bottom-color:var(--danger);}
.diag-mode-tab.periodic.active{color:var(--accent2);border-bottom-color:var(--accent2);}
.issue-tabs{display:flex;border-bottom:2px solid var(--border);margin-bottom:10px;flex-wrap:wrap;}
.issue-tab{padding:6px 12px;border:none;background:none;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .15s;white-space:normal;text-align:left;}
.issue-tab.active{color:var(--danger);border-bottom-color:var(--danger);}
.sj-card{border-radius:10px;border:2px solid;padding:14px;}
.sj-direct{background:linear-gradient(135deg,rgba(29,164,98,.05),rgba(26,127,255,.03));border-color:rgba(29,164,98,.4);}
.sj-partial{background:linear-gradient(135deg,rgba(230,138,0,.05),rgba(26,127,255,.03));border-color:rgba(230,138,0,.4);}
.sj-non{background:linear-gradient(135deg,rgba(107,122,156,.05),rgba(26,127,255,.03));border-color:rgba(107,122,156,.3);}
.sj-head{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
.sj-badge{font-size:24px;}
.sj-main{flex:1;}
.sj-title{font-size:14px;font-weight:800;}
.sj-direct .sj-title{color:var(--success);}
.sj-partial .sj-title{color:var(--warn);}
.sj-non .sj-title{color:var(--muted);}
.sj-subtitle{font-size:11px;color:var(--muted);margin-top:2px;}
.sj-desc{font-size:12px;color:rgba(13,27,46,.75);line-height:1.7;margin-bottom:8px;}
.sj-actions{display:flex;gap:6px;flex-wrap:wrap;}
.sj-action{padding:7px 14px;border-radius:7px;font-size:12px;font-weight:700;border:1px solid;text-decoration:none;transition:all .2s;cursor:pointer;}
.sj-action-primary{background:rgba(26,127,255,.1);color:var(--accent);border-color:rgba(26,127,255,.35);}
.sj-action-danger{background:rgba(229,57,53,.08);color:var(--danger);border-color:rgba(229,57,53,.3);}
.sj-action-warn{background:rgba(230,138,0,.08);color:var(--warn);border-color:rgba(230,138,0,.3);}
.sj-action-muted{background:var(--surface2);color:var(--muted);border-color:var(--border);}
.topo-chain{display:flex;align-items:center;gap:0;margin-bottom:8px;overflow-x:auto;padding-bottom:4px;}
.topo-node{min-width:80px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:8px 10px;text-align:center;flex-shrink:0;}
.topo-node.current{border-color:var(--danger);background:rgba(229,57,53,.04);}
.topo-node.upstream{border-color:rgba(230,138,0,.4);background:rgba(230,138,0,.03);}
.topo-node.downstream{border-color:rgba(26,127,255,.3);background:rgba(26,127,255,.03);}
.topo-node-icon{font-size:16px;}
.topo-node-name{font-size:11px;font-weight:600;margin-top:3px;}
.topo-node-desc{font-size:9px;color:var(--muted);margin-top:2px;line-height:1.4;}
.topo-arrow{font-size:16px;color:var(--muted);padding:0 4px;flex-shrink:0;}
.topo-label{font-size:10px;font-weight:700;padding:2px 6px;border-radius:10px;display:block;margin-bottom:3px;}
.topo-node.upstream .topo-label{color:var(--warn);background:rgba(230,138,0,.1);}
.topo-node.current .topo-label{color:var(--danger);background:rgba(229,57,53,.1);}
.topo-node.downstream .topo-label{color:var(--accent);background:rgba(26,127,255,.1);}
.pd-sat-chart{display:flex;flex-direction:column;gap:7px;}
.pd-sat-row{display:flex;align-items:center;gap:9px;}
.pd-sat-name{font-size:11px;color:var(--muted);width:90px;flex-shrink:0;text-align:right;}
.pd-sat-track{flex:1;height:16px;background:var(--border);border-radius:4px;overflow:hidden;position:relative;}
.pd-sat-fill{height:100%;border-radius:4px;display:flex;align-items:center;justify-content:flex-end;padding-right:5px;}
.pd-sat-pct{font-size:10px;font-weight:700;color:white;}
.pd-sat-threshold{position:absolute;top:0;bottom:0;width:2px;background:rgba(0,0,0,.25);z-index:1;}
.phase-diagram{display:flex;gap:4px;align-items:flex-end;padding:8px 0;overflow-x:auto;}
.phase-bar-group{display:flex;flex-direction:column;align-items:center;gap:3px;flex:1;min-width:55px;}
.phase-bar-label{font-size:9px;color:var(--muted);text-align:center;line-height:1.2;}
.priority-table{width:100%;min-width:680px;border-collapse:collapse;font-size:12px;}
.priority-table th{background:var(--surface2);padding:7px 9px;text-align:left;font-weight:700;color:var(--muted);border-bottom:2px solid var(--border);white-space:nowrap;}
.priority-table td{padding:7px 9px;border-bottom:1px solid var(--border);vertical-align:top;}
.count-row{display:flex;gap:7px;margin-bottom:9px;}
.count-card{flex:1;text-align:center;background:var(--surface2);border-radius:8px;padding:8px;border:1px solid var(--border);}
.count-num{font-size:18px;font-weight:800;}
.count-lbl{font-size:10px;color:var(--muted);}

/* ========== TAB 3: CONTROL STRATEGY ========== */
.detail-tabs{display:flex;gap:0;border-bottom:1px solid var(--border);margin-bottom:10px;flex-wrap:wrap;}
.dtab{padding:6px 10px;border:none;background:none;font-size:11px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;transition:all .15s;white-space:normal;text-align:left;}
.dtab.active{color:var(--accent);border-bottom-color:var(--accent);}
.detail-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:7px;}
.detail-item{background:var(--surface2);border:1px solid var(--border);border-radius:7px;padding:8px 9px;}
.di-label{font-size:9px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:3px;}
.di-val{font-size:11px;line-height:1.5;}
.di-val.danger{color:var(--danger);}
.di-val.warn{color:var(--warn);}
.di-val.ok{color:var(--success);}
.compare-wrap{display:flex;gap:8px;min-width:360px;}
.compare-panel{flex:1;border-radius:7px;padding:8px 10px;border:1px solid;}
.compare-before{border-color:rgba(229,57,53,.2);background:rgba(229,57,53,.04);}
.compare-after{border-color:rgba(29,164,98,.2);background:rgba(29,164,98,.04);}
.cp-head{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px;}
.compare-before .cp-head{color:var(--danger);}
.compare-after .cp-head{color:var(--success);}
.cp-row{display:flex;justify-content:space-between;font-size:11px;margin-bottom:3px;}
.cp-key{color:var(--muted);}
.diag-ctx-card{border-radius:8px;border:1px solid rgba(26,127,255,.15);background:linear-gradient(135deg,rgba(26,127,255,.04),rgba(0,181,163,.02));padding:10px;}
.dcc-head{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
.dcc-badge{font-size:20px;}
.dcc-title{font-size:12px;font-weight:800;color:var(--accent);}
.dcc-subtitle{font-size:10px;color:var(--muted);margin-top:1px;}
.dcc-chips{display:flex;gap:5px;flex-wrap:wrap;}
.dcc-chip{padding:2px 7px;border-radius:20px;font-size:10px;font-weight:600;border:1px solid;}
.dcc-chip-signal{color:var(--success);background:rgba(29,164,98,.06);border-color:rgba(29,164,98,.2);}
.dcc-chip-mode{color:var(--accent);background:rgba(26,127,255,.06);border-color:rgba(26,127,255,.2);}
.dcc-chip-obj{color:var(--accent);background:rgba(26,127,255,.06);border-color:rgba(26,127,255,.2);}

/* ========== TAB 4: PLAN GENERATION ========== */
.plan-meta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;}
.meta-chip{display:flex;flex-direction:column;align-items:center;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:8px 12px;min-width:80px;}
.meta-val{font-size:18px;font-weight:800;color:var(--accent2);}
.meta-lbl{font-size:9px;color:var(--muted);margin-top:2px;}
.plan-table{width:100%;min-width:760px;border-collapse:collapse;font-size:11px;}
.plan-table th{background:var(--surface2);padding:7px 8px;text-align:left;font-weight:700;color:var(--muted);border-bottom:2px solid var(--border);white-space:nowrap;}
.plan-table td{padding:7px 8px;border-bottom:1px solid var(--border);vertical-align:middle;}
.plan-table tr:hover td{background:rgba(0,181,163,.04);}
.plan-table tr.selected-row td{background:rgba(0,181,163,.08);}
.sat-mini{width:50px;height:8px;background:var(--border);border-radius:3px;overflow:hidden;display:inline-block;vertical-align:middle;margin-right:3px;}
.sat-mini-fill{height:100%;border-radius:3px;}
/* ── Phase Timeline v2 ── */
.ptl2-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;justify-content:flex-start;}
.ptl2-card{min-width:0;border-radius:14px;border:1.5px solid var(--border);padding:18px 14px 14px;text-align:center;background:#fff;position:relative;transition:box-shadow .18s,transform .18s;box-shadow:0 2px 10px rgba(26,127,255,.06);}
.ptl2-card:hover{box-shadow:0 6px 24px rgba(26,127,255,.13);transform:translateY(-2px);}
.ptl2-card-num{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.04em;padding:3px 12px;border-radius:20px;margin-bottom:12px;}
.ptl2-card-icon{margin:0 auto 10px;display:block;}
.ptl2-card-divider{width:32px;height:2px;border-radius:2px;margin:10px auto;}
.ptl2-card-name{font-size:13px;font-weight:600;color:var(--text);margin-bottom:10px;line-height:1.4;}
.ptl2-card-time{font-size:36px;font-weight:800;line-height:1;letter-spacing:-.02em;}
.ptl2-card-unit{font-size:13px;font-weight:600;vertical-align:bottom;margin-left:2px;}
.ptl2-card-ratio{font-size:11px;color:var(--muted);margin-top:4px;}
.ptl2-card-sat-wrap{margin-top:12px;padding-top:10px;border-top:1px solid var(--border);}
.ptl2-card-sat-label{font-size:10px;color:var(--muted);margin-bottom:5px;text-align:left;}
.ptl2-card-sat-bar{height:6px;border-radius:3px;background:var(--border);overflow:hidden;}
.ptl2-card-sat-fill{height:100%;border-radius:3px;transition:width .6s ease;}
.ptl2-card-sat-val{font-size:12px;font-weight:800;margin-top:5px;text-align:right;}
/* Legacy ptl- rows (not rendered, kept for compat) */
.ptl-row{display:flex;align-items:center;gap:8px;margin-bottom:0;}
.ptl-name{font-size:10px;width:72px;flex-shrink:0;text-align:right;font-weight:600;color:var(--muted);line-height:1.3;}
.ptl-bar-wrap{flex:1;height:26px;position:relative;background:rgba(229,57,53,.07);border-radius:4px;overflow:hidden;border:1px solid rgba(229,57,53,.12);}
.ptl-green{position:absolute;top:2px;bottom:2px;border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:white;}
.ptl-yellow{position:absolute;top:2px;bottom:2px;width:5px;border-radius:2px;}
.ptl-cycle{position:absolute;right:4px;top:50%;transform:translateY(-50%);font-size:9px;color:var(--muted);}
.check-item{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:7px;border:1px solid;margin-bottom:5px;font-size:11px;}
.check-pass{border-color:rgba(29,164,98,.2);background:rgba(29,164,98,.04);}
.check-warn{border-color:rgba(230,138,0,.2);background:rgba(230,138,0,.04);}
.check-fail{border-color:rgba(229,57,53,.2);background:rgba(229,57,53,.04);}
.gain-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;}
.gain-card{background:var(--surface2);border:1px solid var(--border);border-radius:7px;padding:8px;text-align:center;}
.gain-val{font-size:18px;font-weight:800;}
.gain-lbl{font-size:9px;color:var(--muted);margin-top:2px;}
.gain-pos{color:var(--success);}
.st-svg{width:100%;min-height:420px;background:#fff;border-radius:8px;border:1px solid var(--border);cursor:default;}
.chan-row{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap;}
.chan-left{flex:1 1 320px;min-width:280px;overflow-x:auto;}
.chan-right{flex:1;min-width:0;}
.chan-svg{width:100%;display:block;filter:drop-shadow(0 4px 12px rgba(15,23,42,.06));}
.pg-sat-row{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
.pg-sat-label{width:72px;flex-shrink:0;font-size:11px;font-weight:600;color:var(--muted);text-align:right;}
.pg-sat-track{flex:1;height:18px;background:var(--surface2);border:1px solid var(--border);border-radius:4px;position:relative;overflow:hidden;}
.pg-sat-fill{height:100%;border-radius:3px;transition:width .5s;}
.pg-sat-mark{position:absolute;top:0;bottom:0;width:1px;}
.pg-sat-info{font-size:10px;color:var(--muted);margin-top:-2px;padding-left:80px;margin-bottom:6px;}
.pg-sat-val{width:46px;flex-shrink:0;text-align:right;font-size:12px;font-weight:700;}
.area-kpi-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;}
.area-kpi{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:8px 12px;min-width:90px;text-align:center;}
.area-kpi-val{font-size:15px;font-weight:800;color:var(--accent2);margin:2px 0;}
.area-kpi-lbl{font-size:9px;color:var(--muted);}

/* ========== TAB 5: EVALUATION FEEDBACK ========== */
.score-banner{display:flex;align-items:center;gap:16px;padding:14px 16px;border-radius:10px;margin-bottom:12px;}
.score-banner.pass{background:rgba(29,164,98,.06);border:1px solid rgba(29,164,98,.3);}
.score-banner.fail{background:rgba(229,57,53,.06);border:1px solid rgba(229,57,53,.3);}
.score-num{font-size:48px;font-weight:900;line-height:1;}
.score-pass{color:var(--success);}
.score-fail{color:var(--danger);}
.score-meta{flex:1;}
.score-conclusion{font-size:16px;font-weight:700;}
.score-detail{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.6;}
.impr-table{width:100%;min-width:720px;border-collapse:collapse;font-size:12px;}
.impr-table th{background:var(--surface2);padding:8px 10px;text-align:left;font-weight:700;color:var(--muted);border-bottom:2px solid var(--border);white-space:nowrap;}
.impr-table td{padding:9px 10px;border-bottom:1px solid var(--border);vertical-align:middle;}
.delta-bar{height:16px;background:var(--border);border-radius:3px;overflow:hidden;position:relative;width:80px;display:inline-block;vertical-align:middle;}
.delta-fill{height:100%;border-radius:3px;transition:width .6s ease;}
.delta-ok{background:var(--success);}
.delta-fail{background:var(--danger);}
.target-marker{position:absolute;top:0;bottom:0;width:2px;background:rgba(0,0,0,.3);}
.side-effect-item{display:flex;align-items:flex-start;gap:8px;padding:9px 10px;border-radius:7px;border:1px solid;margin-bottom:6px;font-size:12px;}
.se-low{border-color:rgba(26,127,255,.2);background:rgba(26,127,255,.04);}
.se-mid{border-color:rgba(230,138,0,.2);background:rgba(230,138,0,.04);}
.se-high{border-color:rgba(229,57,53,.2);background:rgba(229,57,53,.04);}
.run-step{display:flex;gap:10px;margin-bottom:8px;}
.run-dot{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;border:2px solid;}

function PG(p){ return p.greenTime ?? p.green ?? 0; }
function PN(p){ return p.phaseName ?? p.name ?? ''; }
function translateStrategy(v){const m={'green_wave':'绿波协调','corridor_coordination':'干线协调','area_optimization':'区域均衡优化','queue_reduction':'排队消散','delay_reduction':'降低延误','peak_hour':'高峰疏导','off_peak':'低峰节能','bidirectional':'双向绿波','oneway_forward':'单向绿波（正向）','oneway_reverse':'单向绿波（反向）','bidirectional_no_double_stop':'双向绿波+抑制双停','adaptive':'自适应控制','fixed_time':'定时控制','coordination':'协调控制','tidal_lane':'潮汐车道协调','signal_priority':'公交优先'};return(v&&m[v])?m[v]:(v||'');}
function translateDirection(v){const m={'bidirectional':'双向绿波','oneway_forward':'单向（正向优先）','oneway_reverse':'单向（反向优先）','bidirectional_no_double_stop':'双向绿波+抑制双停','forward':'正向','reverse':'反向'};return(v&&m[v])?m[v]:(v||'');}

function translateStatus(v){const m={'executed':'已执行','generating':'生成中','pending':'待执行','failed':'失败'};return(v&&m[v])?m[v]:(v||'—');}
function phaseLabel(idx){ return '相位' + String.fromCharCode(65+idx); }

const COORDINATION_STRATEGY_OPTIONS = [
  {value:'bidirectional',label:'双向绿波'},
  {value:'bidirectional_no_double_stop',label:'双向绿波 + 抑制双停'},
  {value:'oneway_forward',label:'单向绿波（正向优先）'},
  {value:'oneway_reverse',label:'单向绿波（反向优先）'},
];

function isCoordinationStrategy(v){
  return COORDINATION_STRATEGY_OPTIONS.some(item=>item.value===v);
}

function pgInferCorridorAxis(plan, obj){
  const src=[obj?.direction,obj?.name,plan?.targetName].filter(Boolean).join('|');
  if(/南北/.test(src)) return 'ns';
  if(/东西/.test(src)) return 'ew';
  return 'ew';
}

function pgBandwidthLabels(plan, obj){
  return pgInferCorridorAxis(plan, obj)==='ns'
    ? {forward:'北向带宽',reverse:'南向带宽',coordPhase:'南北直行'}
    : {forward:'东向带宽',reverse:'西向带宽',coordPhase:'东西直行'};
}

function pgGetSelectedCoordinationStrategy(plan){
  if(isCoordinationStrategy(plan?.__selectedCoordinationStrategy)) return plan.__selectedCoordinationStrategy;
  if(isCoordinationStrategy(plan?.strategy)) return plan.strategy;
  if(isCoordinationStrategy(plan?.coordination?.strategy)) return plan.coordination.strategy;
  if(isCoordinationStrategy(plan?.planParams?.direction)) return plan.planParams.direction;
  return 'bidirectional';
}

function pgDetectCoordPhase(inter, plan, obj){
  const phases=(inter?.phases||[]).filter(p=>PG(p)>0);
  if(!phases.length) return null;
  const axis=pgInferCorridorAxis(plan, obj);
  const preferredRe=axis==='ns'
    ? /(南北.*直行|直行.*南北|南向直行|北向直行)/
    : /(东西.*直行|直行.*东西|东向直行|西向直行)/;
  const preferred=phases.filter(p=>preferredRe.test(PN(p)));
  if(preferred.length) return preferred.reduce((best,item)=>PG(item)>PG(best)?item:best);
  const straight=phases.filter(p=>/直行/.test(PN(p)));
  if(straight.length) return straight.reduce((best,item)=>PG(item)>PG(best)?item:best);
  return phases.reduce((best,item)=>PG(item)>PG(best)?item:best);
}

function pgPhaseMovementsFromName(name){
  const n=(name||'').replace(/\s/g,'');
  if(/东西.*直行|直行.*东西/.test(n)) return [{dir8No:3,turnDirNo:2,label:'东直'},{dir8No:7,turnDirNo:2,label:'西直'}];
  if(/南北.*直行|直行.*南北/.test(n)) return [{dir8No:1,turnDirNo:2,label:'北直'},{dir8No:5,turnDirNo:2,label:'南直'}];
  if(/东西.*左转|左转.*东西/.test(n)) return [{dir8No:3,turnDirNo:1,label:'东左'},{dir8No:7,turnDirNo:1,label:'西左'}];
  if(/南北.*左转|左转.*南北/.test(n)) return [{dir8No:1,turnDirNo:1,label:'北左'},{dir8No:5,turnDirNo:1,label:'南左'}];
  if(/左转/.test(n)) return [{dir8No:3,turnDirNo:1,label:'左转'}];
  if(/直行/.test(n)) return [{dir8No:3,turnDirNo:2,label:'直行'}];
  return [{dir8No:3,turnDirNo:2,label:n||'直行'}];
}

  const initPhase = parseInt(qs.get('phase'));

  if(initPhase>=1 && initPhase<=5) activePhase = initPhase;
  updateWorkbenchChrome();

  try{
    const [overviewRes, rr, cr, ir, runsRes, plansRes, evalsRes, arunsRes, topoRes, cfgRes] = await Promise.all([
      fetch(`${API}/v1/demo/overview`),
      fetch(`${API}/v1/demo/regions`),
      fetch(`${API}/v1/demo/corridors`),
      fetch(`${API}/v1/demo/intersections`),
      fetch(`${API}/v1/demo/runs?limit=50`),
      fetch(`${API}/v1/demo/plans`),
      fetch(`${API}/v1/demo/evaluations`),
      fetch(`${API}/v1/demo/agent-runs`),
      fetch(`${API}/v1/demo/topology`),
      fetch(`${API}/v1/demo/frontend-config`),
    ]);
    const overview = await overviewRes.json();
    const {regions} = await rr.json();
    const {corridors} = await cr.json();
    const {intersections} = await ir.json();
    const runsData = await runsRes.json();
    activeRuns = runsData.runs||[];
    plans = (await plansRes.json()).plans||[];
    evaluations = (await evalsRes.json()).evaluations||[];
    agentRuns = (await arunsRes.json()).agentRuns||[];
    const topologyLinks = topoRes.ok ? ((await topoRes.json()).topologyLinks||[]) : [];
    mapConfig = await cfgRes.json();

    demoData = {overview, regions, corridors, intersections, topologyLinks};
    demoIndex = {
      region: new Map(regions.map(r=>[r.id,r])),
      corridor: new Map(corridors.map(c=>[c.id,c])),
      intersection: new Map(intersections.map(i=>[i.id,i])),
      corridorByIntersection: new Map(),
    };
    corridors.forEach(c=>{ (c.intersectionIds||[]).forEach(id=>{ if(!demoIndex.corridorByIntersection.has(id)) demoIndex.corridorByIntersection.set(id,c.id); }); });

    if(initTab && ['bgIssue','dynIssue','optimizing','completed'].includes(initTab)){
      wbCurrentTab = initTab;
    }
    buildObjectPool(regions, corridors, intersections);
    if(initTab) switchWbTab(wbCurrentTab);
    await initWbMap();
    syncWbMapWithWorkbench();

    if(initId && initType){
      const obj = demoIndex[initType]?.get(initId);
      if(obj) selectObject(initType, obj);
    }

    setInterval(refreshRuns, 8000);
  }catch(e){
    document.getElementById('poolScroll').innerHTML = `<div class="pool-empty" style="color:var(--danger)">数据加载失败：${e.message}</div>`;
  }
}

/* ===== OBJECT POOL ===== */
let wbCategories = { bgIssue:[], dynIssue:[], optimizing:[], completed:[] };
let wbCurrentTab = 'bgIssue';

function getRunForObj(objId){ return activeRuns.find(r=>r.targetId===objId)||null; }
function getPlanForObj(objId){ return plans.find(p=>p.targetId===objId||p.target_id===objId)||null; }
function getEvalForObj(objId){ return evaluations.find(e=>e.targetId===objId||e.target_id===objId)||null; }

function getWorkbenchItemStatus(obj, run){
  if(run){
    if(run.automationStatus==='pending_approval') return {cls:'pib-warning', label:'待审批'};
    if(run.automationStatus==='manual_takeover') return {cls:'pib-critical', label:'人工接管'};
    if(run.status==='running') return {cls:'pib-running', label:'优化中'};
    if(run.status==='completed'&&run.evaluationStatus==='meets_target') return {cls:'pib-ok', label:'已达标'};
    if(run.status==='completed') return {cls:'pib-warning', label:'未达标'};
  }
  if(obj.status==='critical') return {cls:'pib-critical', label:'严重'};
  if(obj.status==='warning') return {cls:'pib-warning', label:'预警'};
  if(obj.status==='optimizing') return {cls:'pib-running', label:'优化中'};
  if(obj.status==='optimized') return {cls:'pib-ok', label:'已优化'};
  return {cls:'pib-ok', label:'正常'};
}

function buildObjectPool(regions, corridors, intersections){
  const bgIssue=[],dynIssue=[],optimizing=[],completed=[];
  function classify(obj, type){
    const run = getRunForObj(obj.id);
    const o = {...obj, _type:type};
    POOL_STORE.set(obj.id, o);
    const issues = obj.issues||[];
    const hasDynamic = issues.some(i=>(i.id||'').startsWith('dynamic_'));
    const hasStatic = issues.some(i=>(i.id||'').startsWith('signal_')||(i.id||'').startsWith('static_'));
    if(obj.status==='optimized'||(run&&run.status==='completed')) completed.push(o);
    else if(obj.status==='optimizing'||(run&&run.status==='running')) optimizing.push(o);
    else if(hasDynamic) dynIssue.push(o);
    else if(hasStatic) bgIssue.push(o);
  }
  regions.forEach(r=>classify(r,'region'));
  corridors.forEach(c=>classify(c,'corridor'));
  intersections.forEach(i=>classify(i,'intersection'));
  activeRuns.filter(r=>r.status==='completed').forEach(r=>{
    const targetId = r.targetId||r.target_id;
    const targetType = r.targetType||r.target_type;
    const targetName = r.targetName||r.target_name||'';
    if(!completed.find(o=>o.id===targetId)){
      const o = { id:targetId, name:targetName, status:'optimized', saturation:0, _type:targetType };
      POOL_STORE.set(targetId, o);
      completed.push(o);
    }
  });
  wbCategories = { bgIssue, dynIssue, optimizing, completed };
  allObjects = [...new Map([...bgIssue,...dynIssue,...optimizing,...completed].map(o=>[o.id,o])).values()];
  document.getElementById('wbCnt_bgIssue').textContent = bgIssue.length;
  document.getElementById('wbCnt_dynIssue').textContent = dynIssue.length;
  document.getElementById('wbCnt_optimizing').textContent = optimizing.length;
  document.getElementById('wbCnt_completed').textContent = completed.length;
  renderPoolForTab(wbCurrentTab);
}

function switchWbTab(tab){
  wbCurrentTab = tab;
  document.querySelectorAll('#wbTabs .pool-tab').forEach(t=>t.classList.toggle('active', t.dataset.tab===tab));
  renderPoolForTab(tab);
}

function renderPoolForTab(tab){
  const items = wbCategories[tab]||[];
  const el = document.getElementById('poolScroll');
  if(!items.length){
    const labels = {bgIssue:'背景方案问题',dynIssue:'动态异常',optimizing:'正在优化',completed:'已完成'};
    el.innerHTML = `<div class="pool-empty">暂无${labels[tab]||''}对象</div>`;
    return;
  }
  el.innerHTML = items.map(obj=>buildPoolItem(obj)).join('');
}

function buildPoolItem(obj){
  POOL_STORE.set(obj.id, obj);
  const dotCls = obj.status==='critical'?'pd-critical':obj.status==='warning'?'pd-warning':obj.status==='optimizing'?'pd-info':obj.status==='optimized'?'pd-ok':'pd-info';
  const run = getRunForObj(obj.id);
  const itemStatus = getWorkbenchItemStatus(obj, run);
  const sat = obj.saturation||obj.stopRate||0;
  const firstIssue = (obj.issues||[])[0];
  const desc = firstIssue?(firstIssue.name||issueLabel(firstIssue.id||firstIssue)):(sat>0?`饱和度 ${Math.round(sat*100)}%`:(obj.actualSpeedKmh?`车速 ${obj.actualSpeedKmh}km/h`:''));
  const typeTag = TYPE_LABELS[obj._type]||'';
  return `<div class="pool-item" id="pi_${obj.id}" onclick="selectObject('${obj._type}','${obj.id}')">
    <div class="pool-dot ${dotCls}"></div>
    <div class="pool-item-info">
      <div class="pool-item-name"><span style="font-size:9px;font-weight:700;padding:1px 5px;border-radius:4px;margin-right:3px;vertical-align:middle;background:${{region:'rgba(26,127,255,.12)',corridor:'rgba(0,181,163,.12)',intersection:'rgba(108,58,203,.1)'}[obj._type]||'rgba(26,127,255,.12)'};color:${{region:'var(--accent)',corridor:'var(--accent2)',intersection:'var(--purple)'}[obj._type]||'var(--accent)'}">${typeTag}</span>${obj.name}</div>
      <div class="pool-item-desc">${desc}</div>
    </div>
    <span class="pool-item-badge ${itemStatus.cls}">${itemStatus.label}</span>
  </div>`;
}

function issueLabel(id){
  return {dynamic_high_saturation:'高饱和拥堵',dynamic_low_speed:'车速偏低',dynamic_high_delay:'延误偏高',dynamic_demand_supply_imbalance:'供需失衡',static_road_network_sparse:'路网稀疏',static_parking_supply_gap:'停车缺口',signal_queue_overflow:'排队溢流',signal_green_waste:'绿灯空放',signal_phase_imbalance:'相位失衡'}[id]||id;
}

function priorityLevel2cls(level){
  return {P0:'pib-critical',P1:'pib-warning',P2:'pib-running',P3:'pib-ok'}[level]||'pib-warning';
}

function issueCategory2icon(cat){
  return {dynamic:'⚡',signal_control:'🚦',static:'📋'}[cat]||'⚠️';
}

function fmtEvidence(evidence){
  return Object.entries(evidence||{}).map(([k,v])=>{
    const label = EVIDENCE_LABELS[k]||k;
    const val = Array.isArray(v) ? v.join('、') : v;
    return `<span class="ev-chip"><span class="ev-label">${label}</span><span class="ev-val">${val}</span></span>`;
  }).join('');
}

function getIntersectionPosition(inter){

function filterPool(kw){
  const q = kw.trim().toLowerCase();
  document.querySelectorAll('.pool-item').forEach(el=>{
    el.style.display = q&&!el.textContent.toLowerCase().includes(q)?'none':'';
  });
}

/* ===== SELECT OBJECT ===== */
function selectObject(type, objOrId){
  let obj = objOrId;
  if(typeof obj === 'string'){
    if(POOL_STORE.has(obj)) obj = POOL_STORE.get(obj);
    else if(demoIndex?.[type]?.has(obj)) obj = demoIndex[type].get(obj);
    else { try{ obj = JSON.parse(obj.replace(/&quot;/g,'"').replace(/&#39;/g,"'")); }catch(e){ return; } }
  }
  if(!obj) return;
  currentObj = obj;
  currentObjType = type;
  document.querySelectorAll('.pool-item').forEach(el=>el.classList.remove('active'));
  const el = document.getElementById(`pi_${obj.id}`);
  if(el){ el.classList.add('active'); el.scrollIntoView({block:'nearest'}); }
  updateWorkbenchChrome();
  renderPhaseContent(type, obj);
  focusCurrentObjectOnWbMap();
}

  const maxH=Math.max(...hourPattern);
  const hc=document.getElementById('scHourChart');
  if(hc) hc.innerHTML=hourPattern.map((v,i)=>{const pct=Math.round(v/maxH*100);const isPeakAM=i>=7&&i<=9;const isPeakPM=i>=17&&i<=19;const isLunch=i>=11&&i<=13;const color=(isPeakAM||isPeakPM)?'#e53935':isLunch?'#e68a00':'#1a7fff';return `<div class="hour-bar" style="height:${pct}%;background:${color};opacity:.85" title="${i}时: ${v}%"></div>`;}).join('');
  const hl=document.getElementById('scHourLabels');
  if(hl) hl.innerHTML=[0,4,8,12,16,20,23].map(h=>`<span class="hour-label">${h}时</span>`).join('');
  const pc=document.getElementById('scPatternChips');
  if(pc) pc.innerHTML=`<span class="pattern-chip pc-peak">🌅 早高峰 7-9时</span><span class="pattern-chip pc-peak">🌆 晚高峰 17-19时</span><span class="pattern-chip pc-normal">🕛 午间平峰 11-13时</span><span class="pattern-chip pc-low">🌙 夜间低谷 22-6时</span>`;
}

function scRenderProfile(obj, type){
  const profile=obj.profile||{}, s=profile.supply||{}, d=profile.demand||{}, st=profile.state||{};
  const resolvedType=type||((obj.id||'').startsWith('RGN-')?'region':(obj.id||'').startsWith('COR-')?'corridor':'intersection');
  const sat=st.saturation??obj.saturation??0, dsr=d.demandSupplyRatio??0;
  const el=document.getElementById('scProfileGrid');if(!el)return;
  const isNil=v=>v===undefined||v===null||v==='';
  const safeNumber=v=>Number.isFinite(Number(v))?Number(v):null;
  const fmtNum=(v,digits=0)=>{const n=safeNumber(v);return n===null?'—':n.toLocaleString('zh-CN',{minimumFractionDigits:digits,maximumFractionDigits:digits});};
  const fmtPct=(v,digits=0)=>{const n=safeNumber(v);return n===null?'—':`${(n*100).toFixed(digits)}%`;};
  const fmtText=v=>{
    if(isNil(v)) return '—';
    if(Array.isArray(v)) return v.filter(Boolean).join(' / ')||'—';
    if(typeof v==='object') return Object.entries(v).filter(([,val])=>!isNil(val)).map(([key,val])=>`${key}${typeof val==='number'&&val<=1?` ${fmtPct(val)}`:` ${val}`}`).join(' / ')||'—';
    return String(v);
  };
  const toneByThreshold=(value,{warn,danger,reverse=false}={})=>{
    const n=safeNumber(value);
    if(n===null) return 'var(--text)';
    if(reverse){
      if(danger!==undefined&&n<=danger) return 'var(--danger)';
      if(warn!==undefined&&n<=warn) return 'var(--warn)';
      return 'var(--success)';
    }
    if(danger!==undefined&&n>=danger) return 'var(--danger)';
    if(warn!==undefined&&n>=warn) return 'var(--warn)';
    return 'var(--success)';

  const pItem=(label,val,color='var(--text)')=>`<div class="profile-item"><span class="profile-label">${label}</span><span class="profile-val" style="color:${color}">${val}</span></div>`;

  let supplyItems=[], demandItems=[], stateItems=[], supplyNote='', demandNote='', stateNote='';

    demandItems=[

      {label:'进入流量',val:`${fmtNum(d.inboundFlow||obj.inFlow)} pcu/h`,color:toneByThreshold(d.inboundFlow||obj.inFlow,{warn:3200,danger:4200})},

      {label:'在途量',val:`${fmtNum(d.inTransitVehicles||obj.transitVolume)} 辆`,color:toneByThreshold(d.inTransitVehicles||obj.transitVolume,{warn:9000,danger:12000})},
      {label:'过境量',val:`${fmtNum(d.throughTrafficVolume)} pcu/h`,color:toneByThreshold(d.throughTrafficVolume,{warn:900,danger:1400})},
      {label:'分目的出行',val:fmtText(d.purposeTripStructure)},
      {label:'区域流量差异',val:fmtText(d.flowDistributionPattern)},
      {label:'时段波动特征',val:fmtText(d.typicalTimePattern)}
    ];
    stateItems=[
      {label:'饱和度',val:safeNumber(sat)===null?'—':sat.toFixed(2),color:toneByThreshold(sat,{warn:0.7,danger:0.85})},
      {label:'平均车速',val:`${fmtNum(st.avgSpeed||obj.avgSpeed,1)} km/h`,color:toneByThreshold(st.avgSpeed||obj.avgSpeed,{warn:28,danger:20,reverse:true})},

      {label:'拥堵阶段',val:fmtText(st.congestionPhase)},

      {label:'行人过街干扰',val:fmtText(s.pedestrianInterference),color:toneByThreshold(s.pedestrianInterferenceIndex,{warn:0.45,danger:0.65})},
      {label:'公交站点干扰',val:fmtText(s.busStopInterference),color:toneByThreshold(s.busStopInterferenceIndex,{warn:0.45,danger:0.65})},
      {label:'出入口干扰',val:fmtText(s.accessInterference),color:toneByThreshold(s.accessInterferenceIndex,{warn:0.45,danger:0.65})},
      {label:'交叉道路等级',val:fmtText(s.crossRoadHierarchy)},
      {label:'绿波设计带宽',val:`${fmtNum(s.bandwidthDesign)} s`,color:toneByThreshold(st.bandwidth,{warn:8,danger:2,reverse:true})}
    ];
    demandItems=[
      {label:'机动车出行量',val:`${fmtNum(d.motorVehicleTripVolume||d.motorVehicleTrips)} 次/日`,color:toneByThreshold(d.motorVehicleTripVolume||d.motorVehicleTrips,{warn:26000,danger:36000})},

      {label:'干线离开流量',val:`${fmtNum(d.outboundFlow)} pcu/h`},

      {label:'路段流量分布',val:fmtText(d.segmentFlowPattern)},
      {label:'潮汐方向',val:fmtText(d.tidalDirection||d.flowDirectionFocus)},
      {label:'供需比',val:safeNumber(dsr)===null?'—':dsr.toFixed(2),color:toneByThreshold(dsr,{warn:0.9,danger:1.02})}

    stateItems=[

      {label:'运行效率指数',val:`${fmtNum(st.operationEfficiencyIndex,0)}`,color:toneByThreshold(st.operationEfficiencyIndex,{warn:72,danger:58,reverse:true})},
      {label:'拥堵阶段',val:fmtText(st.congestionPhase)},
      {label:'拥堵画像',val:fmtText(st.congestionPortrait||st.queueBackward||st.bottleneckNode)}

      {label:'路口通行能力',val:`${fmtNum(s.intersectionCapacity)} pcu/h`,color:toneByThreshold(d.peakHourFlow&&s.intersectionCapacity?d.peakHourFlow/s.intersectionCapacity:null,{warn:0.88,danger:1.02})},

    ];
    stateItems=[

      {label:'平均延误',val:`${fmtNum(st.avgDelay||obj.delay,1)} s`,color:toneByThreshold(st.avgDelay||obj.delay,{warn:55,danger:90})},
      {label:'排队长度',val:`${fmtNum(st.queueLength||obj.queueLength)} m`,color:toneByThreshold(st.queueLength||obj.queueLength,{warn:100,danger:160})},
      {label:'停车率',val:fmtPct(st.stopRate||obj.stopRate),color:toneByThreshold(st.stopRate||obj.stopRate,{warn:0.45,danger:0.65})},
      {label:'运行效率指数',val:`${fmtNum(st.operationEfficiencyIndex,0)}`,color:toneByThreshold(st.operationEfficiencyIndex,{warn:70,danger:55,reverse:true})},
      {label:'拥堵阶段',val:fmtText(st.congestionPhase)},
      {label:'拥堵画像',val:fmtText(st.congestionPortrait)}
    ];

  }

  el.innerHTML=[

async function scLoadLLM(obj){
  const el=document.getElementById('scLLM');if(!el)return;
  el.innerHTML=`<div style="color:var(--muted);font-size:12px"><span class="spin"></span> 正在调用大模型解读三维画像…</div>`;

  }catch(e){ el.innerHTML=`<div class="fallback-note">调用失败：${e.message}</div>`; }
}

function pdGetIssueName(id){return{dynamic_high_saturation:'高饱和运行',dynamic_low_speed:'车速偏低',dynamic_high_delay:'延误偏高',static_road_network_sparse:'路网密度不足',static_parking_supply_gap:'停车缺口',dynamic_demand_supply_imbalance:'供需失衡',signal_queue_overflow:'排队溢流',signal_green_waste:'空放浪费',signal_phase_imbalance:'相位失衡'}[id]||id;}

function pdRenderSatChart(obj){
  const el=document.getElementById('pdSatChart');if(!el)return;

    const metrics=[{name:'综合饱和度',val:obj.saturation||0},{name:'停车率',val:obj.stopRate||0},{name:'供需比',val:obj.profile?.demand?.demandSupplyRatio||0}].filter(m=>m.val>0);
    if(!metrics.length){document.getElementById('pdSatChartSection').style.display='none';return;}
    el.innerHTML=metrics.map(m=>{const pct=Math.min(100,m.val*100);const color=pct>85?'var(--danger)':pct>70?'var(--warn)':'var(--success)';return `<div class="pd-sat-row"><span class="pd-sat-name">${m.name}</span><div class="pd-sat-track"><div class="pd-sat-fill" style="width:${pct}%;background:${color}"><span class="pd-sat-pct">${pct.toFixed(0)}%</span></div><div class="pd-sat-threshold" style="left:85%"></div></div></div>`;}).join('');

function pdRenderTopoChain(obj, type){
  const chain=document.getElementById('pdTopoChain');const narrative=document.getElementById('pdTopoNarrative');

  let nodes=[];
  if(type==='intersection'){
    nodes=[{cls:'upstream',label:'上游方向',icon:'📍',name:'上游来车',desc:'持续压力输入'},{cls:'current',label:'当前瓶颈',icon:'🔦',name:obj.name,desc:`饱和度 ${((obj.saturation||0)*100).toFixed(0)}%`},{cls:'downstream',label:'下游路段',icon:'📍',name:'下游路段',desc:'拥堵传播中'}];

  } else if(type==='corridor'){
    nodes=[{cls:'upstream',label:'区域需求源',icon:'🏙️',name:'上游区域',desc:'需求持续输入'},{cls:'current',label:'当前走廊',icon:'🛣️',name:obj.name,desc:`停车率 ${((obj.stopRate||0)*100).toFixed(0)}%`},{cls:'downstream',label:'下游消散',icon:'🏙️',name:'下游区域',desc:'消散能力待评估'}];
    narrative.textContent=`${obj.name} 是关键走廊级瓶颈，停车率 ${((obj.stopRate||0)*100).toFixed(0)}%。`;
  } else {
    nodes=[{cls:'upstream',label:'外部输入',icon:'🛣️',name:'进入走廊',desc:`${(obj.inFlow||0)} pcu/h`},{cls:'current',label:'当前区域',icon:'🏙️',name:obj.name,desc:`饱和度 ${((obj.saturation||0)*100).toFixed(0)}%`},{cls:'downstream',label:'外溢方向',icon:'🛣️',name:'输出走廊',desc:`${(obj.outFlow||0)} pcu/h`}];

function pdRenderPhaseDiagram(obj){
  const card=document.getElementById('pdPhaseDiagramCard');if(!card)return;

  const maxG=Math.max(...phases.map(p=>p.greenTime));
  el.innerHTML=phases.map(p=>{const h=Math.round((p.greenTime/maxG)*100)+18;const c=p.saturation>0.85?'var(--danger)':p.saturation>0.7?'var(--warn)':'var(--success)';return `<div class="phase-bar-group"><div style="height:${h}px;width:100%;background:${c}22;border:1px solid ${c};border-radius:4px 4px 0 0;display:flex;align-items:flex-end;justify-content:center;padding-bottom:3px"><span style="font-size:9px;font-weight:700;color:${c}">${p.saturation.toFixed(2)}</span></div><div class="phase-bar-label">${p.phaseName}<br><strong>${p.greenTime}s</strong></div></div>`;}).join('<div style="width:3px;flex-shrink:0"></div>');
}

function csRenderCompare(obj){
  const el=document.getElementById('csCompareBody');if(!el)return;
  const type=currentObjType;const strats=obj.strategies||[];
  let before,after;
  if(obj.before&&obj.after){before=obj.before;after=obj.after;}
  else if(type==='region'){
    before={saturation:obj.saturation,avgSpeed:obj.avgSpeed,avgDelay:obj.avgDelay,congestionIndex:obj.congestionIndex};
    let satD=0,spdD=0,delD=0,ciD=0;
    strats.forEach(s=>{if(s.templateId==='region_core_expansion_control'){satD+=0.11;spdD+=4.2;delD+=26;ciD+=0.9;}if(s.templateId==='region_boundary_flow_control'){satD+=0.06;spdD+=2.1;delD+=13;ciD+=0.4;}});
    after={saturation:+Math.max((before.saturation||0.8)-Math.min(satD,0.22),0.5).toFixed(2),avgSpeed:+Math.min((before.avgSpeed||20)+Math.min(spdD,14),42).toFixed(1),avgDelay:+Math.max((before.avgDelay||80)-Math.min(delD,48),28).toFixed(1),congestionIndex:+Math.max((before.congestionIndex||4)-Math.min(ciD,1.8),1.2).toFixed(1)};
  } else if(type==='intersection'){
    before={saturation:obj.saturation,delay:obj.delay,queueLength:obj.queueLength};
    let satD=0,delD=0,qD=0;
    strats.forEach(s=>{if(s.templateId==='intersection_phase_rebalance'){satD+=0.07;delD+=27;qD+=45;}if(s.templateId==='intersection_bottleneck_anti_spillback'){satD+=0.05;delD+=22;qD+=60;}});
    after={saturation:+Math.max((before.saturation||0.8)-Math.min(satD,0.18),0.5).toFixed(2),delay:+Math.max((before.delay||80)-Math.min(delD,55),28).toFixed(1),queueLength:Math.max(Math.round((before.queueLength||100)-Math.min(qD,90)),25)};
  } else {el.innerHTML='<div style="text-align:center;padding:14px;color:var(--muted);font-size:11px">暂无前后对比数据</div>';return;}
  if(!before||!after){el.innerHTML='<div style="text-align:center;padding:14px;color:var(--muted);font-size:11px">暂无前后对比数据</div>';return;}
  const FIELDS={avgSpeed:'平均车速(km/h)',stopRate:'停车率',delay:'延误(s)',saturation:'饱和度',bandwidth:'绿波带宽(s)',avgDelay:'平均延误(s)',congestionIndex:'拥堵指数',queueLength:'排队长度(m)'};
  const DECREASE_GOOD=new Set(['delay','saturation','stopRate','congestionIndex','queueLength','avgDelay']);
  const fmtV=v=>typeof v==='number'?(v<1&&v>0?(v*100).toFixed(0)+'%':(v%1===0?v:v.toFixed(1))):v;
  el.innerHTML=`<div class="compare-wrap"><div class="compare-panel compare-before"><div class="cp-head">优化前</div>${Object.entries(before).filter(([k])=>FIELDS[k]).map(([k,v])=>`<div class="cp-row"><span class="cp-key">${FIELDS[k]}</span><span style="color:var(--danger);font-weight:700">${fmtV(v)}</span></div>`).join('')}</div><div style="display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 6px"><span style="font-size:18px;color:var(--success)">→</span></div><div class="compare-panel compare-after"><div class="cp-head">优化后</div>${Object.entries(after).filter(([k])=>FIELDS[k]).map(([k,v])=>{const bv=before[k];const d=typeof bv==='number'&&typeof v==='number'?v-bv:null;const pct=d!==null&&bv!==0?Math.round(d/bv*100):null;const isGood=pct!==null&&((pct<0&&DECREASE_GOOD.has(k))||(pct>0&&!DECREASE_GOOD.has(k)));const dStr=pct!==null?`<span style="font-size:9px;font-weight:700;color:${isGood?'var(--success)':'var(--warn)'};margin-left:3px">${pct>0?'+':''}${pct}%</span>`:'';return `<div class="cp-row"><span class="cp-key">${FIELDS[k]}</span><span style="color:var(--success);font-weight:700">${fmtV(v)}${dStr}</span></div>`;}).join('')}</div></div>`;
}

/* ── Phase movement icon ──
   Only green (released) flows shown. Clean white background, no road structure.
   Straight: parallel arrows in direction of travel.
   Left turn: L-shaped path with rounded corner.
── */
function pgPhaseIcon(phaseName, color){
  const n=(phaseName||'').replace(/\s/g,'');
  const S=84, C=42;
  const isNS=/南北|南向|北向/.test(n)&&!/东西|东向|西向/.test(n);
  const isEW=/东西|东向|西向/.test(n)&&!/南北|南向|北向/.test(n);
  const hasLeft=/左转/.test(n);
  const hasStraight=/直行/.test(n);
  const gc=color||'#1a7fff';
  const SW=5; // stroke-width for main arrows
  const R=9;  // corner radius for L-shaped turns

  // ── Arrow head (solid filled triangle) ──
  const ah=(x,y,d,s=7)=>{
    const f=`fill="${gc}"`;
    if(d==='u')return`<polygon points="${x},${y} ${x-s},${y+s*1.7} ${x+s},${y+s*1.7}" ${f}/>`;
    if(d==='d')return`<polygon points="${x},${y} ${x-s},${y-s*1.7} ${x+s},${y-s*1.7}" ${f}/>`;
    if(d==='l')return`<polygon points="${x},${y} ${x+s*1.7},${y-s} ${x+s*1.7},${y+s}" ${f}/>`;
    if(d==='r')return`<polygon points="${x},${y} ${x-s*1.7},${y-s} ${x-s*1.7},${y+s}" ${f}/>`;
    return'';
  };
  const st=`stroke="${gc}" stroke-width="${SW}" stroke-linecap="round" fill="none"`;
  const st2=`stroke="${gc}" stroke-width="4" stroke-linecap="round" fill="none"`;

  // ── Straight arrow: full span ──
  const straight=(x1,y1,x2,y2,d,small)=>
    `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" ${small?st2:st}/>${ah(x2,y2,d,small?5.5:7)}`;

  let body='';
  const pad=10; // distance from edge

  if(isNS && !hasLeft){
    // N-S straight: two vertical arrows side by side (offset ±8 from center)
    body+=straight(C+8,S-pad, C+8,pad,'u');
    body+=straight(C-8,pad,   C-8,S-pad,'d');
  } else if(isEW && !hasLeft){
    // E-W straight: two horizontal arrows offset ±8
    body+=straight(pad,  C-8, S-pad,C-8,'r');
    body+=straight(S-pad,C+8, pad,  C+8,'l');
  } else if(isNS && hasLeft && !hasStraight){
    // N-S left turns: each path turns within its own quadrant so that
    // no segment (including curves) can reach the opposing path's region.
    // NB curve occupies x∈[48,57] y∈[48,57]; SB curve x∈[27,36] y∈[27,36] — no overlap.
    // NB (from bottom-right, turns at (C+15,C+15), exits west at y=C+6)
    body+=`<path d="M${C+15},${S-pad} L${C+15},${C+15} Q${C+15},${C+6} ${C+6},${C+6} L${pad},${C+6}" ${st}/>${ah(pad,C+6,'l')}`;
    // SB (from top-left, turns at (C-15,C-15), exits east at y=C-6)
    body+=`<path d="M${C-15},${pad} L${C-15},${C-15} Q${C-15},${C-6} ${C-6},${C-6} L${S-pad},${C-6}" ${st}/>${ah(S-pad,C-6,'r')}`;
  } else if(isEW && hasLeft && !hasStraight){
    // E-W left turns: same quadrant-isolation principle rotated 90°.
    // EB curve x∈[27,36] y∈[48,57]; WB curve x∈[48,57] y∈[27,36] — no overlap.
    // EB (from left-lower, turns at (C-15,C+15), exits north at x=C-6)
    body+=`<path d="M${pad},${C+15} L${C-15},${C+15} Q${C-6},${C+15} ${C-6},${C+6} L${C-6},${pad}" ${st}/>${ah(C-6,pad,'u')}`;
    // WB (from right-upper, turns at (C+15,C-15), exits south at x=C+6)
    body+=`<path d="M${S-pad},${C-15} L${C+15},${C-15} Q${C+6},${C-15} ${C+6},${C-6} L${C+6},${S-pad}" ${st}/>${ah(C+6,S-pad,'d')}`;
  } else if(isNS && hasStraight && hasLeft){
    // N-S straight + left turns combined (quadrant-isolated left paths, smaller arrows)
    body+=straight(C+12,S-pad, C+12,pad,'u',true);
    body+=straight(C-12,pad,   C-12,S-pad,'d',true);
    // NB left: turns at (C+12,C+12), exits west at y=C+3
    body+=`<path d="M${C+12},${S-pad} L${C+12},${C+12} Q${C+12},${C+3} ${C+3},${C+3} L${pad},${C+3}" ${st2}/>${ah(pad,C+3,'l',5.5)}`;
    // SB left: turns at (C-12,C-12), exits east at y=C-3
    body+=`<path d="M${C-12},${pad} L${C-12},${C-12} Q${C-12},${C-3} ${C-3},${C-3} L${S-pad},${C-3}" ${st2}/>${ah(S-pad,C-3,'r',5.5)}`;
  } else if(isEW && hasStraight && hasLeft){
    // E-W straight + left turns combined (quadrant-isolated, smaller arrows)
    body+=straight(pad,  C-12, S-pad,C-12,'r',true);
    body+=straight(S-pad,C+12, pad,  C+12,'l',true);
    // EB left: turns at (C-12,C+12), exits north at x=C-3
    body+=`<path d="M${pad},${C+12} L${C-12},${C+12} Q${C-3},${C+12} ${C-3},${C+3} L${C-3},${pad}" ${st2}/>${ah(C-3,pad,'u',5.5)}`;
    // WB left: turns at (C+12,C-12), exits south at x=C+3
    body+=`<path d="M${S-pad},${C-12} L${C+12},${C-12} Q${C+3},${C-12} ${C+3},${C-3} L${C+3},${S-pad}" ${st2}/>${ah(C+3,S-pad,'d',5.5)}`;
  } else if(hasLeft){
    // Generic left turns: same quadrant-isolation as pure NS case
    body+=`<path d="M${C+15},${S-pad} L${C+15},${C+15} Q${C+15},${C+6} ${C+6},${C+6} L${pad},${C+6}" ${st}/>${ah(pad,C+6,'l')}`;
    body+=`<path d="M${C-15},${pad} L${C-15},${C-15} Q${C-15},${C-6} ${C-6},${C-6} L${S-pad},${C-6}" ${st}/>${ah(S-pad,C-6,'r')}`;
  } else {
    // Default: all 4 straight directions
    body+=straight(C+8,S-pad, C+8,pad,'u');
    body+=straight(C-8,pad,   C-8,S-pad,'d');
    body+=straight(pad,  C-8, S-pad,C-8,'r');
    body+=straight(S-pad,C+8, pad,  C+8,'l');
  }

  const bg=`${color||'#1a7fff'}08`;
  return`<svg viewBox="0 0 ${S} ${S}" width="${S}" height="${S}" xmlns="http://www.w3.org/2000/svg">
    <rect width="${S}" height="${S}" fill="${bg}" rx="10"/>
    ${body}
  </svg>`;
}

function pgRenderPhaseTimeline(plan, interIdx){
  pgSelectedInterIdx=interIdx;
  const pp=plan?.planParams||{};const inters=pp.intersectionPlans||[];const inter=inters[interIdx];
  if(!inter)return;
  const cycle=inter.cycle||100;
  const tgt=document.getElementById('pgPhaseTimelineTarget');if(tgt) tgt.textContent=inter.name;
  const el=document.getElementById('pgPhaseTimeline');if(!el)return;
  const phases=(inter.phases||[]).filter(p=>PG(p)>0);
  if(!phases.length){el.innerHTML='<div style="text-align:center;padding:20px;color:var(--muted);font-size:12px">暂无相位数据</div>';return;}

  const COLORS=['#1a7fff','#00b5a3','#e68a00','#6c3acb','#e53935','#1da462'];
  const BG=['rgba(26,127,255,.05)','rgba(0,181,163,.05)','rgba(230,138,0,.05)','rgba(108,58,203,.05)','rgba(229,57,53,.05)','rgba(29,164,98,.05)'];

  const cards=phases.map((p,i)=>{
    const gt=PG(p);const col=COLORS[i%COLORS.length];const bg=BG[i%BG.length];
    const satColor=p.saturation>0.85?'#e53935':p.saturation>0.7?'#e68a00':'#1da462';
    const satPct=Math.min(100,(p.saturation*100)).toFixed(0);
    const icon=pgPhaseIcon(PN(p),col);
    return `<div class="ptl2-card" style="background:${bg};border-color:${col}30;border-top:3px solid ${col}">
      <div class="ptl2-card-num" style="background:${col}15;color:${col}">相位 ${i+1}</div>
      <div class="ptl2-card-icon">${icon}</div>
      <div class="ptl2-card-divider" style="background:${col}40"></div>
      <div class="ptl2-card-name">${PN(p)||'—'}</div>
      <div class="ptl2-card-time" style="color:${col}">${gt}<span class="ptl2-card-unit" style="color:${col}">秒</span></div>

  el.innerHTML=checks.map(c=>`<div class="check-item ${c.pass&&!c.warning?'check-pass':c.warning?'check-warn':'check-fail'}"><span style="font-size:14px;width:18px">${c.pass&&!c.warning?'✅':c.warning?'⚠️':'❌'}</span><span style="font-weight:700;flex:1">${c.item}</span><span style="color:var(--muted)">${c.value}</span></div>`).join('');
