/* Green Wave SVG with drag */
function getCoordGreen(inter, plan){
  const phase=pgDetectCoordPhase(inter, plan, currentObj);
  return phase?PG(phase):30;
}

function pgBuildCorridorLinks(plan, obj){
  const inters=plan?.planParams?.intersectionPlans||[];
  const count=Math.max(0,inters.length-1);
  const avgSpacing=Math.round(Number(obj?.profile?.supply?.intersectionSpacingMeters||obj?.sceneCognition?.supply?.intersectionSpacingMeters||400))||400;
  const speed=Math.max(20,Number(plan?.planParams?.greenWaveSpeed||obj?.designSpeedKmh||40)||40);
  return Array.from({length:count},()=>({distance_m:avgSpacing,forward_speed_kmh:speed,reverse_speed_kmh:speed,lane_count:3}));
}

function pgPhaseToStageInfo(phase, cycle, isCoordPhase){
  const green=Math.max(18,Number(PG(phase))||18);
  const sat=Math.max(0.3,Number(phase?.saturation)||0.65);
  const satFlow=1400;
  const laneCount=/直行/.test(PN(phase))?2:1;
  const criticalLaneFlow=Math.max(60,sat*satFlow*green/Math.max(1,cycle));
  const turnFlowTotal=Math.max(criticalLaneFlow*laneCount,90);
  const stageId=phase.id||phase.phaseStageId||PN(phase)||'P';
  return {
    phaseStageId: stageId,
    phaseStageName: PN(phase)||stageId,
    min_green_s: Math.max(18,Math.min(green,isCoordPhase?green:Math.max(18,green-4))),
    max_green_s: Math.max(green+(isCoordPhase?16:8),24),
    yellow_s: Math.max(0,Number(phase.yellow??phase.yellowTime??3)||3),
    all_red_s: Math.max(0,Number(phase.allRed??phase.allRedTime??2)||2),
    saturation_flow_vph: satFlow,
    phaseDirInfoDTOList: pgPhaseMovementsFromName(PN(phase)).map((mv,idx)=>({
      movementKey: `${stageId}_${idx}`,
      label: mv.label,
      dir8No: mv.dir8No,
      turnDirNo: mv.turnDirNo,
      laneCount,
      turnFlowTotal: Number(turnFlowTotal.toFixed(1)),
      criticalLaneFlow: Number(criticalLaneFlow.toFixed(1)),
      saturationFlowVph: satFlow,
    })),
  };
}

function pgBuildCorridorPayload(plan, obj, opts){
  const pp=plan?.planParams||{};
  const inters=pp.intersectionPlans||[];
  if(!inters.length) throw new Error('当前方案缺少路口数据');
  const cycle=Math.round(Number(pp.commonCycle||inters[0]?.cycle||120)||120);
  const speed=Math.max(20,Number(pp.greenWaveSpeed||obj?.designSpeedKmh||40)||40);
  const strategy=(opts&&opts.strategyOverride)?opts.strategyOverride:pgGetSelectedCoordinationStrategy(plan);
  const maxGreen=Math.max(...inters.flatMap(inter=>(inter.phases||[]).map(ph=>Number(PG(ph))||0)),36);
  return {
    corridor_id: plan.targetId||obj?.id||plan.planId||'COR-DEMO',
    intersection_ids: inters.map((inter,idx)=>inter.interId||inter.id||`INT-${idx+1}`),
    links: pgBuildCorridorLinks(plan,obj),
    constraints: {
      design_speed_kmh: speed,
      min_cycle_s: cycle,
      max_cycle_s: cycle,
      min_green_s: 18,
      max_green_s: Math.round(maxGreen),
      lost_time_s: 0,
      progression_weight: 0.08,
      strategy,
      target_non_coord_intensity: 0.8,
    },
    intersections: inters.map((inter,idx)=>{
      const coordPhase=pgDetectCoordPhase(inter, plan, obj);
      const coordId=coordPhase?.id||coordPhase?.phaseStageId||'';
      return {
        intersection_id: inter.interId||inter.id||`INT-${idx+1}`,
        route_name: inter.name||`路口${idx+1}`,
        coord_phase_id: coordId,
        actual_avg_speed_kmh: speed,
        phaseStageInfoList: (inter.phases||[])
          .filter(ph=>PG(ph)>0)
          .map(ph=>pgPhaseToStageInfo(ph, cycle, (ph.id||ph.phaseStageId||'')===coordId)),
        constraints: {
          default_cycle_s: cycle,
          max_cycle_s: cycle,
          min_green_s: 18,
          max_green_s: Math.round(maxGreen),
          yellow_s: 3,
          all_red_s: 2,
        },
      };
    }),
  };
}

function pgApplyCorridorCoordinationResult(plan, envelope, strategyValue){
  const coordination=envelope?.coordination||envelope?.plan?.coordination;
  if(!coordination||(coordination.nodes||[]).length===0) throw new Error('协调结果为空');
  const pp=plan.planParams||(plan.planParams={});
  const cycle=Math.round(Number(coordination.cycle_s||pp.commonCycle||0)||0);
  if(cycle) pp.commonCycle=cycle;
  if(coordination.design_speed_kmh) pp.greenWaveSpeed=Math.round(Number(coordination.design_speed_kmh));
  pp.direction=coordination.strategy||strategyValue||pp.direction;
  plan.strategy=coordination.strategy||strategyValue||plan.strategy;
  plan.coordination=coordination;
  plan.__selectedCoordinationStrategy=plan.strategy;
  const nodes=coordination.nodes||[];
  const nodeMap=new Map(nodes.map(node=>[String(node.intersection_id),node]));
  (pp.intersectionPlans||[]).forEach((inter,idx)=>{
    const node=nodeMap.get(String(inter.interId||inter.id))||nodes[idx];
    if(!node) return;
    if(node.cycle_s) inter.cycle=Math.round(Number(node.cycle_s));
    if(node.offset_s!=null) inter.offset=Math.round(Number(node.offset_s));
    if(coordination.bandwidth_s!=null) inter.greenWaveBand=Math.round(Number(coordination.bandwidth_s));
    const byId=new Map((node.phase_stage_timing_list||[]).map(stage=>[String(stage.phase_stage_id),stage]));
    const byName=new Map((node.phase_stage_timing_list||[]).map(stage=>[String(stage.phase_stage_name),stage]));
    inter.phases=(inter.phases||[]).map(ph=>{
      const stage=byId.get(String(ph.id||ph.phaseStageId||''))||byName.get(PN(ph));
      if(!stage) return ph;
      const green=Math.max(18,Math.round(Number(stage.green_s||PG(ph)||18)));
      const splitRatio=Number(stage.green_ratio??ph.splitRatio??(green/Math.max(inter.cycle||cycle||1,1)));
      return {
        ...ph,
        green,
        splitRatio: Number(splitRatio.toFixed(2)),
        saturation: stage.phase_saturation!=null?Number(Number(stage.phase_saturation).toFixed(2)):ph.saturation,
      };
    });
  });
  const labels=pgBandwidthLabels(plan,currentObj);
  const fwd=coordination.bandwidth_forward_s!=null?Math.round(Number(coordination.bandwidth_forward_s)):null;
  const rev=coordination.bandwidth_reverse_s!=null?Math.round(Number(coordination.bandwidth_reverse_s)):null;
  plan.__regenMeta={type:'success',text:`已按${translateDirection(plan.strategy)}重新生成绿波方案${cycle?`，公共周期 ${cycle} 秒`:''}${fwd!=null?`，${labels.forward} ${fwd} 秒`:''}${rev!=null?`，${labels.reverse} ${rev} 秒`:''}。`};
  return plan;
}

async function pgRunCorridorCoordinationApi(plan, payloadOpts){
  const payload=pgBuildCorridorPayload(plan,currentObj,payloadOpts);
  const res=await fetch(`${API}/v1/planning/corridor`,{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify(payload),
  });
  const data=await res.json();
  if(!res.ok) throw new Error(data?.detail||data?.error||'接口调用失败');
  pgApplyCorridorCoordinationResult(plan,data,payload.constraints.strategy);
  return payload.constraints.strategy;
}

async function pgMaybeAutoSeedBidirectionalCorridor(plan){
  const inters=(plan.planParams||{}).intersectionPlans||[];
  if(!inters.length||plan.status==='generating') return;
  if(plan.__corridorBidirectionalSeeded||plan.__corridorSeedInFlight) return;
  plan.__corridorSeedInFlight=true;
  plan.__regenMeta={type:'info',text:'正在按双向绿波初始化各路口协调相位差…'};
  pgRenderGreenWaveDiagram(plan);
  try{
    await pgRunCorridorCoordinationApi(plan,{strategyOverride:'bidirectional'});
    plan.__corridorBidirectionalSeeded=true;
    plan.__regenMeta={type:'success',text:'已默认按双向绿波计算并保存各路口相位差；可切换协调策略后点击「重新生成绿波方案」更新。'};
  }catch(err){
    plan.__regenMeta={type:'error',text:`双向绿波初始化失败：${err?.message||'未知错误'}（可点击「重新生成绿波方案」重试）`};
  }finally{
    plan.__corridorSeedInFlight=false;
  }
  if(pgCurrentPlan!==plan) return;
  pgRenderPlanOverview(plan);
  pgRenderPlanTable(plan);
  pgRenderSafetyChecks(plan);
  pgRenderGain(plan);
  pgRenderPhaseTimeline(plan,pgSelectedInterIdx);
  pgRenderGreenWaveDiagram(plan);
}

async function pgRegenerateCorridorPlan(plan){
  if(plan.__regenBusy) return;
  plan.__regenBusy=true;
  plan.__regenMeta={type:'info',text:'正在按所选协调策略重新计算绿波方案…'};
  pgRenderGreenWaveDiagram(plan);
  try{
    await pgRunCorridorCoordinationApi(plan,undefined);
    plan.__regenBusy=false;
    plan.__corridorBidirectionalSeeded=true;
    pgSelectPlan(plan);
  }catch(err){
    plan.__regenBusy=false;
    plan.__regenMeta={type:'error',text:`重新生成失败：${err?.message||'未知错误'}`};
    pgRenderGreenWaveDiagram(plan);
  }
}

function pgRenderGreenWaveDiagram(plan){
  const el=document.getElementById('pgGreenWaveBody');if(!el)return;
  const pp=plan.planParams||{};const inters=pp.intersectionPlans||[];
  if(!inters.length){el.innerHTML='<div style="text-align:center;padding:20px;color:var(--muted)">无路口数据</div>';return;}
  const cycle=pp.commonCycle||100,speed=pp.greenWaveSpeed||60,cyclesToShow=3,totalTime=cycle*cyclesToShow;
  const dists=pgBuildCorridorLinks(plan,currentObj).map(link=>Number(link.distance_m)||400);
  const cum=[0];for(let i=0;i<dists.length;i++) cum.push(cum[i]+dists[i]);
  const xMax=cum[cum.length-1]||1;
  const padL=80,padR=60,padT=52,padB=40;
  const minColW=160,W=Math.max(820, padL+padR+minColW*(inters.length-1)+80),H=360;
  const x0=padL,x1=W-padR,y0=padT,y1=H-padB;
  const sx=d=>x0+(d/xMax)*(x1-x0);
  const sy=t=>y1-(Math.max(0,Math.min(totalTime,t))/totalTime)*(y1-y0);
  const strategyValue=pgGetSelectedCoordinationStrategy(plan);
  plan.__selectedCoordinationStrategy=strategyValue;
  const labels=pgBandwidthLabels(plan,currentObj);
  const regenTone=plan.__regenMeta?.type==='error'
    ? 'rgba(229,57,53,.08);border:1px solid rgba(229,57,53,.25);color:var(--danger)'
    : plan.__regenMeta?.type==='success'
      ? 'rgba(29,164,98,.08);border:1px solid rgba(29,164,98,.25);color:var(--success)'
      : 'rgba(26,127,255,.06);border:1px solid rgba(26,127,255,.18);color:var(--muted)';
  const regenText=plan.__regenMeta?.text||`支持直接切换协调策略并重算当前方案，当前协调主相位按“${labels.coordPhase}”识别。`;
  el.innerHTML=`<div style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:10px">
    <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
      <span style="font-size:11px;color:var(--muted);font-weight:700">协调策略</span>
      <select class="fc" id="pgCorridorStrategy" style="width:220px">${COORDINATION_STRATEGY_OPTIONS.map(opt=>`<option value="${opt.value}" ${opt.value===strategyValue?'selected':''}>${opt.label}</option>`).join('')}</select>
      <button class="obj-btn active" id="pgCorridorRegenBtn" style="padding:8px 14px">${plan.__regenBusy?'<span class="spin"></span> 重新生成中…':'重新生成绿波方案'}</button>
    </div>
    <div style="font-size:11px;color:var(--muted)">协调主相位：${labels.coordPhase}</div>
  </div>
  <div style="padding:8px 10px;border-radius:8px;font-size:11px;line-height:1.6;margin-bottom:10px;${regenTone}">${regenText}</div>
  <div style="overflow-x:auto"><svg class="st-svg" viewBox="0 0 ${W} ${H}" style="min-width:${W}px" xmlns="http://www.w3.org/2000/svg" id="stSvg"></svg></div>`;
  const strategyEl=document.getElementById('pgCorridorStrategy');
  const regenBtn=document.getElementById('pgCorridorRegenBtn');
  if(strategyEl){
    strategyEl.value=strategyValue;
    strategyEl.onchange=function(){
      plan.__selectedCoordinationStrategy=this.value;
      plan.__regenMeta={type:'info',text:`已切换为${translateDirection(this.value)}，点击“重新生成绿波方案”后更新当前表格与时距图。`};
      pgRenderGreenWaveDiagram(plan);
    };
  }
  if(regenBtn){
    regenBtn.disabled=!!plan.__regenBusy;
    regenBtn.onclick=()=>pgRegenerateCorridorPlan(plan);
  }
  _stState={plan,inters,cycle,speed,cyclesToShow,totalTime,dists,cum,xMax,W,H,padL,padR,padT,padB,x0,x1,y0,y1,sx,sy};
  _stOrigInters=JSON.parse(JSON.stringify(inters));
  const svgEl=document.getElementById('stSvg');
  svgEl.innerHTML=buildGreenWaveSVGContent(_stState);
  attachGreenWaveDragDown(svgEl);
}

function buildGreenWaveSVGContent(state){
  const {plan,inters,cycle,speed,cyclesToShow,totalTime,dists,cum,xMax,W,H,x0,x1,y0,y1,sx,sy}=state;
  function greenSegs(off,green){const C=cycle,o=((off%C)+C)%C,g=Math.min(green,C),segs=[];if(o+g<=C)segs.push([o,o+g]);else{segs.push([o,C]);segs.push([0,o+g-C]);}return segs;}
  function repSegsExt(off,green){const base=greenSegs(off,green),out=[];for(let k=-1;k<=cyclesToShow;k++)base.forEach(([a,b])=>out.push([a+k*cycle,b+k*cycle]));return out;}
  function repSegs(off,green){const base=greenSegs(off,green),out=[];for(let k=0;k<cyclesToShow;k++)base.forEach(([a,b])=>out.push([a+k*cycle,b+k*cycle]));return out;}
  function redSegs(off,green){const C=cycle,gS=greenSegs(off,green),rS=[];let cov=gS.map(([a,b])=>[a,b]).sort((a,b)=>a[0]-b[0]),t=0;cov.forEach(([a,b])=>{if(a>t)rS.push([t,a]);t=Math.max(t,b);});if(t<C)rS.push([t,C]);return rS;}
  function repRedSegs(off,green){const base=redSegs(off,green),out=[];for(let k=0;k<cyclesToShow;k++)base.forEach(([a,b])=>out.push([a+k*cycle,b+k*cycle]));return out;}
  function tt(d){return d/((Math.max(1,speed))/3.6);}
  const labels=pgBandwidthLabels(plan,currentObj);
  const coordination=plan?.coordination||{};
  let h='';
  h+=`<rect width="${W}" height="${H}" fill="#fff"/>`;
  h+=`<line x1="${x0}" y1="${y1}" x2="${x1}" y2="${y1}" stroke="#cbd5e1"/><line x1="${x0}" y1="${y0}" x2="${x0}" y2="${y1}" stroke="#cbd5e1"/>`;
  for(let tick=0;tick<=cyclesToShow;tick++){const t=cycle*tick,yy=sy(t);h+=`<line x1="${x0}" y1="${yy}" x2="${x1}" y2="${yy}" stroke="#cbd5e1" stroke-dasharray="4 3"/><text x="${x0-8}" y="${yy+4}" text-anchor="end" font-size="10" fill="#475569">${t}秒</text>`;}
  inters.forEach((inter,i)=>{
    const xx=sx(cum[i]),off=inter.offset||0,g=getCoordGreen(inter,plan);
    h+=`<line x1="${xx}" y1="${y0}" x2="${xx}" y2="${y1}" stroke="#e2e8f0"/>`;
    h+=`<text x="${xx}" y="${y0-25}" text-anchor="middle" font-size="10" font-weight="700" fill="#1e293b">${inter.name}</text>`;
    h+=`<text x="${xx}" y="${y0-12}" text-anchor="middle" font-size="9" fill="#64748b">偏移:${off}秒 绿:${g}秒</text>`;
    repRedSegs(off,g).forEach(([a,b])=>{const ry=sy(b),rh=Math.max(1,sy(a)-sy(b));h+=`<rect x="${xx-7}" y="${ry}" width="14" height="${rh}" fill="rgba(239,68,68,.45)" rx="1"/>`;});
    repSegs(off,g).forEach(([a,b])=>{const ry=sy(b),rh=Math.max(2,sy(a)-sy(b));h+=`<rect x="${xx-7}" y="${ry}" width="14" height="${rh}" fill="rgba(34,197,94,.85)" rx="1" class="st-green-bar" data-node="${i}"/>`;});
    h+=`<rect x="${xx-22}" y="${y0}" width="44" height="${y1-y0}" fill="transparent" class="st-drag-zone" data-node="${i}" style="cursor:ns-resize"/>`;
  });
  for(let i=0;i<inters.length-1;i++){
    const travel=tt(dists[i]),leftOff=inters[i].offset||0,rightOff=inters[i+1].offset||0,leftG=getCoordGreen(inters[i],plan),rightG=getCoordGreen(inters[i+1],plan);
    const lS=repSegsExt(leftOff,leftG),rS=repSegsExt(rightOff,rightG);
    lS.forEach(([la,lb])=>{rS.forEach(([ra,rb])=>{const os=Math.max(la,ra-travel),oe=Math.min(lb,rb-travel);if(oe<=os||oe<0||os>totalTime)return;const pts=[sx(cum[i])+','+sy(os),sx(cum[i+1])+','+sy(os+travel),sx(cum[i+1])+','+sy(oe+travel),sx(cum[i])+','+sy(oe)].join(' ');h+=`<polygon fill="rgba(74,222,128,.4)" stroke="rgba(22,163,74,.8)" stroke-width="1" points="${pts}"/>`;});});
    const rS2=repSegsExt(rightOff,rightG),lS2=repSegsExt(leftOff,leftG);
    rS2.forEach(([ra,rb])=>{lS2.forEach(([la,lb])=>{const os=Math.max(ra,la-travel),oe=Math.min(rb,lb-travel);if(oe<=os||oe<0||os>totalTime)return;const pts=[sx(cum[i+1])+','+sy(os),sx(cum[i])+','+sy(os+travel),sx(cum[i])+','+sy(oe+travel),sx(cum[i+1])+','+sy(oe)].join(' ');h+=`<polygon fill="rgba(22,163,74,.18)" stroke="rgba(21,128,61,.75)" stroke-width="1" stroke-dasharray="5 4" points="${pts}"/>`;});});
  }
  h+=`<rect x="${x1-300}" y="${y0+2}" width="296" height="44" rx="6" fill="rgba(255,255,255,.94)" stroke="#e2e8f0"/>`;
  h+=`<rect x="${x1-292}" y="${y0+9}" width="11" height="8" rx="2" fill="rgba(34,197,94,.88)"/>`;
  h+=`<text x="${x1-278}" y="${y0+17}" font-size="9" fill="#15803d">绿灯</text>`;
  h+=`<rect x="${x1-248}" y="${y0+9}" width="11" height="8" rx="2" fill="rgba(239,68,68,.55)"/>`;
  h+=`<text x="${x1-234}" y="${y0+17}" font-size="9" fill="#b91c1c">红灯</text>`;
  h+=`<rect x="${x1-198}" y="${y0+9}" width="11" height="8" rx="2" fill="rgba(74,222,128,.45)" stroke="rgba(22,163,74,.8)"/>`;
  h+=`<text x="${x1-184}" y="${y0+17}" font-size="9" fill="#15803d">正向重叠</text>`;
  h+=`<rect x="${x1-128}" y="${y0+9}" width="11" height="8" rx="2" fill="rgba(22,163,74,.18)" stroke="rgba(21,128,61,.75)" stroke-dasharray="2 1"/>`;
  h+=`<text x="${x1-114}" y="${y0+17}" font-size="9" fill="#166534">反向重叠</text>`;
  h+=`<text x="${x1-292}" y="${y0+36}" font-size="9" fill="#475569">↕ 拖动任意路口绿灯条或透明拖拽区可调整相位差</text>`;
  const bwParts=[`策略：${translateDirection(plan?.strategy||coordination.strategy||plan?.planParams?.direction||'bidirectional')}`,`速度：${speed}千米/时`];
  if(coordination.bandwidth_forward_s!=null) bwParts.push(`${labels.forward} ${Math.round(Number(coordination.bandwidth_forward_s))}秒`);
  if(coordination.bandwidth_reverse_s!=null) bwParts.push(`${labels.reverse} ${Math.round(Number(coordination.bandwidth_reverse_s))}秒`);
  else if(inters[0]?.greenWaveBand!=null) bwParts.push(`带宽：${inters[0].greenWaveBand}秒`);
  h+=`<text x="${x0+4}" y="${y0-6}" font-size="10" fill="#475569" font-weight="600">${bwParts.join(' · ')}</text>`;
  return h;
}

function pgRenderChannelSVG(inter){
  const el=document.getElementById('pgChannelSVGWrap');if(!el)return;
  const W=400,H=400,CX=200,CY=200,BOX=72,ARM=112,LANE=13,MED=10,PAD=10;
  const laneCfg={
    N:{in:['left','through','through','right'],out:['through','through','through','through'],outKind:[null,null,null,null]},
    S:{in:['left','through','through','right'],out:['bike','through','through'],outKind:['bike',null,null]},
    E:{in:['left','through','through','right'],out:['through','through','through'],outKind:[null,null,'bus']},
    W:{in:['left','through','through','right'],out:['through','through','through'],outKind:['bus',null,null]},
  };
  function roadSpanFor(d){const c=laneCfg[d];return c.in.length*LANE+MED+c.out.length*LANE+PAD*2;}
  const vRoad=Math.max(roadSpanFor('N'),roadSpanFor('S'));
  const hRoad=Math.max(roadSpanFor('E'),roadSpanFor('W'));
  const bg='#2b2d32',roadFill='#4a4d54',roadEdge='#2f3238',markWhite='rgba(255,255,255,.92)',markDim='rgba(255,255,255,.45)';
  let p='';

  function arrowTxt(x,y,type,rot,scale=1,color=markWhite,opacity=1){
    const stemW=3.2*scale, head=5.8*scale;
    let body='',headPoly='';
    if(type==='through'){
      body=`<path d="M 0 ${10*scale} L 0 ${-6*scale}" fill="none" stroke="${color}" stroke-width="${stemW}" stroke-linecap="round" stroke-linejoin="round"/>`;
      headPoly=`<polygon points="0,${-12*scale} ${-head},${-3*scale} ${head},${-3*scale}" fill="${color}"/>`;
    }else if(type==='left'){
      body=`<path d="M 0 ${10*scale} L 0 ${-1*scale} Q 0 ${-8*scale} ${-8*scale} ${-11*scale} L ${-12*scale} ${-11*scale}" fill="none" stroke="${color}" stroke-width="${stemW}" stroke-linecap="round" stroke-linejoin="round"/>`;
      headPoly=`<polygon points="${-18*scale},${-11*scale} ${-9*scale},${-17*scale} ${-9*scale},${-5*scale}" fill="${color}"/>`;
    }else if(type==='right'){
      body=`<path d="M 0 ${10*scale} L 0 ${-1*scale} Q 0 ${-8*scale} ${8*scale} ${-11*scale} L ${12*scale} ${-11*scale}" fill="none" stroke="${color}" stroke-width="${stemW}" stroke-linecap="round" stroke-linejoin="round"/>`;
      headPoly=`<polygon points="${18*scale},${-11*scale} ${9*scale},${-17*scale} ${9*scale},${-5*scale}" fill="${color}"/>`;
    }else{
      body=`<path d="M 0 ${10*scale} L 0 ${-6*scale}" fill="none" stroke="${color}" stroke-width="${stemW}" stroke-linecap="round" stroke-linejoin="round"/>`;
      headPoly=`<polygon points="0,${-12*scale} ${-head},${-3*scale} ${head},${-3*scale}" fill="${color}"/>`;
    }
    return `<g transform="translate(${x},${y}) rotate(${rot})" opacity="${opacity}">${body}${headPoly}</g>`;
  }
  function bikeMark(x,y,rot){
    return `<g transform="translate(${x},${y}) rotate(${rot})" fill="none" stroke="${markWhite}" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="-3.5" cy="-4" r="3"/><circle cx="3.5" cy="4" r="3"/>
      <path d="M-3.5,-4 L3.5,4 M-1,-4 L-3.5,2 M1,4 L3.5,-2"/></g>`;
  }
  function busLaneOverlayEW(x,y,w,h){
    const cx=x+w/2,cy=y+h/2;
    return `<rect x="${x+1.5}" y="${y+1.5}" width="${w-3}" height="${h-3}" fill="none" stroke="#facc15" stroke-width="1.2" stroke-dasharray="4 3" opacity=".95"/>
      <text x="${cx}" y="${cy}" text-anchor="middle" dominant-baseline="middle" fill="#fde047" font-size="7" font-weight="700" transform="rotate(-90 ${cx} ${cy})">公交专用</text>`;
  }
  function drawCrosswalk(x,y,width,height,vertical=false){
    const stripes=[],step=8,bar=4.5;
    const count=Math.floor((vertical?height:width)/step);
    for(let i=0;i<count;i++){
      if(vertical) stripes.push(`<rect x="${x}" y="${y+i*step}" width="${width}" height="${bar}" fill="rgba(255,255,255,.95)"/>`);
      else stripes.push(`<rect x="${x+i*step}" y="${y}" width="${bar}" height="${height}" fill="rgba(255,255,255,.95)"/>`);
    }
    return stripes.join('');
  }
  function drawSignal(x,y,vertical=true){
    const body=vertical?`<rect x="${x-5}" y="${y-13}" width="10" height="26" rx="5" fill="#374151"/>`:`<rect x="${x-13}" y="${y-5}" width="26" height="10" rx="5" fill="#374151"/>`;
    const lights=vertical?[[x,y-7,'#64748b'],[x,y,'#64748b'],[x,y+7,'#22c55e']]:[[x-7,y,'#64748b'],[x,y,'#64748b'],[x+7,y,'#22c55e']];
    return body+lights.map(([cx,cy,col])=>`<circle cx="${cx}" cy="${cy}" r="2" fill="${col}" opacity=".9"/>`).join('');
  }
  function throughIdx(list){
    const idx=[];list.forEach((type,i)=>{if(type==='through') idx.push(i);});
    return idx;
  }
  function flipLRType(dir,t){
    if((dir==='N'||dir==='E')&&(t==='left'||t==='right')) return t==='left'?'right':'left';
    return t;
  }
  function drawApproach(dir){
    const inbound=laneCfg[dir].in,outbound=laneCfg[dir].out,outKind=laneCfg[dir].outKind||[];
    const inCount=inbound.length,outCount=outbound.length;
    const span=inCount*LANE+MED+outCount*LANE+PAD*2;
    const off=(dir==='N'||dir==='S'?vRoad:hRoad)-span;
    const laneStroke=markDim;
    if(dir==='N'||dir==='S'){
      const y0=dir==='N'?CY-BOX-ARM:CY+BOX;
      const outW=outCount*LANE,inW=inCount*LANE;
      let inX,outX;
      if(dir==='N'){
        inX=CX-vRoad/2+PAD;outX=inX+inW+MED;
      }else{
        outX=CX-vRoad/2+PAD;inX=outX+outW+MED;
      }
      if(off>0){
        if(dir==='N'){inX+=off/2;outX=inX+inW+MED;}
        else{outX+=off/2;inX=outX+outW+MED;}
      }
      if(dir==='S'){
        const yelX=outX+outW+MED/2;
        p+=`<line x1="${yelX}" y1="${y0+5}" x2="${yelX}" y2="${y0+ARM-5}" stroke="#eab308" stroke-width="2"/>`;
      }
      const stopY=dir==='N'?CY-BOX-20:CY+BOX+20;
      p+=`<rect x="${CX-vRoad/2}" y="${y0}" width="${vRoad}" height="${ARM}" fill="none" stroke="${markDim}" stroke-width="1"/>`;
      p+=`<rect x="${outX}" y="${y0}" width="${outW}" height="${ARM}" fill="none" stroke="${markDim}" stroke-width="1.2"/>`;
      p+=`<rect x="${inX}" y="${y0}" width="${inW}" height="${ARM}" fill="none" stroke="${markDim}" stroke-width="1.2"/>`;
      for(let i=1;i<outCount;i++) p+=`<line x1="${outX+i*LANE}" y1="${y0}" x2="${outX+i*LANE}" y2="${y0+ARM}" stroke="${laneStroke}" stroke-width="1" stroke-dasharray="6 5"/>`;
      for(let i=1;i<inCount;i++) p+=`<line x1="${inX+i*LANE}" y1="${y0}" x2="${inX+i*LANE}" y2="${stopY}" stroke="${laneStroke}" stroke-width="1" stroke-dasharray="6 5"/>`;
      p+=`<line x1="${inX}" y1="${stopY}" x2="${inX+inW}" y2="${stopY}" stroke="${markWhite}" stroke-width="2.8"/>`;
      p+=drawSignal(dir==='N'?inX+inW+9:inX-9,dir==='N'?stopY-9:stopY+9,true);
      inbound.forEach((type,i)=>{
        const ax=inX+i*LANE+LANE/2, ay=dir==='N'?y0+ARM*0.52:y0+ARM*0.48;
        p+=arrowTxt(ax,ay,flipLRType(dir,type),dir==='N'?180:0,.92,markWhite,1);
      });
      throughIdx(inbound).forEach(i=>{
        const ax=inX+i*LANE+LANE/2;
        const y1=stopY+(dir==='N'?2:-2);
        const y2=dir==='N'?CY+BOX*0.25:CY-BOX*0.25;
        p+=`<line x1="${ax}" y1="${y1}" x2="${ax}" y2="${y2}" stroke="${markDim}" stroke-width="1.2" stroke-dasharray="5 5"/>`;
      });
      outbound.forEach((ot,i)=>{
        const ax=outX+i*LANE+LANE/2, ay=dir==='N'?y0+ARM*0.36:y0+ARM*0.64;
        const k=outKind[i];
        if(k==='bike') p+=bikeMark(ax,ay,dir==='N'?0:180);
        else p+=arrowTxt(ax,ay,'through',dir==='N'?0:180,.55,markWhite,.85);
      });
    }else{
      const x0=dir==='W'?CX-BOX-ARM:CX+BOX;
      const outH=outCount*LANE,inH=inCount*LANE;
      let inY,outY;
      if(dir==='W'){
        inY=CY+hRoad/2-PAD-inH;outY=inY-outH-MED;
      }else{
        inY=CY-hRoad/2+PAD;outY=inY+inH+MED;
      }
      const stopX=dir==='W'?CX-BOX-20:CX+BOX+20;
      if(off>0){
        if(dir==='W'){inY-=off/2;outY=inY-outH-MED;}
        else{inY=CY-hRoad/2+PAD+off/2;outY=inY+inH+MED;}
      }
      p+=`<rect x="${x0}" y="${CY-hRoad/2}" width="${ARM}" height="${hRoad}" fill="none" stroke="${markDim}" stroke-width="1"/>`;
      p+=`<rect x="${x0}" y="${outY}" width="${ARM}" height="${outH}" fill="none" stroke="${markDim}" stroke-width="1.2"/>`;
      p+=`<rect x="${x0}" y="${inY}" width="${ARM}" height="${inH}" fill="none" stroke="${markDim}" stroke-width="1.2"/>`;
      for(let i=1;i<outCount;i++) p+=`<line x1="${x0}" y1="${outY+i*LANE}" x2="${x0+ARM}" y2="${outY+i*LANE}" stroke="${laneStroke}" stroke-width="1" stroke-dasharray="6 5"/>`;
      for(let i=1;i<inCount;i++) p+=`<line x1="${x0}" y1="${inY+i*LANE}" x2="${stopX}" y2="${inY+i*LANE}" stroke="${laneStroke}" stroke-width="1" stroke-dasharray="6 5"/>`;
      p+=`<line x1="${stopX}" y1="${inY}" x2="${stopX}" y2="${inY+inH}" stroke="${markWhite}" stroke-width="2.8"/>`;
      p+=drawSignal(dir==='W'?stopX-9:stopX+9,inY+inH+9,false);
      const ewInRot=dir==='W'?90:270;
      const ewOutRot=dir==='W'?270:90;
      inbound.forEach((type,i)=>{
        const ax=dir==='W'?x0+ARM*0.48:x0+ARM*0.52, ay=inY+i*LANE+LANE/2;
        p+=arrowTxt(ax,ay,flipLRType(dir,type),ewInRot,.92,markWhite,1);
      });
      throughIdx(inbound).forEach(i=>{
        const ay=inY+i*LANE+LANE/2;
        const x1=stopX+(dir==='W'?-2:2);
        const x2=dir==='W'?CX+BOX*0.22:CX-BOX*0.22;
        p+=`<line x1="${x1}" y1="${ay}" x2="${x2}" y2="${ay}" stroke="${markDim}" stroke-width="1.2" stroke-dasharray="5 5"/>`;
      });
      outbound.forEach((ot,i)=>{
        const ax=dir==='W'?x0+ARM*0.64:x0+ARM*0.36, ay=outY+i*LANE+LANE/2;
        const k=outKind[i];
        if(k==='bike') p+=bikeMark(ax,ay,ewOutRot);
        else p+=arrowTxt(ax,ay,'through',ewOutRot,.55,markWhite,.85);
        if(k==='bus') p+=busLaneOverlayEW(x0,outY+i*LANE,ARM,LANE);
      });
    }
  }

  p+=`<rect width="${W}" height="${H}" fill="${bg}" rx="8"/>`;
  p+=`<rect x="${CX-vRoad/2}" y="18" width="${vRoad}" height="${H-36}" rx="10" fill="${roadFill}" stroke="${roadEdge}" stroke-width="1.5"/>`;
  p+=`<rect x="18" y="${CY-hRoad/2}" width="${W-36}" height="${hRoad}" rx="10" fill="${roadFill}" stroke="${roadEdge}" stroke-width="1.5"/>`;
  p+=`<rect x="${CX-BOX}" y="${CY-BOX}" width="${BOX*2}" height="${BOX*2}" fill="${roadFill}"/>`;
  const cornerR=78;
  p+=`<circle cx="${CX-vRoad/2-4}" cy="${CY-hRoad/2-4}" r="${cornerR}" fill="${bg}"/>`;
  p+=`<circle cx="${CX+vRoad/2+4}" cy="${CY-hRoad/2-4}" r="${cornerR}" fill="${bg}"/>`;
  p+=`<circle cx="${CX-vRoad/2-4}" cy="${CY+hRoad/2+4}" r="${cornerR}" fill="${bg}"/>`;
  p+=`<circle cx="${CX+vRoad/2+4}" cy="${CY+hRoad/2+4}" r="${cornerR}" fill="${bg}"/>`;
  ['N','S','E','W'].forEach(drawApproach);
  p+=drawCrosswalk(CX-vRoad/2,CY-BOX-10,vRoad,16,false);
  p+=drawCrosswalk(CX-vRoad/2,CY+BOX-6,vRoad,16,false);
  p+=drawCrosswalk(CX-BOX-10,CY-hRoad/2,16,hRoad,true);
  p+=drawCrosswalk(CX+BOX-6,CY-hRoad/2,16,hRoad,true);
  p+=`<circle cx="${CX}" cy="${CY}" r="12" fill="rgba(255,255,255,.12)" stroke="${markDim}" stroke-width="1"/>`;
  el.innerHTML=`<svg class="chan-svg" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">${p}</svg><div style="text-align:center;font-size:10px;color:var(--muted);margin-top:4px">${inter.name} · 周期${inter.cycle}秒</div>`;
}

function pgRenderSatBars(inter){
  const el=document.getElementById('pgSatEvalWrap');if(!el)return;
  const phases=inter.phases||[];
  if(!phases.length){el.innerHTML='<div style="color:var(--muted);font-size:11px">无相位数据</div>';return;}
  el.innerHTML=phases.filter(p=>PG(p)>0).map(ph=>{
    const sat=ph.saturation||0;const pct=Math.min(sat*100,100);const gt=PG(ph);
    const barColor=sat>0.85?'var(--danger)':sat>0.7?'var(--warn)':'var(--success)';
    const statusLabel=sat>0.9?'过饱和':sat>0.85?'接近饱和':sat>0.7?'较高':'正常';
    return `<div class="pg-sat-row"><div class="pg-sat-label">${PN(ph)}</div><div class="pg-sat-track"><div class="pg-sat-fill" style="width:${pct}%;background:${barColor}"></div><div class="pg-sat-mark" style="left:70%;border-left:1px dashed var(--warn)"></div><div class="pg-sat-mark" style="left:85%;border-left:1px dashed var(--danger)"></div></div><div class="pg-sat-val" style="color:${barColor}">${sat.toFixed(2)}</div></div><div class="pg-sat-info">绿灯 ${gt}秒 · 绿信比 ${(ph.splitRatio*100).toFixed(0)}% · ${statusLabel}</div>`;
  }).join('');
}

async function pgLoadLLM(plan){
  const el=document.getElementById('pgLLM');if(!el)return;
  if(plan.status==='generating'){el.innerHTML='<div style="color:var(--muted);font-size:11px"><span class="spin"></span> 方案生成中…</div>';return;}
  el.innerHTML=`<div style="color:var(--muted);font-size:11px"><span class="spin"></span> 正在生成方案说明…</div>`;
  try{
    const res=await fetch(`${API}/v1/demo/llm/plan-summary/${plan.planId}`,{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});
    const data=await res.json();
    el.innerHTML=`<div class="llm-panel"><div class="llm-tag">🤖 ${data.fallback?'兜底结果':'智能实时生成'}${data.from_cache?' · 已缓存':''}</div><div class="llm-text">${data.text}</div><div class="llm-actions"><button class="llm-btn" onclick="pgLoadLLM(pgCurrentPlan)">↺ 重新生成</button></div></div>`;
  }catch(e){el.innerHTML=`<div class="fallback-note">调用失败：${e.message}</div>`;}
}

function getWbObjectCenter(type, obj){
  if(!obj) return null;
  if(type==='intersection') return getIntersectionPosition(obj);
  if(type==='corridor' && obj.path?.length) return obj.path[Math.floor(obj.path.length/2)];
  if(obj.center || obj.location) return obj.center || obj.location;
  const points = type==='region' ? flattenWbLngLatPoints(obj.polygon) : flattenWbLngLatPoints(obj.path);
  if(points.length){
    const sum = points.reduce((acc,p)=>[acc[0]+p[0],acc[1]+p[1]],[0,0]);
    return [sum[0]/points.length,sum[1]/points.length];
  }
  return null;
}

function flattenWbLngLatPoints(value){
  if(!Array.isArray(value)) return [];
  if(value.length>=2 && typeof value[0]==='number' && typeof value[1]==='number') return [[value[0],value[1]]];
  return value.flatMap(item=>flattenWbLngLatPoints(item)).filter(p=>Number.isFinite(p[0])&&Number.isFinite(p[1]));
}

function wbSignalFlowEdgeKey(fromId, toId){ return `${fromId}->${toId}`; }

function addWbSignalFlowEdge(edges, fromId, toId, meta={}){
  if(!fromId || !toId || fromId===toId) return;
  const from = demoIndex?.intersection?.get(fromId);
  const to = demoIndex?.intersection?.get(toId);
  if(!from || !to) return;
  const key = wbSignalFlowEdgeKey(fromId, toId);
  if(edges.has(key)) return;
  edges.set(key, {
    fromId,
    toId,
    capacity: meta.capacity || 0,
    travelTime: meta.travelTime || null,
    source: meta.source || 'topology',
  });
}

function buildWbSignalFlowGraph(target, maxDepth=2){
  const edges = new Map();
  (demoData?.topologyLinks||[]).forEach(link=>{
    if(link.linkType !== 'intersection_to_intersection') return;
    addWbSignalFlowEdge(edges, link.fromId, link.toId, {
      capacity: link.capacity,
      travelTime: link.travelTime,
      source: 'topology',
    });
  });
  (demoData?.corridors||[]).forEach(c=>{
    const ids = (c.intersectionIds||[]).filter(id=>demoIndex?.intersection?.has(id));
    ids.forEach((id, idx)=>{
      if(idx < ids.length - 1) addWbSignalFlowEdge(edges, id, ids[idx+1], {source:'corridor', capacity:c.flow||c.capacity||0});
      if(idx > 0) addWbSignalFlowEdge(edges, id, ids[idx-1], {source:'corridor_reverse', capacity:c.flow||c.capacity||0});
    });
  });

  const adjacency = new Map();
  edges.forEach(edge=>{
    if(!adjacency.has(edge.fromId)) adjacency.set(edge.fromId, new Set());
    if(!adjacency.has(edge.toId)) adjacency.set(edge.toId, new Set());
    adjacency.get(edge.fromId).add(edge.toId);
    adjacency.get(edge.toId).add(edge.fromId);
  });

  const levels = new Map([[target.id, 0]]);
  const queue = [target.id];
  while(queue.length){
    const id = queue.shift();
    const level = levels.get(id) || 0;
    if(level >= maxDepth) continue;
    (adjacency.get(id)||[]).forEach(nextId=>{
      if(levels.has(nextId)) return;
      levels.set(nextId, level + 1);
      queue.push(nextId);
    });
  }

  const flowEdges = [];
  edges.forEach(edge=>{
    const fromLevel = levels.get(edge.fromId);
    const toLevel = levels.get(edge.toId);
    if(fromLevel == null || toLevel == null) return;
    if(Math.max(fromLevel, toLevel) > maxDepth) return;
    if(fromLevel === toLevel && fromLevel !== 0) return;
    flowEdges.push({...edge, fromLevel, toLevel});
  });
  flowEdges.sort((a,b)=>Math.max(a.fromLevel,a.toLevel)-Math.max(b.fromLevel,b.toLevel) || (b.capacity||0)-(a.capacity||0));
  return {levels, edges: flowEdges.slice(0, 12)};
}

function interpolateWbSignalPath(path, t){
  const pts = (path||[]).filter(Boolean);
  if(!pts.length) return null;
  if(pts.length === 1) return pts[0];
  const segT = t * (pts.length - 1);
  const idx = Math.min(pts.length - 2, Math.floor(segT));
  const local = segT - idx;
  const a = pts[idx], b = pts[idx + 1];
  return [a[0] + (b[0] - a[0]) * local, a[1] + (b[1] - a[1]) * local];
}

    });

  };

}

function loadWbPlaceSearchPlugin(){
  return new Promise((resolve, reject)=>{
    if(!window.AMap) return reject(new Error('高德地图未加载'));
    if(AMap.PlaceSearch) return resolve();
    AMap.plugin(['AMap.PlaceSearch'], ()=>resolve());
  });
}

function wbPoiLocationToPoint(loc){
  if(!loc) return null;
  const lng = typeof loc.getLng === 'function' ? loc.getLng() : (loc.lng ?? loc.longitude);
  const lat = typeof loc.getLat === 'function' ? loc.getLat() : (loc.lat ?? loc.latitude);
  if(lng == null || lat == null) return null;
  return [Number(lng), Number(lat)];
}

function wbApproxDistanceMeters(a, b){
  if(!a || !b) return Infinity;
  const lat = (a[1] + b[1]) / 2 * Math.PI / 180;
  const dx = (a[0] - b[0]) * 111320 * Math.cos(lat);
  const dy = (a[1] - b[1]) * 110540;
  return Math.sqrt(dx * dx + dy * dy);
}

async function searchWbSignalPoiAround(center, radius=1500){
  await loadWbPlaceSearchPlugin();
  const keywords = ['交通信号灯', '红绿灯', '信号灯'];
  const seen = new Set();
  const pois = [];
  async function searchOne(keyword){
    return new Promise(resolve=>{
      const service = new AMap.PlaceSearch({pageSize: 25, pageIndex: 1, extensions: 'base'});
      service.searchNearBy(keyword, center, radius, (status, result)=>{
        if(status !== 'complete' || !result?.poiList?.pois) return resolve();
        result.poiList.pois.forEach(poi=>{
          const pos = wbPoiLocationToPoint(poi.location);
          if(!pos) return;
          const dist = wbApproxDistanceMeters(center, pos);
          if(dist < 45 || dist > radius) return;
          const key = poi.id || `${pos[0].toFixed(6)},${pos[1].toFixed(6)}`;
          if(seen.has(key)) return;
          seen.add(key);
          pois.push({
            id: key,
            name: poi.name || keyword,
            address: poi.address || '',
            position: pos,
            distance: dist,
          });
        });
        resolve();
      });
    });
  }
  for(const kw of keywords) await searchOne(kw);
  return pois.sort((a,b)=>a.distance-b.distance).slice(0, 16);
}

function classifyWbPoiFlow(center, pos){
  const dx = pos[0] - center[0];
  const dy = pos[1] - center[1];
  return (dx < 0 || dy > 0) ? 'upstream' : 'downstream';
}

function renderWbSignalPoiFlow(target, pois){
  if(!wbMap || !target || !demoIndex?.intersection?.has(target.id)) return;
  const center = getIntersectionPosition(target);
  pois.forEach((poi, idx)=>{
    const level = poi.distance <= 750 ? 1 : 2;
    const pos = poi.position;
    const radius = level === 1 ? 10 : 7;
    const color = level === 1 ? '#00b5a3' : '#1a7fff';
    const node = new AMap.CircleMarker({
      center: pos,
      radius,
      strokeColor: color,
      strokeWeight: 2,
      strokeOpacity: .85,
      fillColor: color,
      fillOpacity: level === 1 ? .2 : .1,
      zIndex: 38 - level,
    });
    wbMap.add(node); wbMapMarkers.push(node);
    const label = new AMap.Marker({
      position: pos,
      anchor: 'top-center',
      offset: new AMap.Pixel(0, 12),
      zIndex: 54,
      content: `<div class="wb-signal-hop-label">${level}层 · ${poi.name}</div>`,
    });
    wbMap.add(label); wbMapMarkers.push(label);
    const dir = classifyWbPoiFlow(center, pos);
    const path = dir === 'upstream' ? [pos, center] : [center, pos];
    const lineColor = dir === 'upstream' ? '#e68a00' : '#00b5a3';
    const line = new AMap.Polyline({
      path,
      strokeColor: lineColor,
      strokeWeight: level === 1 ? 5 : 3.5,
      strokeOpacity: level === 1 ? .78 : .45,
      strokeStyle: level === 1 ? 'solid' : 'dashed',
      lineJoin: 'round',
      lineCap: 'round',
      zIndex: 32 - idx,
    });
    wbMap.add(line); wbMapOverlays.push(line);

    const particles = level === 1 ? 3 : 2;
    for(let i=0;i<particles;i++){
      const marker = new AMap.Marker({
        position: path[0],
        anchor: 'center',
        zIndex: 60,
        content: '<div class="wb-signal-flow-particle"></div>',
      });
      wbMap.add(marker); wbMapMarkers.push(marker);
      wbSignalFlowParticles.push({
        marker,
        path,
        offset: (i / particles) + idx * .07,
        duration: Math.max(1200, Math.min(2800, poi.distance * 1.25)),
      });
    }
  });

  const note = new AMap.Marker({
    position: center,
    anchor: 'bottom-center',
    offset: new AMap.Pixel(0, -34),
    zIndex: 62,
    content: `<div class="wb-signal-flow-note">高德POI 1.5km · ${pois.length} 个信号灯路口</div>`,
  });
  wbMap.add(note); wbMapMarkers.push(note);
  startWbSignalFlowAnimation();
}

async function renderWbTwoHopSignalFlow(target){
  if(!wbMap || !target || !demoIndex?.intersection?.has(target.id)) return;
  const seq = ++wbSignalPoiSearchSeq;
  const center = getIntersectionPosition(target);
  try{
    const pois = await searchWbSignalPoiAround(center, 1500);
    if(seq !== wbSignalPoiSearchSeq || currentObj?.id !== target.id) return;
    if(!pois.length) return;
    renderWbSignalPoiFlow(target, pois);
  }catch(e){
    console.warn('高德POI周边信号灯搜索失败', e);
  }
}

function addWbObjectBase(type, obj, color, emphasized=false){
  if(!wbMap || !obj) return;
  if(type==='region' && obj.polygon){
    const poly = new AMap.Polygon({path:obj.polygon,strokeColor:color,strokeWeight:emphasized?3:1.5,strokeOpacity:emphasized ? .9 : .55,fillColor:color,fillOpacity:emphasized ? .13 : .06,zIndex:emphasized?24:12});
    poly.on('click',()=>selectObject('region',obj.id));
    wbMap.add(poly); wbMapOverlays.push(poly);
    return;
  }
  if(type==='corridor' && obj.path){
    const line = new AMap.Polyline({path:obj.path,strokeColor:color,strokeWeight:emphasized?7:4,strokeOpacity:emphasized ? .9 : .62,strokeStyle:emphasized?'solid':'dashed',lineJoin:'round',lineCap:'round',zIndex:emphasized?26:14});
    line.on('click',()=>selectObject('corridor',obj.id));
    wbMap.add(line); wbMapOverlays.push(line);
    if(emphasized) addWbFlowDots(obj.path, wbAnalysisDimension==='spread'||wbAnalysisDimension==='trace');
    return;
  }
  if(type==='intersection'){
    const cls = color==='#e53935'?'danger':color==='#e68a00'?'warn':color==='#1da462'?'success':'';
    addWbAnalysisNode('intersection', obj, getIntersectionPosition(obj), cls);
  }
}

function getWbRelatedCorridors(target, type){
  const ids = new Set();
  (target?.mapContext?.upstreamIds||[]).forEach(id=>{ if(String(id).startsWith('COR-')) ids.add(id); });
  (target?.mapContext?.downstreamIds||[]).forEach(id=>{ if(String(id).startsWith('COR-')) ids.add(id); });
  if(type==='region'){
    (demoData?.corridors||[]).forEach(c=>{
      const touches = (target?.mapContext?.affectedObjectIds||[]).some(id=>(c.intersectionIds||[]).includes(id));
      if(touches) ids.add(c.id);
    });
  }
  if(type==='intersection'){
    const cid = demoIndex?.corridorByIntersection?.get(target.id);
    if(cid) ids.add(cid);
  }
  if(type==='corridor') ids.add(target.id);
  return [...ids].map(id=>demoIndex?.corridor?.get(id)).filter(Boolean);
}

function getWbAffectedIntersections(target){
  const ids = new Set();
  (target?.mapContext?.affectedObjectIds||[]).forEach(id=>{ if(String(id).startsWith('INT-')) ids.add(id); });
  (target?.issues||[]).forEach(iss=>{
    const ev = iss.evidence || {};
    (ev.affectedIntersections||ev.boundaryNodes||[]).forEach(id=>ids.add(id));
    if(ev.bottleneckNode) ids.add(ev.bottleneckNode);
  });
  if(target?.intersectionIds) target.intersectionIds.forEach(id=>ids.add(id));
  return [...ids].map(id=>demoIndex?.intersection?.get(id)).filter(Boolean);
}

function renderWbAnalysisOverview(){
  const types = wbAnalysisObjectType==='all' ? ['region','corridor','intersection'] : [wbAnalysisObjectType];
  types.forEach(type=>{
    const list = demoData?.[type==='region'?'regions':type==='corridor'?'corridors':'intersections']||[];
    list.forEach(obj=>{
      if(obj.status==='normal' && wbAnalysisDimension!=='strategy') return;
      const color = wbAnalysisDimension==='strategy' ? (obj.strategies?.length?'#1da462':'#5f7a9c') : getWbIssueHotColor(obj);
      addWbObjectBase(type, obj, color, false);
      const pos = getWbObjectCenter(type,obj);
      if(pos && obj.status!=='normal'){
        addWbAnalysisLabel(pos, obj.name, `${TYPE_LABELS[type]} · ${wbAnalysisDimLabel(wbAnalysisDimension)}`, color==='#e53935'?'danger':color==='#1da462'?'success':'');
      }
    });
  });
}

function renderWbFocusedAnalysis(type, target){
  const color = (wbAnalysisDimension==='strategy' || wbAnalysisDimension==='plan' || wbAnalysisDimension==='evaluation') ? '#1da462' : getWbIssueHotColor(target);
  addWbObjectBase(type, target, color, true);
  if(type === 'intersection') renderWbTwoHopSignalFlow(target);
  const center = getWbObjectCenter(type,target);
  const sat = Math.round(((target.saturation||target.stopRate||0)*100));
  const scene = target.sceneCognition?.sceneName || target.sceneCognition?.sceneType || '对象专题分析';
  const issue = (target.issues||[])[0];
  const strategy = (target.strategies||[])[0];
  const plan = getPlanForObj(target.id);
  const evaluation = getEvalForObj(target.id);
  const labelByDim = {
    cognition: [scene, `饱和度 ${sat||'--'}% · ${target.avgSpeed||'--'}km/h`],
    diagnosis: [issue?.name || target.primaryIssue || '诊断清单', issue?.reason || `${(target.issues||[]).length} 项问题`],
    strategy: [strategy?.description || '策略推荐', strategy?.objective || plan?.planName || '等待策略生成'],
    plan: [plan?.planName || '方案生成', plan ? `${translateStrategy(plan.strategy)} · ${translateStatus(plan.status)}` : '暂无方案数据'],
    evaluation: [evaluation?.summary || '评价反馈', evaluation ? `综合得分 ${evaluation.overallScore || evaluation.score || '--'} · ${evaluation.conclusion || '待复盘'}` : '暂无评价数据'],
    trace: ['流量溯源', `进入 ${target.inFlow?.toLocaleString?.()||'--'} / 离开 ${target.outFlow?.toLocaleString?.()||'--'} 辆/h`],
    mainPath: ['主路径识别', type==='corridor' ? target.name : `关联 ${getWbRelatedCorridors(target,type).length} 条干线`],
    spread: ['拥堵蔓延规律', target.sceneCognition?.state?.spreadDirection || issue?.evidence?.spreadDirection || '按上游瓶颈向相邻节点扩散'],
  }[wbAnalysisDimension] || ['分析', ''];
  addWbAnalysisLabel(center, labelByDim[0], labelByDim[1], color==='#e53935'?'danger':['strategy','plan','evaluation'].includes(wbAnalysisDimension)?'success':'');

  const relatedCorridors = getWbRelatedCorridors(target,type);
  const affected = getWbAffectedIntersections(target);
  if(['trace','mainPath','spread'].includes(wbAnalysisDimension)){
    relatedCorridors.forEach((c,idx)=>{
      const hot = wbAnalysisDimension==='spread';
      const line = new AMap.Polyline({path:c.path,strokeColor:hot?'#e53935':idx===0?'#00b5a3':'#1a7fff',strokeWeight:idx===0?7:5,strokeOpacity:idx===0 ? .92 : .62,strokeStyle:wbAnalysisDimension==='trace'?'dashed':'solid',lineJoin:'round',lineCap:'round',zIndex:30-idx});
      line.on('click',()=>selectObject('corridor',c.id));
      wbMap.add(line); wbMapOverlays.push(line);
      addWbFlowDots(c.path, hot, idx===0?7:4);
    });
    affected.forEach((i,idx)=>{
      const radius = wbAnalysisDimension==='spread' ? Math.max(10, 24 - idx*2) : 13;
      const circle = new AMap.CircleMarker({center:getIntersectionPosition(i),radius,strokeColor:wbAnalysisDimension==='spread'?'#e68a00':'#00b5a3',strokeWeight:2,strokeOpacity:.82,fillColor:wbAnalysisDimension==='spread'?'#e68a00':'#00b5a3',fillOpacity:wbAnalysisDimension==='spread'?Math.max(.08,.22-idx*.03):.16,zIndex:34});
      circle.on('click',()=>selectObject('intersection',i.id));
      wbMap.add(circle); wbMapMarkers.push(circle);
    });
  } else if(wbAnalysisDimension==='diagnosis'){
    affected.slice(0,6).forEach((i,idx)=>addWbAnalysisNode('intersection', i, getIntersectionPosition(i), idx===0?'danger':'warn'));
  } else if(['strategy','plan','evaluation'].includes(wbAnalysisDimension)){
    relatedCorridors.forEach(c=>{
      const line = new AMap.Polyline({path:c.path,strokeColor:'#1da462',strokeWeight:6,strokeOpacity:.78,lineJoin:'round',lineCap:'round',zIndex:28});
      line.on('click',()=>selectObject('corridor',c.id));
      wbMap.add(line); wbMapOverlays.push(line);
      addWbFlowDots(c.path, false, 4);
    });
  }
}

function renderWbAnalysisLayer(){
  clearWbMapOverlays();
  clearWbIssueHighlights();
  updateWbAnalysisControlLabel();
  if(currentObj) renderWbFocusedAnalysis(currentObjType, currentObj);
  else renderWbAnalysisOverview();
}

function syncWbMapWithWorkbench({focus=false} = {}){
  wbAnalysisObjectType = currentObjType || 'all';
  wbAnalysisDimension = wbDimensionForPhase(activePhase);
  if(!wbMap || !demoData) return;
  if(!currentObj){
    clearWbMapOverlays();
    clearWbSelectedHighlight();
    clearWbIssueHighlights();
    hideWbMapPopup();
    return;
  }
  renderWbAnalysisLayer();
  addWbSelectedHighlight(currentObjType, currentObj);
  if(focus) focusWbMapOnTarget(currentObjType, currentObj);
}

function focusWbMapOnTarget(type, target){
  if(!wbMap || !target) return;
  const center = getWbObjectCenter(type, target);
  if(type==='region' && target.polygon){
    wbMap.setZoomAndCenter(13,center||[117.02,36.65]);
    return;
  }
  if(type==='corridor' && target.path?.length){
    wbMap.setZoomAndCenter(13.5,center);
    return;
  }
  wbMap.setZoomAndCenter(15,center||getIntersectionPosition(target));
}

function addWbSelectedHighlight(type, target){
  if(!wbMap || !target) return;
  clearWbSelectedHighlight();
  if(type==='region' && target.polygon){
    const h = new AMap.Polygon({path:target.polygon,strokeColor:'#1a7fff',strokeWeight:3,strokeOpacity:1,fillColor:'#1a7fff',fillOpacity:.1,zIndex:40});
    wbMap.add(h); wbSelectedHighlight = h;
  } else if(type==='corridor' && target.path){
    const h = new AMap.Polyline({path:target.path,strokeColor:'#1a7fff',strokeWeight:9,strokeOpacity:.32,lineJoin:'round',lineCap:'round',zIndex:40});
    wbMap.add(h); wbSelectedHighlight = h;
  } else if(type==='intersection'){
    const pos = getIntersectionPosition(target);
    const outer = new AMap.CircleMarker({center:pos,radius:22,strokeColor:'#1a7fff',strokeWeight:2,strokeOpacity:.75,fillOpacity:0,zIndex:42});
    const inner = new AMap.CircleMarker({center:pos,radius:12,strokeColor:'#fff',strokeWeight:1.5,strokeOpacity:.55,fillColor:'#1a7fff',fillOpacity:.16,zIndex:41});
    wbMap.add([outer,inner]); wbSelectedHighlight = [outer,inner];
  }
}

function showWbMapPopup(type, target, tabIdx=0){
  wbMapPopupType = type; wbMapPopupTarget = target; wbMapPopupTabIdx = tabIdx;
  [0,1,2,3].forEach(i=>document.getElementById(`wbMppTab${i}`)?.classList.toggle('active',i===tabIdx));
  renderWbMapPopupHeader(type,target);
  renderWbMapPopupContent(type,target,tabIdx);
  renderWbMapPopupFooter(type,target);
  document.getElementById('wbMapPopup')?.classList.add('visible');
}

function hideWbMapPopup(){ document.getElementById('wbMapPopup')?.classList.remove('visible'); }

function setWbMapPopupTab(idx){
  wbMapPopupTabIdx = idx;
  [0,1,2,3].forEach(i=>document.getElementById(`wbMppTab${i}`)?.classList.toggle('active',i===idx));
  activePhase = idx===0 ? 1 : idx===1 ? 2 : idx===2 ? ([3,4].includes(activePhase) ? activePhase : 3) : 5;
  if(currentObj){
    updateWorkbenchChrome();
    renderPhaseContent(currentObjType, currentObj);
    syncWbMapWithWorkbench();
  }
  renderWbMapPopupContent(wbMapPopupType,wbMapPopupTarget,idx);
}

function renderWbMapPopupHeader(type,target){
  const sat = target?.saturation||target?.stopRate||0;
  document.getElementById('wbMapPopupHead').innerHTML = `
    <span style="font-size:22px">${TYPE_ICONS[type]||'📍'}</span>
    <div style="flex:1;min-width:0">
      <div class="wb-map-popup-title">${target?.name||'对象'}</div>
      <div class="wb-map-popup-sub">${TYPE_LABELS[type]||type} · 饱和度 ${Math.round(sat*100)||'--'}%</div>
    </div>
    <span class="pool-item-badge ${sat>=.88?'pib-critical':sat>=.7?'pib-warning':'pib-ok'}">${target?.status==='critical'?'严重':target?.status==='warning'?'预警':target?.status==='optimized'?'已优化':'监控'}</span>
    <span class="wb-map-popup-close" onclick="hideWbMapPopup()">✕</span>`;
}

function renderWbMapPopupContent(type,target,tab){
  const el = document.getElementById('wbMapPopupBody');
  if(!el || !target) return;
  if(tab===0) el.innerHTML = buildWbMppScene(type,target);
  else if(tab===1) el.innerHTML = buildWbMppDiag(target);
  else if(tab===2) el.innerHTML = buildWbMppStrategy(target);
  else el.innerHTML = buildWbMppEvaluation(type,target);
}

function buildWbMppScene(type,target){
  const sat = target.saturation||target.stopRate||0;
  const metrics = [
    ['饱和度',`${Math.round(sat*100)||'--'}%`,sat>=.85?'var(--danger)':sat>=.7?'var(--warn)':'var(--success)'],
    ['速度',`${target.avgSpeed||'--'} km/h`,'var(--accent)'],
    ['延误',`${target.avgDelay||target.delay||'--'}s`,'var(--text)'],
  ];
  return `<div class="wb-mpp-kpis">${metrics.map(([l,v,c])=>`<div class="wb-mpp-kpi"><div class="wb-mpp-kpi-val" style="color:${c}">${v}</div><div class="wb-mpp-kpi-lab">${l}</div></div>`).join('')}</div>
    <div class="wb-mpp-card"><div class="wb-mpp-title">对象特征</div>${type==='corridor'?`覆盖 ${(target.intersectionIds||[]).length} 个路口，绿波带宽 ${target.bandwidth||'--'}s`:type==='region'?`路网密度 ${target.roadDensity||'--'}，供需比 ${target.profile?.demand?.demandSupplyRatio||'--'}`:`控制类型 ${target.controlType||'自适应'}，周期 ${target.cycle||'--'}s`}</div>
    <div class="wb-mpp-card"><div class="wb-mpp-title">认知摘要</div>${target.sceneCognition?.summary||target.primaryIssue||'对象处于智能体持续监控中。'}</div>`;
}

function buildWbMppDiag(target){
  const issues = (target.issues||[]).slice(0,4);
  return `<div class="wb-mpp-card"><div class="wb-mpp-title">诊断清单</div>${issues.map((iss,i)=>`<div style="display:flex;align-items:center;gap:6px;margin-bottom:5px"><span>${issueCategory2icon(iss.category)}</span><strong style="flex:1">P${i} ${iss.name||iss.id}</strong><span style="color:${iss.severity>.8?'var(--danger)':iss.severity>.65?'var(--warn)':'var(--muted)'}">${Math.round((iss.severity||.7)*100)}%</span></div>`).join('')||'<div style="color:var(--muted)">暂无诊断数据</div>'}</div>`;
}

function buildWbMppStrategy(target){
  const strategies = (target.strategies||[]).slice(0,3);
  const plan = getPlanForObj(target.id);
  const strategyHtml = strategies.length
    ? strategies.map((s,i)=>`<div class="wb-mpp-card"><div class="wb-mpp-title">${i+1}. ${s.description||s.templateId}</div><div style="color:var(--muted)">${s.objective||''}</div><div style="height:4px;background:var(--border);border-radius:2px;overflow:hidden;margin-top:7px"><div style="height:100%;width:${(s.score||.8)*100}%;background:var(--accent)"></div></div></div>`).join('')
    : '<div class="wb-mpp-card"><div class="wb-mpp-title">策略</div><div style="color:var(--muted)">暂无匹配策略</div></div>';
  const planHtml = plan
    ? `<div class="wb-mpp-card"><div class="wb-mpp-title">方案生成</div><strong>${plan.planName || plan.planId}</strong><div style="color:var(--muted);margin-top:3px">${translateStrategy(plan.strategy)} · ${translateStatus(plan.status)}</div></div>`
    : '<div class="wb-mpp-card"><div class="wb-mpp-title">方案生成</div><div style="color:var(--muted)">暂无方案数据</div></div>';
  return activePhase===4 ? planHtml + strategyHtml : strategyHtml + planHtml;
}

function buildWbMppOD(type,target){
  const seed = target.id||'';
  function seededRand(s,min,max){ let h=0; for(const c of s) h=Math.imul(31,h)+c.charCodeAt(0)|0; return min+(Math.abs(h)%(max-min+1)); }
  const inFlow = target.inFlow||seededRand(seed+'if',3000,5500);
  const outFlow = target.outFlow||seededRand(seed+'of',2800,5300);
  const diff = inFlow - outFlow;
  return `<div class="wb-mpp-card"><div class="wb-mpp-title">${type==='region'?'区域进出流量':'主要来源构成'}</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:7px">
      <div class="wb-mpp-kpi"><div class="wb-mpp-kpi-val" style="color:var(--accent)">${inFlow.toLocaleString()}</div><div class="wb-mpp-kpi-lab">进入流量</div></div>
      <div class="wb-mpp-kpi"><div class="wb-mpp-kpi-val" style="color:var(--accent2)">${outFlow.toLocaleString()}</div><div class="wb-mpp-kpi-lab">离开流量</div></div>
    </div>
    <div style="font-size:11px;color:${diff>400?'var(--danger)':diff>0?'var(--warn)':'var(--success)'}">净流入 ${diff>0?'+':''}${diff.toLocaleString()} 辆/h</div>
  </div>`;
}

function buildWbMppEvaluation(type,target){
  const ev = getEvalForObj(target.id);
  if(!ev) return '<div class="wb-mpp-card"><div class="wb-mpp-title">评价反馈</div><div style="color:var(--muted)">暂无该对象评价记录</div></div>';
  const score = ev.overallScore != null ? Math.round(Number(ev.overallScore) * 100) : '--';
  const improvements = ev.improvements || [];
  return `<div class="wb-mpp-kpis">
      <div class="wb-mpp-kpi"><div class="wb-mpp-kpi-val" style="color:${ev.meetsTarget?'var(--success)':'var(--warn)'}">${score}</div><div class="wb-mpp-kpi-lab">综合评分</div></div>
      <div class="wb-mpp-kpi"><div class="wb-mpp-kpi-val" style="color:var(--accent)">${improvements.filter(i=>i.meetsTarget).length}/${improvements.length}</div><div class="wb-mpp-kpi-lab">指标达标</div></div>
      <div class="wb-mpp-kpi"><div class="wb-mpp-kpi-val" style="color:${ev.experienceWorthy?'var(--purple)':'var(--muted)'}">${ev.experienceWorthy?'是':'否'}</div><div class="wb-mpp-kpi-lab">经验沉淀</div></div>
    </div>
    <div class="wb-mpp-card"><div class="wb-mpp-title">复盘结论</div>${ev.conclusion || ev.recommendation || '评价数据已生成，等待进一步复盘。'}</div>`;
}

function renderWbMapPopupFooter(type,target){
  document.getElementById('wbMapPopupFoot').innerHTML = `
    <a class="wb-action-link" href="javascript:void(0)" onclick="selectObject('${type}','${target.id}')">同步工作台</a>
    <a class="wb-action-link" href="/debug/city-demo.html?id=${target.id}&type=${type}">回到总览</a>`;
}

async function highlightIssueOnMap(issueId, evidence, issueName){
  await showCurrentOnWbMap();
  if(!wbMap) return;
  activePhase = 2;
  if(currentObj){
    updateWorkbenchChrome();
    renderPhaseContent(currentObjType,currentObj);
  }
  syncWbMapWithWorkbench({focus:true});
  clearWbIssueHighlights();
  let ev = evidence;
  if(typeof ev === 'string'){ try{ ev = JSON.parse(ev.replace(/&quot;/g,'"')); }catch(e){ ev = {}; } }
  const marks = [];
  const target = currentObj;
  const type = currentObjType;
  const tgtPos = getWbObjectCenter(type,target);
  const getIP = id => { const i=demoIndex?.intersection?.get(id); return i?getIntersectionPosition(i):null; };
  const addCirc = (pos,r,col,fo=.18,so=.9,zi=60) => {
    if(!pos) return;
    const m = new AMap.CircleMarker({center:pos,radius:r,strokeColor:col,strokeWeight:2.5,strokeOpacity:so,fillColor:col,fillOpacity:fo,zIndex:zi});
    wbMap.add(m); marks.push(m);
  };
  const addTag = (pos,txt,bg,above=true) => {
    if(!pos) return;
    const m = new AMap.Marker({position:pos,anchor:above?'bottom-center':'top-center',zIndex:70,content:`<div style="background:${bg};color:#fff;padding:4px 9px;border-radius:7px;font-size:10px;font-weight:800;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,.35)">${txt}</div>`});
    wbMap.add(m); marks.push(m);
  };
  const affected = ev?.affectedIntersections||ev?.boundaryNodes||[];
  const bottleneck = ev?.bottleneckNode;
  if(issueId?.includes('saturation') || issueId?.includes('congestion') || ev?.congestionPhase){
    if(bottleneck){ const p=getIP(bottleneck); addCirc(p,28,'#e53935',.15,1); addTag(p,'拥堵源头','rgba(229,57,53,.94)'); }
    affected.forEach((id,idx)=>addCirc(getIP(id),Math.max(8,20-idx*2),'#e68a00',Math.max(.08,.28-idx*.05),.75));
    if(tgtPos) addTag(tgtPos, ev?.congestionPhase||issueName||'高饱和拥堵','rgba(229,57,53,.94)');
  } else if(issueId?.includes('queue') || issueId?.includes('overflow')){
    addCirc(tgtPos,26,'#e53935',.15,1); addTag(tgtPos, ev?.queueLength?`排队 ${ev.queueLength}m`:(issueName||'排队溢流'),'rgba(229,57,53,.94)');
    affected.forEach(id=>addCirc(getIP(id),16,'#e53935',.18,.8));
  } else if(issueId?.includes('green_wave') || issueId?.includes('bandwidth') || issueId?.includes('coord')){
    if(type==='corridor' && target?.path){
      const line = new AMap.Polyline({path:target.path,strokeColor:'#e68a00',strokeWeight:10,strokeOpacity:.5,lineJoin:'round',lineCap:'round',zIndex:60});
      wbMap.add(line); marks.push(line);
    }
    addTag(tgtPos, ev?.bandwidthLoss?`绿波带宽损失 ${ev.bandwidthLoss}s`:(issueName||'绿波协调异常'),'rgba(230,138,0,.94)');
  } else {
    addCirc(tgtPos,28,'#1a7fff',.1,.8); addTag(tgtPos, issueName||issueLabel(issueId)||'问题定位','rgba(26,127,255,.92)');
  }
  wbIssueHighlightMarkers = marks;
}

function highlightStrategyOnMap(tplId){
  activePhase = 3;
  if(currentObj){
    updateWorkbenchChrome();
    renderPhaseContent(currentObjType,currentObj);
    syncWbMapWithWorkbench({focus:true});
    addWbAnalysisLabel(getWbObjectCenter(currentObjType,currentObj),'策略覆盖',tplId||'推荐策略','success');
  }
}

boot();
</script>
