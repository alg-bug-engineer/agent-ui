    <div class="detail-title"><div class="detail-dot" style="background:var(--danger)"></div>${currentQueueTab==='bgIssue'?'结构性问题诊断':currentQueueTab==='dynIssue'?'动态异常诊断':'问题诊断体检单'}
      <span style="margin-left:auto;display:inline-flex;align-items:center;gap:8px">
        <span style="font-size:9px;color:var(--muted)">${issues.length} 项</span>
        ${wbWorkbenchPhaseDetailLink(type, id, 2)}
      </span>
    </div>
    <div class="checkup-list">`;
  if(issues.length){
    issues.forEach((iss,idx)=>{
      const lv = idx===0?'P0':idx===1?'P1':idx===2?'P2':'P3';
      const cls = priorityLevel2cls(lv);
      const icon = issueCategory2icon(iss.category);
      const evStr = fmtEvidence(iss.evidence||{});
      const issNameSafe = (iss.name||iss.id||'').replace(/'/g,'&#39;');
      html += `<div class="checkup-item" onclick="highlightIssueOnMap('${iss.id}','${JSON.stringify(iss.evidence||{}).replace(/"/g,'&quot;')}','${issNameSafe}')">
        <div class="checkup-rank ${cls}">${lv}</div>
        <div class="checkup-body">
          <div class="checkup-name">${icon} ${iss.name||iss.id}</div>
          <div class="checkup-evidence">${iss.reason||'—'}</div>
          ${evStr?`<span class="checkup-toggle" onclick="toggleDetail(this)">展开证据▾</span><div class="checkup-detail" style="line-height:1.9">${evStr}</div>`:''}
        </div>
      </div>`;
    });
  } else {
    html += `<div style="font-size:10px;color:var(--muted);padding:5px">暂无诊断问题</div>`;
  }
  html += `</div></div>`;

  // ── 3. 控制策略推荐 ──
  html += `<div class="detail-block">
    <div class="detail-title"><div class="detail-dot" style="background:var(--accent)"></div>${currentQueueTab==='bgIssue'?'长效控制策略':currentQueueTab==='dynIssue'?'紧急应对策略':'控制策略推荐'}
      <span style="margin-left:auto">${wbWorkbenchPhaseDetailLink(type, id, 3)}</span>
    </div>`;
  if(strategies.length){
    strategies.slice(0,3).forEach((s,i)=>{
      const risk = s.score>=0.9?'low':s.score>=0.7?'medium':'high';
      const riskLabel = {low:'低风险',medium:'中风险',high:'高风险'}[risk];
      html += `<div class="strategy-card" onclick="highlightStrategyOnMap('${s.templateId}')">
        <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:5px">
          <div style="font-size:9px;font-weight:800;color:var(--muted)">${i+1}</div>
          <div style="flex:1">
            <div class="strategy-name">${s.description||s.templateId}</div>
            <div class="strategy-desc">${s.objective||''}</div>
          </div>
        </div>
        <div style="display:flex;align-items:center;gap:5px;margin-top:4px">
          <span class="strategy-risk risk-${risk}">${riskLabel}</span>
          <div style="font-size:9px;color:var(--muted);flex:1">${risk==='high'?'⚠️ 需审批':'✅ 可自动执行'}</div>
          <span style="font-size:10px;font-weight:700;color:var(--accent)">${Math.round((s.score||0.8)*100)}%</span>
        </div>
        <div class="strategy-score-row">
          <div class="strategy-score-bar"><div class="strategy-score-fill" style="width:${(s.score||0.8)*100}%"></div></div>
        </div>
      </div>`;
    });
  } else {
    html += `<div style="font-size:10px;color:var(--muted);padding:4px">暂无匹配策略</div>`;
  }
  html += `</div>`;

  // ── 4. 信控方案生成调整 ──
  const staticPlan = getPlanForObj(id);
  html += renderPlanBlock(staticPlan, {type, id});

  // ── 5. 评价效果指标（已完成对象） ──
  const isCompleted = target?.status==='optimized' || (getRunForObj(id)?.status==='completed');
  if(isCompleted){
    const staticEval = getEvalForObj(id);
    if(staticEval){
      html += renderEvalBlock(staticEval, type, {type, id});
    } else {
      // 无完整评价记录时，根据对象静态属性构建基础评价块
      const completedRun = getRunForObj(id);
      const isRegion = type === 'region';
      const isCorridor = type === 'corridor';
      const beforeSpeed = (isRegion || isCorridor) ? (target?.avgSpeed||null) : null;
      const afterSpeed = beforeSpeed ? +(beforeSpeed * 1.45).toFixed(1) : null;
      const beforeDelay = target?.avgDelay||null;
      const afterDelay = beforeDelay ? +(beforeDelay * 0.62).toFixed(1) : null;
      const beforeSat = target?.saturation||0;
      const afterSat = beforeSat ? +(beforeSat * 0.87).toFixed(2) : null;
      const metricsData = (beforeSpeed||beforeDelay||beforeSat) ? {
        before: Object.fromEntries([
          beforeSpeed!=null && ['avgSpeed', beforeSpeed],
          beforeDelay!=null && ['avgDelay', beforeDelay],
          beforeSat && ['saturation', beforeSat]
        ].filter(Boolean)),
        after: Object.fromEntries([
          afterSpeed!=null && ['avgSpeed', afterSpeed],
          afterDelay!=null && ['avgDelay', afterDelay],
          afterSat && ['saturation', afterSat]
        ].filter(Boolean))
      } : {};
      const fallbackEval = {
        overallScore: completedRun?.overallScore || (target?.status==='optimized' ? 0.88 : 0.82),
        meetsTarget: completedRun?.meetsTarget != null ? completedRun.meetsTarget : true,
        windowMinutes: 30,
        evaluatedAt: completedRun?.endTime || '—',
        metrics: metricsData,
        improvements: [],
        sideEffects: [],
        recommendation: target?.status==='optimized'
          ? '当前优化方案已稳定运行，建议纳入长效配时库并定期复核效果。'
          : '优化效果已达标，建议持续监测并在下一个优化周期中进一步提升。'
      };
      html += renderEvalBlock(fallbackEval, type, {type, id});
    }
  }

  // ── 触发按钮（移至底部，作为次要操作） ──
  html += `<div class="detail-block">
    <button style="width:100%;padding:6px;border:1px solid rgba(26,127,255,.3);border-radius:6px;background:rgba(26,127,255,.08);color:var(--accent);font-size:10px;font-weight:700;cursor:pointer" onclick="triggerManualRun('${type}','${id}','${(target?.name||id).replace(/'/g,"\\'")}')">🚀 手动触发智能体闭环</button>
  </div>`;

  document.getElementById('rightDetail').innerHTML = html;
}

// ===== RUN LIST =====
function renderRunList(runs){
  const el = document.getElementById('runList');
  const cntEl = document.getElementById('runListCount');
  if(!el) return; // 队列列表区块已删除
  if(cntEl) cntEl.textContent = `${runs.length} 个`;
  if(!runs.length){ el.innerHTML = `<div style="font-size:10px;color:var(--muted);padding:5px 0">暂无活跃运行</div>`; return; }
  el.innerHTML = runs.map(r=>{
    const col = runStatus2color(r.status);
    const icon = {region:'🏙️',corridor:'🛣️',intersection:'🔦'}[r.targetType]||'📍';
    const srcLabel = {periodic:'周期',realtime:'实时',manual:'手动',rerun:'复跑',exception:'异常'}[r.triggerSource]||'';
    const active = r.runId===currentRunId?'active-run':'';
    return `<div class="run-item ${active}" onclick="selectRunItem('${r.runId}','${r.targetType}','${r.targetId}')">
      <span class="run-item-icon">${icon}</span>
      <div class="run-item-info">
        <div class="run-item-name">${r.targetName}</div>
        <div class="run-item-desc">${srcLabel} · ${r.currentPhase||''} · ${r.elapsedSeconds||'进行中'}s</div>
      </div>
      <span class="run-item-status" style="color:${col}">●</span>
    </div>`;
  }).join('');
}

function renderPendingBlock(runs){
  const pending = runs.filter(r=>r.automationStatus==='pending_approval'||r.automationStatus==='manual_takeover');
  const block = document.getElementById('pendingBlock');
  const list = document.getElementById('pendingList');
  if(!pending.length){ block.style.display='none'; document.getElementById('badge-pending').textContent='待审批 0'; return; }
  block.style.display='block';
  document.getElementById('badge-pending').textContent = `待审批 ${pending.length}`;
  list.innerHTML = pending.map(r=>`
    <div class="pending-item" onclick="selectRunItem('${r.runId}','${r.targetType}','${r.targetId}')">
      <span class="pending-item-name">${r.targetName} · ${automation2label(r.automationStatus)}</span>
      ${r.automationStatus==='pending_approval'?`<button class="pending-btn" onclick="event.stopPropagation();openApprovalModal('${r.runId}')">审批</button>`:''}
    </div>`).join('');
}

function selectRunItem(runId, type, targetId, opts={}){
  const shouldOpenMapPopup = opts.openPopup === true;
  cancelDynamicReasoning();
  currentRunId = runId;
  clearIssueHighlights(); // 切换 run 时清除问题高亮
  selectedObjType = type;
  selectedObjId = targetId;
  if(!shouldOpenMapPopup) hideMapPopup();
  clearDynamicAlertMapLayers();
  clearDynamicAlertOverlays();
  const target = getObj(type, targetId);
  if(target){
    renderAnalysisLayer();
    focusMapOnTarget(type, target);
    addSelectedHighlight(type, target);
    if(shouldOpenMapPopup) showMapPopup(type, target);
  }
  const run = activeRuns.find(r=>r.runId===runId);
  if(run){
    renderRunStatusBar(run);
    renderRunDetail(run, target||{});
  }
  renderRunList(activeRuns);
}

function selectRunItemFromMap(runId, type, targetId){
  selectRunItem(runId, type, targetId, {openPopup:true});
}

// ===== 审批确认弹窗 =====
let _approvalRunId = null;

function openApprovalModal(runId){
  _approvalRunId = runId;
  const run = activeRuns.find(r=>r.runId===runId);
  if(!run){ showToast('⚠️ 未找到待审批记录，请刷新后重试', 'warn'); return; }

  const targetType = run.targetType;
  const targetId   = run.targetId;
  let target = null;
  if(demoData){
    if(targetType==='region')       target = (demoData.regions||[]).find(r=>r.id===targetId);
    else if(targetType==='corridor') target = (demoData.corridors||[]).find(c=>c.id===targetId);
    else                             target = (demoData.intersections||[]).find(i=>i.id===targetId);
  }

  const issues     = target?.issues||[];
  const strategies = target?.strategies||[];
  const sat = target?.saturation||0;
  const satColor = sat>=0.88?'var(--danger)':sat>=0.7?'var(--warn)':'var(--success)';
  const typeLbl  = {region:'区域',corridor:'干线',intersection:'路口'}[targetType]||targetType;
  const typeTagBg= {region:'rgba(26,127,255,.08)',corridor:'rgba(0,181,163,.08)',intersection:'rgba(108,58,203,.06)'}[targetType];
  const typeTagFg= {region:'var(--accent)',corridor:'var(--accent2)',intersection:'#6c3acb'}[targetType];

  // risk from top strategy or default to high (because it needs approval)
  const topScore = strategies[0]?.score||0;
  const risk = topScore>=0.9?'low':topScore>=0.7?'medium':'high';
  const riskLbl = {low:'低风险',medium:'中风险',high:'高风险'}[risk];
  const riskColor = {low:'var(--success)',medium:'var(--warn)',high:'var(--danger)'}[risk];

  // Expected gain from run phases or use placeholder
  const planPhase = (run.phases||[]).find(p=>p.phase==='plan_generation');
  const gain = planPhase?.output?.estimatedGain||target?.estimatedGain||null;

  const gainCards = gain ? Object.entries(gain).slice(0,4).map(([k,v])=>{
    const lbl = {avgSpeedImprovement:'均速提升',delayReduction:'延误降低',stopRateReduction:'停车率降低',
                 throughputIncrease:'通行量提升',congestionSpreadReduction:'扩散抑制',greenWaveBandEast:'东向带宽',greenWaveBandWest:'西向带宽'}[k]||k;
    return `<div class="apv-effect-item"><div class="apv-effect-val">${v}</div><div class="apv-effect-lbl">${lbl}</div></div>`;
  }).join('') : '';

  document.getElementById('approvalBody').innerHTML = `
    <div class="apv-target">
      <span class="apv-type-tag" style="background:${typeTagBg};color:${typeTagFg}">${typeLbl}</span>
      <strong style="font-size:14px">${run.targetName||targetId}</strong>
      <span class="apv-risk-badge" style="background:${riskColor}14;color:${riskColor};border-color:${riskColor}40">${riskLbl}</span>
    </div>

    ${run.approvalReason?`<div class="apv-reason" style="background:rgba(245,166,35,.05);border-color:rgba(245,166,35,.28)">
      <div style="font-size:10px;font-weight:700;color:var(--warn);margin-bottom:3px">⚠️ 需人工审批的原因</div>
      <div style="font-size:12px;color:var(--text)">${run.approvalReason}</div>
    </div>`:''}

    ${sat>0?`<div class="apv-section">
      <div class="apv-section-title">📊 关键运行指标</div>
      <div class="apv-metric-row">
        <div class="apv-metric"><div class="apv-metric-val" style="color:${satColor}">${Math.round(sat*100)}%</div><div class="apv-metric-lbl">饱和度</div></div>
        ${target?.avgSpeed?`<div class="apv-metric"><div class="apv-metric-val" style="color:var(--accent)">${target.avgSpeed} km/h</div><div class="apv-metric-lbl">平均车速</div></div>`:''}
        ${target?.avgDelay?`<div class="apv-metric"><div class="apv-metric-val" style="color:var(--warn)">${target.avgDelay}s</div><div class="apv-metric-lbl">平均延误</div></div>`:''}
        ${target?.stopRate?`<div class="apv-metric"><div class="apv-metric-val" style="color:var(--danger)">${Math.round(target.stopRate*100)}%</div><div class="apv-metric-lbl">停车率</div></div>`:''}
      </div>
    </div>`:''}

    ${issues.length?`<div class="apv-section">
      <div class="apv-section-title">⚠️ 问题诊断（${issues.length}项）</div>
      ${issues.slice(0,4).map((iss,i)=>{
        const lv = i===0?'P0':i===1?'P1':i===2?'P2':'P3';
        const lvColor = i===0?'var(--danger)':i<=1?'var(--warn)':'var(--muted)';
        const catIcon = iss.category==='dynamic'?'⚡':iss.category==='signal_control'?'🚦':'📋';
        return `<div class="apv-issue-row">
          <span style="font-size:9px;font-weight:800;padding:1px 5px;border-radius:4px;background:${lvColor}18;color:${lvColor}">${lv}</span>
          <span style="font-size:12px;font-weight:600;flex:1">${iss.name||iss.id}</span>
          <span style="font-size:10px;color:var(--muted)">${catIcon}</span>
        </div>`;
      }).join('')}
    </div>`:''}

    ${strategies.length?`<div class="apv-section">
      <div class="apv-section-title">🎯 推荐控制策略</div>
      ${strategies.slice(0,2).map((s,i)=>{
        const sr = s.score>=0.9?'low':s.score>=0.7?'medium':'high';
        const sc = {low:'var(--success)',medium:'var(--warn)',high:'var(--danger)'}[sr];
        const srLbl = {low:'低风险',medium:'中风险',high:'高风险'}[sr];
        return `<div class="apv-strat-row">
          <span style="font-size:10px;font-weight:800;color:var(--muted)">${i+1}</span>
          <div style="flex:1">
            <div style="font-size:12px;font-weight:700">${s.description||s.templateId}</div>
            ${s.objective?`<div style="font-size:10px;color:var(--muted);margin-top:2px">${s.objective}</div>`:''}
          </div>
          <div style="text-align:right">
            <div style="font-size:11px;font-weight:800;color:${sc}">${Math.round((s.score||0.8)*100)}%</div>
            <div style="font-size:9px;color:${sc};background:${sc}14;padding:1px 5px;border-radius:4px;margin-top:2px">${srLbl}</div>
          </div>
        </div>`;
      }).join('')}
    </div>`:''}

    ${gainCards?`<div class="apv-section">
      <div class="apv-section-title">📈 预期优化效果</div>
      <div class="apv-effect-grid">${gainCards}</div>
    </div>`:'<div style="font-size:11px;color:var(--muted);padding:6px 0">⏳ 方案效益评估进行中，审批通过后将自动执行</div>'}

    <div style="margin-top:4px;padding:8px 10px;border-radius:7px;background:rgba(26,127,255,.04);border:1px solid rgba(26,127,255,.12);font-size:11px;color:var(--muted)">
      💡 <strong style="color:var(--text)">审批说明：</strong>审批通过后，系统将自动下发配时方案并启动闭环监控；驳回则退回策略重新评估；人工接管则由交警手动介入控制。
    </div>`;

  document.getElementById('approvalNotes').value = '';
  document.getElementById('approvalModal').style.display = 'flex';
}

function closeApprovalModal(){
  document.getElementById('approvalModal').style.display = 'none';
  _approvalRunId = null;
}

async function confirmApprovalAction(action){
  if(!_approvalRunId) return;
  const runId = _approvalRunId;
  const notes = document.getElementById('approvalNotes').value.trim();
  closeApprovalModal();
  await doHumanAction(runId, action, notes||action, null);
}

// ===== HUMAN ACTIONS =====
async function doHumanAction(runId, action, reason='', btnEl){
  // 乐观 UI：禁用按钮、显示处理中
  if(btnEl){ btnEl.disabled=true; btnEl._origText=btnEl.textContent; btnEl.textContent='处理中…'; }
  const actionLabel = {approve:'✅ 审批通过',reject:'❌ 已驳回',takeover:'🔧 已接管',restore:'🔄 已恢复自动'}[action]||'操作成功';
  try{
    const res = await fetch(`${API}/v1/demo/runs/human-action`, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ run_id: runId, action, operator:'值班交警', operator_role:'操作员', reason: reason||action, note: '' })
    });
    if(res.ok){
      showToast(actionLabel, 'success');
      pollRuns();
    } else {
      const errData = await res.json().catch(()=>({}));
      showToast(`⚠️ 操作失败：${errData.detail||res.statusText}`, 'warn');
      if(btnEl){ btnEl.disabled=false; btnEl.textContent=btnEl._origText||action; }
    }
  }catch(e){
    console.error(e);
    showToast('⚠️ 网络异常，请检查服务连接', 'warn');
    if(btnEl){ btnEl.disabled=false; btnEl.textContent=btnEl._origText||action; }
  }
}

async function triggerManualRun(type, id, name){
  try{
    const res = await fetch(`${API}/v1/demo/runs/trigger`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ target_id:id, target_name:name, target_type:type, trigger_reason:'手动触发' })
    });
    if(res.ok){
      const d = await res.json();
      currentRunId = d.runId;
      setTimeout(pollRuns, 500);
    }
  }catch(e){ console.error(e); }
}

async function fetchRunReport(runId){
  try{
    const res = await fetch(`${API}/v1/demo/runs/llm-report/${runId}`, {method:'POST'});
    if(res.ok) pollRuns();
  }catch(e){}
}

// ===== POLLING =====
async function pollRuns(){
  try{
    const res = await fetch(`${API}/v1/demo/runs?limit=30`);
    if(!res.ok) return;
    const data = await res.json();
    activeRuns = data.runs||[];
    renderRunList(activeRuns);
    renderPendingBlock(activeRuns);
    renderAgentQueue();
    // 更新待审批 badge
    const pendingCount = activeRuns.filter(r=>r.automationStatus==='pending_approval'||r.automationStatus==='manual_takeover').length;
    document.getElementById('badge-pending').textContent = `待审批 ${pendingCount}`;
    // 若当前有选中对象，更新右侧
    if(selectedObjId){
      const run = activeRuns.find(r=>r.targetId===selectedObjId);
      if(run){
        currentRunId = run.runId;
        renderRunStatusBar(run);
        const target = getObj(selectedObjType, selectedObjId);
        if(target) renderRunDetail(run, target);
      }
    }
    // 更新时间线
    if(demoData) renderTimeline(demoData.overview.agentStatus);
  }catch(e){}

  // 调度器状态
  try{
    const sr = await fetch(`${API}/v1/demo/scheduler/status`);
    if(sr.ok){
      const sd = await sr.json();
      const dot = document.getElementById('schedulerDot');
      const lbl = document.getElementById('schedulerLabel');
      if(sd.running){ dot.className='scheduler-dot'; lbl.textContent='智能体运行中'; }
      else{ dot.className='scheduler-dot paused'; lbl.textContent='调度器已停止'; }
    }
  }catch(e){}
}

// ===== TIMELINE =====
const PHASE_ICONS = { scene_cognition:'🔍', problem_diagnosis:'🩺', control_strategy:'📐', plan_generation:'📋', evaluation_feedback:'📊' };
const PHASE_LABELS = { scene_cognition:'认知', problem_diagnosis:'诊断', control_strategy:'策略', plan_generation:'方案', evaluation_feedback:'评价' };
const PHASE_NUM = { scene_cognition:1, problem_diagnosis:2, control_strategy:3, plan_generation:4, evaluation_feedback:5 };

function renderTimeline(agentStatus){
  const phases = ['scene_cognition','problem_diagnosis','control_strategy','plan_generation','evaluation_feedback'];
  const keys = ['sceneCognition','problemDiagnosis','controlStrategy','planGeneration','evaluationFeedback'];
  const el = document.getElementById('agentTimeline');
  el.innerHTML = phases.map((p,i)=>{
    const ag = (agentStatus||{})[keys[i]]||{};
    const cls = ag.status==='running'?'running':'done';
    const wbUrl = `/debug/agent-workbench.html?phase=${PHASE_NUM[p]}${selectedObjId?'&id='+selectedObjId+'&type='+(selectedObjType||'region'):''}`;
    return `<div class="phase-step">
      <div class="phase-node" onclick="window.location='${wbUrl}'">
        <div class="phase-circle ${cls}">${PHASE_ICONS[p]}</div>
        <div class="phase-label">${PHASE_LABELS[p]}</div>
      </div>
      ${i<phases.length-1?'<div class="phase-arrow"></div>':''}
    </div>`;
  }).join('');
  el.innerHTML += `<div style="margin-left:8px;font-size:8px;color:rgba(107,140,176,.55);align-self:center">点击进入工作台</div>`;
}

// ===== MAP LAYERS =====
function clearMapLayers(){
  stopSignalFlowAnimation();
  if(map && (markers.length||regionLayers.length||corridorLayers.length)){
    map.remove([...markers,...regionLayers,...corridorLayers]);
  }
  markers=[]; regionLayers=[]; corridorLayers=[];

function addFlowDots(path, hot=false, count=5){

  usable.filter((_,idx)=>idx%step===0).slice(0,count).forEach((pos,idx)=>{
    const marker = new AMap.Marker({
      position: pos,
      anchor: 'center',
      zIndex: 51 + idx,
      content: `<div class="analysis-flow-dot ${hot?'hot':''}" style="animation-delay:${idx*.22}s"></div>`,
    });
    map.add(marker); markers.push(marker);
  });
}

function signalFlowEdgeKey(fromId, toId){ return `${fromId}->${toId}`; }

function addSignalFlowEdge(edges, fromId, toId, meta={}){
  if(!fromId || !toId || fromId===toId) return;
  const from = demoIndex?.intersections?.get(fromId);
  const to = demoIndex?.intersections?.get(toId);
  if(!from || !to) return;
  const key = signalFlowEdgeKey(fromId, toId);
  if(edges.has(key)) return;
  edges.set(key, {
    fromId,
    toId,
    capacity: meta.capacity || 0,
    travelTime: meta.travelTime || null,
    source: meta.source || 'topology',
  });
}

function buildSignalFlowGraph(target, maxDepth=2){
  const edges = new Map();
  (demoData?.topologyLinks||[]).forEach(link=>{
    if(link.linkType !== 'intersection_to_intersection') return;
    addSignalFlowEdge(edges, link.fromId, link.toId, {
      capacity: link.capacity,
      travelTime: link.travelTime,
      source: 'topology',
    });
  });
  (demoData?.corridors||[]).forEach(c=>{
    const ids = (c.intersectionIds||[]).filter(id=>demoIndex?.intersections?.has(id));
    ids.forEach((id, idx)=>{
      if(idx < ids.length - 1) addSignalFlowEdge(edges, id, ids[idx+1], {source:'corridor', capacity:c.flow||c.capacity||0});
      if(idx > 0) addSignalFlowEdge(edges, id, ids[idx-1], {source:'corridor_reverse', capacity:c.flow||c.capacity||0});
    });
  });

  const adjacency = new Map();
  edges.forEach(edge=>{
    if(!adjacency.has(edge.fromId)) adjacency.set(edge.fromId, new Set());
    if(!adjacency.has(edge.toId)) adjacency.set(edge.toId, new Set());
    adjacency.get(edge.fromId).add(edge.toId);
    adjacency.get(edge.toId).add(edge.fromId);
  });

  const levels = new Map([[target.id, 0]]);
  const queue = [target.id];
  while(queue.length){
    const id = queue.shift();
    const level = levels.get(id) || 0;
    if(level >= maxDepth) continue;
    (adjacency.get(id)||[]).forEach(nextId=>{
      if(levels.has(nextId)) return;
      levels.set(nextId, level + 1);
      queue.push(nextId);
    });
  }

  const flowEdges = [];
  edges.forEach(edge=>{
    const fromLevel = levels.get(edge.fromId);
    const toLevel = levels.get(edge.toId);
    if(fromLevel == null || toLevel == null) return;
    if(Math.max(fromLevel, toLevel) > maxDepth) return;
    if(fromLevel === toLevel && fromLevel !== 0) return;
    flowEdges.push({...edge, fromLevel, toLevel});
  });
  flowEdges.sort((a,b)=>Math.max(a.fromLevel,a.toLevel)-Math.max(b.fromLevel,b.toLevel) || (b.capacity||0)-(a.capacity||0));
  return {levels, edges: flowEdges.slice(0, 12)};
}

function interpolateSignalPath(path, t){
  const pts = (path||[]).filter(Boolean);
  if(!pts.length) return null;
  if(pts.length === 1) return pts[0];
  const segT = t * (pts.length - 1);
  const idx = Math.min(pts.length - 2, Math.floor(segT));
  const local = segT - idx;
  const a = pts[idx], b = pts[idx + 1];
  return [a[0] + (b[0] - a[0]) * local, a[1] + (b[1] - a[1]) * local];
}

function startSignalFlowAnimation(){
  if(!signalFlowParticles.length) return;
  const tick = (now)=>{
    signalFlowParticles.forEach(p=>{
      const t = ((now / p.duration) + p.offset) % 1;
      const pos = interpolateSignalPath(p.path, t);
      if(pos) p.marker.setPosition(pos);
    });
    signalFlowAnimationId = requestAnimationFrame(tick);
  };
  signalFlowAnimationId = requestAnimationFrame(tick);
}

function loadPlaceSearchPlugin(){
  return new Promise((resolve, reject)=>{
    if(!window.AMap) return reject(new Error('高德地图未加载'));
    if(AMap.PlaceSearch) return resolve();
    AMap.plugin(['AMap.PlaceSearch'], ()=>resolve());
  });
}

function poiLocationToPoint(loc){
  if(!loc) return null;
  const lng = typeof loc.getLng === 'function' ? loc.getLng() : (loc.lng ?? loc.longitude);
  const lat = typeof loc.getLat === 'function' ? loc.getLat() : (loc.lat ?? loc.latitude);
  if(lng == null || lat == null) return null;
  return [Number(lng), Number(lat)];
}

function approxDistanceMeters(a, b){
  if(!a || !b) return Infinity;
  const lat = (a[1] + b[1]) / 2 * Math.PI / 180;
  const dx = (a[0] - b[0]) * 111320 * Math.cos(lat);
  const dy = (a[1] - b[1]) * 110540;
  return Math.sqrt(dx * dx + dy * dy);
}

async function searchSignalPoiAround(center, radius=1500){
  await loadPlaceSearchPlugin();
  const keywords = ['交通信号灯', '红绿灯', '信号灯'];
  const seen = new Set();
  const pois = [];
  async function searchOne(keyword){
    return new Promise(resolve=>{
      const service = new AMap.PlaceSearch({pageSize: 25, pageIndex: 1, extensions: 'base'});
      service.searchNearBy(keyword, center, radius, (status, result)=>{
        if(status !== 'complete' || !result?.poiList?.pois) return resolve();
        result.poiList.pois.forEach(poi=>{
          const pos = poiLocationToPoint(poi.location);
          if(!pos) return;
          const dist = approxDistanceMeters(center, pos);
          if(dist < 45 || dist > radius) return;
          const key = poi.id || `${pos[0].toFixed(6)},${pos[1].toFixed(6)}`;
          if(seen.has(key)) return;
          seen.add(key);
          pois.push({
            id: key,
            name: poi.name || keyword,
            address: poi.address || '',
            position: pos,
            distance: dist,
          });
        });
        resolve();
      });
    });
  }
  for(const kw of keywords) await searchOne(kw);
  return pois.sort((a,b)=>a.distance-b.distance).slice(0, 16);
}

function classifyPoiFlow(center, pos){
  const dx = pos[0] - center[0];
  const dy = pos[1] - center[1];
  // POI 没有路网方向时，用相对方位给动效确定一个稳定的上下游方向。
  return (dx < 0 || dy > 0) ? 'upstream' : 'downstream';
}

function renderSignalPoiFlow(target, pois){
  if(!map || !target || !demoIndex?.intersections?.has(target.id)) return;
  const center = getIntersectionPosition(target);
  pois.forEach((poi, idx)=>{
    const level = poi.distance <= 750 ? 1 : 2;
    const pos = poi.position;
    const radius = level === 1 ? 10 : 7;
    const color = level === 1 ? '#00d4b4' : '#1a7fff';
    const node = new AMap.CircleMarker({
      center: pos,
      radius,
      strokeColor: color,
      strokeWeight: 2,
      strokeOpacity: .85,
      fillColor: color,
      fillOpacity: level === 1 ? .22 : .12,
      zIndex: 38 - level,
    });
    map.add(node); markers.push(node);
    const label = new AMap.Marker({
      position: pos,
      anchor: 'top-center',
      offset: new AMap.Pixel(0, 12),
      zIndex: 54,
      content: `<div class="signal-hop-label">${level}层 · ${poi.name}</div>`,
    });
    map.add(label); markers.push(label);
    const dir = classifyPoiFlow(center, pos);
    const path = dir === 'upstream' ? [pos, center] : [center, pos];
    const lineColor = dir === 'upstream' ? '#f5a623' : '#00d4b4';
    const line = new AMap.Polyline({
      path,
      strokeColor: lineColor,
      strokeWeight: level === 1 ? 5 : 3.5,
      strokeOpacity: level === 1 ? .78 : .48,
      strokeStyle: level === 1 ? 'solid' : 'dashed',
      lineJoin: 'round',
      lineCap: 'round',
      zIndex: 32 - idx,
    });
    map.add(line); corridorLayers.push(line);

    const particles = level === 1 ? 3 : 2;
    for(let i=0;i<particles;i++){
      const marker = new AMap.Marker({
        position: path[0],
        anchor: 'center',
        zIndex: 60,
        content: '<div class="signal-flow-particle"></div>',
      });
      map.add(marker); markers.push(marker);
      signalFlowParticles.push({
        marker,
        path,
        offset: (i / particles) + idx * .07,
        duration: Math.max(1200, Math.min(2800, poi.distance * 1.25)),
      });
    }
  });

  const note = new AMap.Marker({
    position: center,
    anchor: 'bottom-center',
    offset: new AMap.Pixel(0, -34),
    zIndex: 62,
    content: `<div class="signal-flow-note">高德POI 1.5km · ${pois.length} 个信号灯路口</div>`,
  });
  map.add(note); markers.push(note);
  startSignalFlowAnimation();
}

async function renderTwoHopSignalFlow(target){
  if(!map || !target || !demoIndex?.intersections?.has(target.id)) return;
  const seq = ++signalPoiSearchSeq;
  const center = getIntersectionPosition(target);
  try{
    const pois = await searchSignalPoiAround(center, 1500);
    if(seq !== signalPoiSearchSeq || selectedObjId !== target.id) return;
    if(!pois.length) return;
    renderSignalPoiFlow(target, pois);
  }catch(e){
    console.warn('高德POI周边信号灯搜索失败', e);
  }
}

function addObjectBase(type, obj, color, emphasized=false){
  if(type==='region' && obj.polygon){
    const poly = new AMap.Polygon({ path:obj.polygon, strokeColor:color, strokeWeight:emphasized?3:1.5, strokeOpacity:emphasized ? .9 : .55, fillColor:color, fillOpacity:emphasized ? .13 : .06, zIndex:emphasized?24:12 });
    poly.on('click',()=>selectObjFromMap('region',obj.id));
    map.add(poly); regionLayers.push(poly);
    return;
  }
  if(type==='corridor' && obj.path){
    const line = new AMap.Polyline({ path:obj.path, strokeColor:color, strokeWeight:emphasized?7:4, strokeOpacity:emphasized ? .9 : .62, strokeStyle:emphasized?'solid':'dashed', lineJoin:'round', lineCap:'round', zIndex:emphasized?26:14 });
    line.on('click',()=>selectObjFromMap('corridor',obj.id));
    map.add(line); corridorLayers.push(line);
    if(emphasized) addFlowDots(obj.path, analysisDimension==='spread'||analysisDimension==='trace');
    return;
  }
  if(type==='intersection'){
    const pos = getIntersectionPosition(obj);
    const cls = color==='#ff4757'?'danger':color==='#f5a623'?'warn':color==='#2ed573'?'success':'';
    addAnalysisNode('intersection', obj, pos, cls);
  }
}

function getRelatedCorridors(target, type){
  const ids = new Set();
  (target?.mapContext?.upstreamIds||[]).forEach(id=>{ if(id.startsWith('COR-')) ids.add(id); });
  (target?.mapContext?.downstreamIds||[]).forEach(id=>{ if(id.startsWith('COR-')) ids.add(id); });
  if(type==='region'){
    (demoData?.corridors||[]).forEach(c=>{
      const touches = (target?.mapContext?.affectedObjectIds||[]).some(id=>(c.intersectionIds||[]).includes(id));
      if(touches) ids.add(c.id);
    });
  }
  if(type==='intersection'){
    const cid = demoIndex?.corridorByIntersection?.get(target.id);
    if(cid) ids.add(cid);
  }
  if(type==='corridor') ids.add(target.id);
  return [...ids].map(id=>demoIndex?.corridors?.get(id)).filter(Boolean);
}

function getAffectedIntersections(target){
  const ids = new Set();
  (target?.mapContext?.affectedObjectIds||[]).forEach(id=>{ if(id.startsWith('INT-')) ids.add(id); });
  (target?.issues||[]).forEach(iss=>{
    const ev = iss.evidence || {};
    (ev.affectedIntersections||ev.boundaryNodes||[]).forEach(id=>ids.add(id));
    if(ev.bottleneckNode) ids.add(ev.bottleneckNode);
  });
  if(target?.intersectionIds) target.intersectionIds.forEach(id=>ids.add(id));
  return [...ids].map(id=>demoIndex?.intersections?.get(id)).filter(Boolean);
}

function renderAnalysisOverview(){
  const types = analysisObjectType==='all' ? ['region','corridor','intersection'] : [analysisObjectType];
  types.forEach(type=>{
    const list = type==='region' ? (demoData?.regions||[]) : type==='corridor' ? (demoData?.corridors||[]) : (demoData?.intersections||[]);
    list.forEach(obj=>{
      if(obj.status==='normal' && analysisDimension!=='strategy') return;
      const color = analysisDimension==='strategy' ? (obj.strategies?.length?'#2ed573':'#6b8cb0') : getIssueHotColor(obj);
      addObjectBase(type, obj, color, false);
      const pos = getObjectCenter(type,obj);
      if(pos && obj.status!=='normal'){
        const cls = color==='#ff4757'?'danger':color==='#2ed573'?'success':'';
        addAnalysisLabel(pos, obj.name, `${getTypeLabel(type)} · ${analysisDimLabel(analysisDimension)}`, cls);
      }
    });
  });
}

    const focusLayer = new AMap.Polygon({ path:target.polygon, strokeOpacity:0, fillOpacity:0 });
    map.add(focusLayer);
    try { map.setFitView([focusLayer], false, padding, 14); }
    finally { map.remove(focusLayer); }
    return;
  }
  if(type==='corridor' && target.path?.length){
    const focusLayer = new AMap.Polyline({ path:target.path, strokeOpacity:0 });
    map.add(focusLayer);
    try { map.setFitView([focusLayer], false, padding, 15); }
    finally { map.remove(focusLayer); }

  }
  const pos = getIntersectionPosition(target);
  map.setZoomAndCenter(Math.max(map.getZoom()||0, 15), pos, false, 300);

function clearSelectedHighlight(){
  if(!selectedHighlight||!map) return;
  if(Array.isArray(selectedHighlight)) map.remove(selectedHighlight);
  else map.remove(selectedHighlight);
  selectedHighlight = null;
}

function addSelectedHighlight(type, target){
  if(!map) return;
  clearSelectedHighlight();
  if(type==='region'&&target.polygon){
    const h = new AMap.Polygon({ path:target.polygon, strokeColor:'#1a7fff', strokeWeight:3, strokeOpacity:1, fillColor:'#1a7fff', fillOpacity:0.1, zIndex:25 });
    map.add(h); selectedHighlight = h;
  } else if(type==='corridor'&&target.path){
    const h = new AMap.Polyline({ path:target.path, strokeColor:'#1a7fff', strokeWeight:8, strokeOpacity:0.35, lineJoin:'round', lineCap:'round', zIndex:25 });
    map.add(h); selectedHighlight = h;
  } else if(type==='intersection'){
    const pos = getIntersectionPosition(target);
    const outer = new AMap.CircleMarker({ center:pos, radius:22, strokeColor:'#1a7fff', strokeWeight:2, strokeOpacity:0.7, fillOpacity:0, zIndex:25 });
    const inner = new AMap.CircleMarker({ center:pos, radius:12, strokeColor:'#ffffff', strokeWeight:1.5, strokeOpacity:0.4, fillColor:'#1a7fff', fillOpacity:0.15, zIndex:24 });
    map.add([outer, inner]); selectedHighlight = [outer, inner];
  }
}

function mppSeededRand(seed, min, max){
  let h = 0;
  for(const ch of String(seed||'')) h = Math.imul(31, h) + ch.charCodeAt(0) | 0;
  return min + (Math.abs(h) % (max - min + 1));
}

function makeFiveMinuteMetricSeries(target, metricKey, baseValue, mode='higherIsBusy'){
  const seed = `${target?.id||''}:${metricKey}`;
  const peakIdx = mppSeededRand(seed+'peak', 5, 8);
  const weekday = [];
  const weekend = [];
  for(let i=0;i<12;i++){
    const peak = Math.max(0, 1 - Math.abs(i - peakIdx) / 6);
    const wave = Math.sin((i + mppSeededRand(seed+'wave', 0, 4)) / 11 * Math.PI);
    const jitter = (mppSeededRand(seed+i, -5, 5) / 100);
    let weekdayFactor = 1 + peak * 0.18 + wave * 0.05 + jitter;
    let weekendFactor = 0.88 + peak * 0.10 + wave * 0.04 - jitter * 0.5;
    if(mode === 'lowerIsBusy'){
      weekdayFactor = 1 - peak * 0.16 - wave * 0.04 + jitter;
      weekendFactor = 1.08 - peak * 0.07 - wave * 0.03 - jitter * 0.3;
    }
    weekday.push(Math.max(0, +(baseValue * weekdayFactor).toFixed(1)));
    weekend.push(Math.max(0, +(baseValue * weekendFactor).toFixed(1)));
  }
  return {weekday, weekend};
}

function mppRealtimeMetricDefs(type, target){
  const sat = target.saturation||0;
  const delay = target.avgDelay||target.delay||target.profile?.state?.avgDelay;
  const speed = target.avgSpeed||target.actualSpeedKmh||target.profile?.state?.avgSpeed;
  const flow = target.flow||target.profile?.demand?.peakHourFlow||target.inFlow||mppSeededRand((target.id||'')+'flowNow', 1200, 2600);
  const imbalance = target.imbalanceIndex||target.phaseImbalanceIndex||target.profile?.state?.imbalanceIndex||Math.min(0.99, Math.max(0.12, sat * 0.78));
  const stopRate = target.stopRate!=null ? target.stopRate : 0.42;
  const nonStopRate = Math.max(0, Math.min(1, target.nonStopRate!=null ? target.nonStopRate : 1 - stopRate));
  const satColor = sat>=0.88?'var(--danger)':sat>=0.7?'var(--warn)':'var(--success)';
  const delayColor = delay&&delay>90?'var(--danger)':delay&&delay>60?'var(--warn)':'var(--text)';
  const speedColor = speed&&speed<20?'var(--danger)':speed&&speed<30?'var(--warn)':'var(--accent)';
  if(type === 'region'){
    return [
      {label:'实时饱和度', value:sat?Math.round(sat*100)+'%':'—', color:satColor},
      {label:'实时延误', value:delay?delay+'s':'—', color:delayColor},
      {label:'平均车速', value:speed?speed+' km/h':'—', color:speedColor},
    ];
  }
  if(type === 'corridor'){
    return [
      {label:'实时延误', value:delay?delay+'s':'—', color:delayColor},
      {label:'平均车速', value:speed?speed+' km/h':'—', color:speedColor},
      {label:'不停车比例', value:Math.round(nonStopRate*100)+'%', color:nonStopRate>=0.65?'var(--success)':nonStopRate>=0.45?'var(--warn)':'var(--danger)'},
    ];
  }
  return [
    {label:'实时饱和度', value:sat?Math.round(sat*100)+'%':'—', color:satColor},
    {label:'实时流量', value:flow?Number(flow).toLocaleString()+' pcu/h':'—', color:'var(--accent)'},
    {label:'失衡指数', value:imbalance?imbalance.toFixed(2):'—', color:imbalance>=0.7?'var(--danger)':imbalance>=0.45?'var(--warn)':'var(--success)'},
  ];
}

function buildMppRealtimeKpis(type, target, title='实时运行指标'){
  return `<div class="mpp-card">
    <div class="mpp-card-title">📊 ${title}</div>

      <div class="mpp-kpi">
        <div class="mpp-kpi-val" style="color:${m.color}">${m.value}</div>
        <div class="mpp-kpi-label">${m.label}</div>
      </div>`).join('')}</div>
  </div>`;
}

  const rows = [];
  if(type === 'region'){
    rows.push(['对象类型','区域']);
    rows.push(['路网密度',target.roadDensity||'—']);
    rows.push(['供需比',target.profile?.demand?.demandSupplyRatio||'—']);
    rows.push(['覆盖路口',target.intersectionCount||target.intersectionsCount||target.intersectionIds?.length||'—']);
  } else if(type === 'corridor'){
    rows.push(['对象类型','干线']);
    rows.push(['覆盖路口',(target.intersectionIds||[]).length||'—']);
    rows.push(['绿波带宽',target.bandwidth?target.bandwidth+'s':'—']);
    rows.push(['协调方向',target.direction||target.coordDirection||'双向']);
  } else {
    rows.push(['对象类型','路口']);
    rows.push(['控制类型',target.controlType||'自适应']);
    rows.push(['信号周期',target.cycle?target.cycle+'s':'—']);
    rows.push(['所属区域',target.regionName||target.regionId||'—']);
  }
  return `<div class="mpp-card">
    <div class="mpp-card-title">🏷️ 基础信息</div>
    <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:5px">

        <div style="font-size:8px;color:var(--muted);margin-bottom:2px">${k}</div>
        <div style="font-size:10px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${v}</div>
      </div>`).join('')}
    </div>
  </div>`;
}

function metricDefsForMpp(type, target){
  if(type === 'region'){
    return [
      {title:'区域平均速度', unit:'km/h', mode:'lowerIsBusy', base:target.avgSpeed||target.profile?.state?.avgSpeed||24},
      {title:'平均延误', unit:'s/veh', mode:'higherIsBusy', base:target.avgDelay||target.profile?.state?.avgDelay||70},
      {title:'拥堵延时指数', unit:'指数', mode:'higherIsBusy', base:target.congestionIndex||target.profile?.state?.congestionIndex||3.5},
    ];
  }
  if(type === 'corridor'){
    const speed = target.actualSpeedKmh||target.avgSpeed||22;
    const pathKm = Math.max(2.4, ((target.intersectionIds||[]).length || 5) * 0.75);
    const travelTime = target.travelTime || +(pathKm / Math.max(speed, 8) * 60).toFixed(1);
    const travelDelay = target.before?.delay || target.avgDelay || target.delay || 65;
    return [
      {title:'行程时间', unit:'min', mode:'higherIsBusy', base:travelTime},
      {title:'行程延误', unit:'s', mode:'higherIsBusy', base:travelDelay},
      {title:'停车次数', unit:'次/车', mode:'higherIsBusy', base:target.stopCount||Math.max(1.8, (target.stopRate||0.55)*5)},
    ];
  }
  return [
    {title:'流量', unit:'pcu/h', mode:'higherIsBusy', base:target.flow||target.profile?.demand?.peakHourFlow||target.inFlow||mppSeededRand(target.id+'flow', 1200, 2600)},
    {title:'路口饱和度', unit:'%', mode:'higherIsBusy', base:Math.round((target.saturation||0.72)*100)},
    {title:'平均延误', unit:'s/veh', mode:'higherIsBusy', base:target.avgDelay||target.delay||target.profile?.state?.avgDelay||60},
  ];
}

function renderMetricLineChart(def, target){
  const series = makeFiveMinuteMetricSeries(target, def.title, def.base, def.mode);
  const all = [...series.weekday, ...series.weekend];
  const min = Math.min(...all);
  const max = Math.max(...all);
  const pad = Math.max((max - min) * 0.16, max * 0.04, 1);
  const lo = min - pad;
  const hi = max + pad;
  const width = 288;
  const height = 66;
  const x = idx => 10 + idx * ((width - 20) / 11);
  const y = val => height - 8 - ((val - lo) / Math.max(hi - lo, 1)) * (height - 16);
  const toPath = arr => arr.map((v,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
  const lastWeekday = series.weekday[series.weekday.length - 1];
  const lastWeekend = series.weekend[series.weekend.length - 1];
  return `<div class="mpp-chart-card">
    <div class="mpp-chart-head">
      <span class="mpp-chart-title">${def.title}</span>
      <span class="mpp-chart-unit">最新 工作日 ${lastWeekday}${def.unit} · 非工作日 ${lastWeekend}${def.unit}</span>
    </div>
    <svg class="mpp-chart-svg" viewBox="0 0 ${width} ${height}" preserveAspectRatio="none" aria-label="${def.title} 5分钟曲线">
      <line class="mpp-chart-grid" x1="10" y1="12" x2="${width-10}" y2="12"></line>
      <line class="mpp-chart-grid" x1="10" y1="33" x2="${width-10}" y2="33"></line>
      <line class="mpp-chart-axis" x1="10" y1="${height-8}" x2="${width-10}" y2="${height-8}"></line>
      <path class="mpp-chart-weekday" d="${toPath(series.weekday)}"></path>
      <path class="mpp-chart-weekend" d="${toPath(series.weekend)}"></path>
      ${series.weekday.map((v,i)=>`<circle class="mpp-chart-dot-weekday" cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="1.7"></circle>`).join('')}
      ${series.weekend.map((v,i)=>`<circle class="mpp-chart-dot-weekend" cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="1.5"></circle>`).join('')}
    </svg>
    <div class="mpp-chart-labels"><span>07:30</span><span>5分钟粒度</span><span>08:25</span></div>
  </div>`;
}

    optimizing:'优化中指标 · 5分钟粒度',

function renderMppContent(type, target, tab){
  const el = document.getElementById('mppContent');
  if(!target){ el.innerHTML=''; return; }
  if(currentQueueTab === 'dynIssue'){
    el.innerHTML = buildDynamicExceptionMpp(type, target);
    return;
  }
  if(['bgIssue','optimizing','completed'].includes(currentQueueTab)){
    el.innerHTML = buildRegularMetricMpp(type, target);
    return;
  }
  if(tab===0) el.innerHTML = buildMppScene(type, target);
  else if(tab===1) el.innerHTML = buildMppDiag(type, target);
  else if(tab===2) el.innerHTML = buildMppStrategy(type, target);
  else el.innerHTML = buildMppOD(type, target);
}

function buildMppScene(type, target){
  const sat = target.saturation||target.stopRate||0;
  const speed = target.avgSpeed||'—';
  const delay = target.avgDelay||target.delay||'—';
  const metrics = [['饱和度',`${Math.round(sat*100)}%`,sat>=0.85?'var(--danger)':sat>=0.7?'var(--warn)':'var(--success)'],['速度',`${speed} km/h`,'var(--accent)'],['延误',`${delay}s`,'var(--text)']];
  return `<div class="mpp-kpi-row">${metrics.map(([l,v,c])=>`<div class="mpp-kpi"><div class="mpp-kpi-val" style="color:${c}">${v}</div><div class="mpp-kpi-label">${l}</div></div>`).join('')}</div>

  <div style="font-size:9px;color:var(--muted);line-height:1.7">${type==='corridor'?`覆盖 ${(target.intersectionIds||[]).length} 个路口，绿波带宽 ${target.bandwidth||'—'}s`:type==='region'?`路网密度 ${target.roadDensity||'—'}，供需比 ${target.profile?.demand?.demandSupplyRatio||'—'}`:` 控制类型 ${target.controlType||'自适应'}，周期 ${target.cycle||'—'}s`}</div></div>`;
}

function buildMppOD(type, target){
  const seed = target.id||'';
  function seededRand(s,min,max){ let h=0; for(let c of s) h=Math.imul(31,h)+c.charCodeAt(0)|0; return min+(Math.abs(h)%(max-min+1)); }
  const hasReal = target.inFlow&&target.outFlow;
  const inFlow = target.inFlow||seededRand(seed+'if',3000,5500);
  const outFlow = target.outFlow||seededRand(seed+'of',2800,5300);
  const diff = inFlow - outFlow;
  const diffSign = diff>0?'+':'';
  const diffColor = diff>500?'var(--danger)':diff>0?'var(--warn)':'var(--success)';
  const transit = target.transitVolume||seededRand(seed+'tv',8000,18000);
  const commuteRatio = target.profile?.demand?.commuteRatio||Math.round(seededRand(seed+'cr',40,70)/100*100)/100;
  const dsr = target.profile?.demand?.demandSupplyRatio;

  let html = '';
  // 区域进出流量（核心）
  if(type==='region'){
    html += `<div class="mpp-card">
      <div class="mpp-card-title">📊 区域进出流量分析 ${hasReal?'<span style="color:var(--success);font-size:9px">实测</span>':''}</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:7px">
        <div style="text-align:center;padding:7px;background:rgba(26,127,255,.06);border:1px solid rgba(26,127,255,.2);border-radius:7px">
          <div style="font-size:17px;font-weight:800;color:var(--accent)">${inFlow.toLocaleString()}</div>
          <div style="font-size:10px;color:var(--muted);margin-top:2px">进入流量 (辆/h)</div>
        </div>
        <div style="text-align:center;padding:7px;background:rgba(0,212,180,.06);border:1px solid rgba(0,212,180,.2);border-radius:7px">
          <div style="font-size:17px;font-weight:800;color:var(--accent2)">${outFlow.toLocaleString()}</div>
          <div style="font-size:10px;color:var(--muted);margin-top:2px">离开流量 (辆/h)</div>
        </div>
      </div>
      <div style="background:${diff>400?'rgba(255,71,87,.06)':'rgba(46,213,115,.04)'};border:1px solid ${diff>400?'rgba(255,71,87,.25)':'rgba(46,213,115,.2)'};border-radius:7px;padding:7px 9px;margin-bottom:7px">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <span style="font-size:11px;color:var(--muted)">净进出差值（正值代表净流入）</span>
          <span style="font-size:15px;font-weight:800;color:${diffColor}">${diffSign}${Math.abs(diff)} 辆/h</span>
        </div>
        ${diff>400?`<div style="font-size:10px;color:var(--danger);margin-top:4px">⚠️ 净流入持续超载，区内在途量持续积压，超出容量 ${dsr?Math.round((dsr-1)*100)+'%':'估计 18%'}</div>`:diff<-400?`<div style="font-size:10px;color:var(--success);margin-top:4px">✅ 净流出状态，区域内负荷在降低</div>`:`<div style="font-size:10px;color:var(--muted);margin-top:4px">进出基本平衡，区域负荷相对稳定</div>`}
      </div>
      <div style="display:flex;gap:6px;flex-wrap:wrap">
        <div style="flex:1;min-width:90px;background:rgba(255,255,255,.02);border:1px solid var(--border);border-radius:6px;padding:5px 8px">
          <div style="font-size:10px;color:var(--muted)">在途量</div>
          <div style="font-size:13px;font-weight:700;margin-top:2px">${transit.toLocaleString()} 辆</div>
        </div>
        <div style="flex:1;min-width:90px;background:rgba(255,255,255,.02);border:1px solid var(--border);border-radius:6px;padding:5px 8px">
          <div style="font-size:10px;color:var(--muted)">通勤占比</div>
          <div style="font-size:13px;font-weight:700;margin-top:2px">${Math.round(commuteRatio*100)}%</div>
        </div>
        ${dsr?`<div style="flex:1;min-width:90px;background:rgba(255,255,255,.02);border:1px solid var(--border);border-radius:6px;padding:5px 8px">
          <div style="font-size:10px;color:var(--muted)">供需比</div>
          <div style="font-size:13px;font-weight:700;margin-top:2px;color:${dsr>1.1?'var(--danger)':dsr>1?'var(--warn)':'var(--success)'}">${dsr}</div>
        </div>`:''}
      </div>
    </div>`;
  } else {
    // 干线/路口 OD 简化展示
    const origins = [{n:'上游主干路来流',p:seededRand(seed+'o1',30,45)},{n:'周边支路汇入',p:seededRand(seed+'o2',20,35)},{n:'跨区输入流',p:seededRand(seed+'o3',15,25)}];
    const total = origins.reduce((s,o)=>s+o.p,0);
    origins.forEach(o=>o.p=Math.round(o.p/total*100));
    html += `<div class="mpp-card"><div class="mpp-card-title">← 主要来源构成</div>
    ${origins.map(o=>`<div style="margin-bottom:6px"><div style="display:flex;justify-content:space-between;font-size:10px;margin-bottom:3px"><span style="color:var(--muted)">${o.n}</span><span style="font-weight:700;color:var(--accent)">${o.p}%</span></div><div style="height:4px;background:rgba(255,255,255,.06);border-radius:3px;overflow:hidden"><div style="height:100%;width:${o.p}%;background:var(--accent);border-radius:3px"></div></div></div>`).join('')}</div>`;
  }

  // 出行目的结构
  const tripPurpose = [['通勤',Math.round(commuteRatio*100)],['商业',seededRand(seed+'t2',15,25)],['其他',seededRand(seed+'t3',10,20)]];
  html += `<div class="mpp-card" style="margin-top:5px"><div class="mpp-card-title">出行目的结构</div>
  ${tripPurpose.map(([n,p])=>`<div style="display:flex;align-items:center;gap:6px;margin-bottom:5px"><span style="font-size:10px;color:var(--muted);width:32px">${n}</span><div style="flex:1;height:4px;background:rgba(255,255,255,.06);border-radius:3px;overflow:hidden"><div style="height:100%;width:${p}%;background:var(--accent2);border-radius:3px"></div></div><span style="font-size:10px;font-weight:700;color:var(--accent2)">${p}%</span></div>`).join('')}</div>`;
  return html;
}

function toggleDetail(btn){
  const detail = btn.nextElementSibling;
  if(!detail) return;
  detail.classList.toggle('open');
  btn.textContent = detail.classList.contains('open')?'收起▴':'展开证据▾';
}

function highlightIssueOnMap(issueId, evidence, issueName){
  if(!map) return;
  clearIssueHighlights();
  let ev = evidence;
  if(typeof ev==='string'){ try{ev=JSON.parse(ev.replace(/&quot;/g,'"'));}catch(e){ev={};} }

  const marks = [];
  const tgt = selectedObjId ? getObj(selectedObjType, selectedObjId) : mapPopupTarget;
  const getTgtPos = () => {
    if(!tgt) return null;
    if(selectedObjType==='intersection') return getIntersectionPosition(tgt);
    if(selectedObjType==='corridor' && tgt.path) return tgt.path[Math.floor(tgt.path.length/2)];
    return tgt.center || null;
  };
  const tgtPos = getTgtPos();

  // 工具函数：添加空心圆
  const addCirc = (pos, r, col, fo=0.18, so=0.9, zi=30) => {
    const m = new AMap.CircleMarker({center:pos, radius:r, strokeColor:col, strokeWeight:2.5, strokeOpacity:so, fillColor:col, fillOpacity:fo, zIndex:zi});
    map.add(m); marks.push(m);
  };
  // 工具函数：添加实心圆点
  const addDot = (pos, r, col, zi=32) => {
    const m = new AMap.CircleMarker({center:pos, radius:r, strokeColor:'#fff', strokeWeight:1.5, strokeOpacity:.7, fillColor:col, fillOpacity:1, zIndex:zi});
    map.add(m); marks.push(m);
  };
  // 工具函数：添加文字标签（above=true 显示在位置上方）
  const addTag = (pos, txt, bg, above=true) => {
    const m = new AMap.Marker({position:pos, anchor: above?'bottom-center':'top-center',
      content:`<div style="background:${bg};color:#fff;padding:3px 9px;border-radius:7px;font-size:10px;font-weight:700;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,.55)">${txt}</div>`});
    map.add(m); marks.push(m);
  };
  // 工具函数：根据路口 ID 获取坐标
  const getIP = id => { const i=demoIndex?.intersections?.get(id); return i?getIntersectionPosition(i):null; };

  const affected = ev.affectedIntersections||ev.boundaryNodes||[];
  const bottleneck = ev.bottleneckNode;

  // ====== 高饱和度 / 拥堵扩散 ======
  if(issueId.includes('saturation') || issueId.includes('congestion') || ev.congestionPhase){
    // 拥堵源头（bottleneck）— 大红圈 + 实心点
    if(bottleneck){
      const p = getIP(bottleneck);
      if(p){
        addCirc(p, 28, '#ff4757', 0.15, 1, 33);
        addDot(p, 11, '#ff4757', 34);
        addTag(p, '🚨 拥堵源头', 'rgba(255,71,87,.93)');
      }
    }
    // 受影响路口 — 渐变橙圈，由大到小（扩散衰减效果）
    affected.forEach((id, idx) => {
      const p = getIP(id);
      if(!p) return;
      const radius = Math.max(8, 20 - idx * 2);
      const opacity = Math.max(0.08, 0.28 - idx * 0.05);
      addCirc(p, radius, '#f5a623', opacity, 0.75, 31);
      addDot(p, 6, '#f5a623', 32);
    });
    // 拥堵状态标签
    if(tgtPos){
      const phase = ev.congestionPhase||'';
      const dir = ev.spreadDirection||'';
      if(phase) addTag(tgtPos, `${phase}${dir ? ' · 扩散:'+dir : ''}`, 'rgba(255,71,87,.92)');
      if(ev.saturation) addTag(tgtPos, `饱和度 ${Math.round(ev.saturation*100)}%`, 'rgba(13,25,41,.88)', false);
      if(ev.netAccumulation) addTag(tgtPos, `净积压 ${ev.netAccumulation} 辆`, 'rgba(255,71,87,.85)', false);
    }
  }

  // ====== 供需失衡 / 流量差异 ======
  else if(issueId.includes('demand_supply') || issueId.includes('flow_diff') || (ev.inFlow && ev.outFlow)){
    if(tgtPos){
      addCirc(tgtPos, 32, '#1a7fff', 0.08, 0.6, 29);
      const inF = ev.inFlow||0, outF = ev.outFlow||0, diff = inF - outF;
      if(inF && outF){
        addTag(tgtPos, `进: ${inF.toLocaleString()} 辆/h  |  出: ${outF.toLocaleString()} 辆/h`, 'rgba(26,127,255,.9)');
        if(diff > 200) addTag(tgtPos, `⚠️ 净积压 +${diff} 辆/h`, 'rgba(255,71,87,.92)', false);
      } else if(ev.demandSupplyRatio){
        addTag(tgtPos, `供需比 ${ev.demandSupplyRatio} (超载 ${Math.round((ev.demandSupplyRatio-1)*100)}%)`, 'rgba(255,71,87,.92)');
      }
    }
    // 边界流量点 — 蓝色进入标注
    affected.forEach(id => {
      const p = getIP(id);
      if(p){ addCirc(p, 14, '#1a7fff', 0.22, 0.8, 30); addTag(p, '→ 进入', 'rgba(26,127,255,.88)', false); }
    });
  }

  // ====== 排队溢流 ======
  else if(issueId.includes('queue') || issueId.includes('overflow')){
    const p = tgt ? getIntersectionPosition(tgt) : null;
    if(p){
      addCirc(p, 26, '#ff4757', 0.15, 1, 30);
      addDot(p, 9, '#ff4757', 31);
      const ql = ev.queueLength||0, sc = ev.storageCap||0;
      if(ql && sc){
        const pct = Math.round(ql/sc*100);
        addTag(p, `排队 ${ql}m / 容量 ${sc}m · 占用 ${pct}%`, pct>=90?'rgba(255,71,87,.93)':'rgba(245,166,35,.92)');
      } else if(ql){
        addTag(p, `排队长度 ${ql}m`, 'rgba(255,71,87,.92)');
      }
    }
    // 影响路口
    affected.forEach(id => {
      const p2 = getIP(id);
      if(p2){ addCirc(p2, 16, '#ff4757', 0.2, 0.8, 30); addDot(p2, 7, '#ff4757', 31); }
    });
  }

  // ====== 绿波协调 / 带宽损失 ======
  else if(issueId.includes('green_wave') || issueId.includes('bandwidth') || issueId.includes('coord')){
    // 干线路径 — 黄色高亮覆盖
    if(selectedObjType==='corridor' && tgt?.path){
      const line = new AMap.Polyline({path:tgt.path, strokeColor:'#f5a623', strokeWeight:10, strokeOpacity:0.5, lineJoin:'round', lineCap:'round', zIndex:29});
      map.add(line); marks.push(line);
      if(tgtPos){
        if(ev.bandwidthLoss) addTag(tgtPos, `绿波带宽损失 ${ev.bandwidthLoss}s`, 'rgba(245,166,35,.93)');
        else if(ev.bandwidth) addTag(tgtPos, `当前绿波带宽 ${ev.bandwidth}s`, 'rgba(245,166,35,.93)');
        if(ev.coordCycle) addTag(tgtPos, `协调周期 ${ev.coordCycle}s`, 'rgba(245,166,35,.85)', false);
      }
    }
    // 绿波断点（bottleneck）
    if(bottleneck){ const p=getIP(bottleneck); if(p){ addDot(p,10,'#f5a623',33); addTag(p,'🚦 绿波断点','rgba(245,166,35,.93)'); } }
    // 影响路口
    affected.forEach(id => { const p=getIP(id); if(p) addCirc(p, 14, '#f5a623', 0.22, 0.75, 30); });
    if(ev.peakWindow && tgtPos) addTag(tgtPos, `高峰时段 ${ev.peakWindow}`, 'rgba(245,166,35,.82)', false);
  }

  // ====== 相位失衡 ======
  else if(issueId.includes('phase_imbalance') || ev.phaseImbalanceIndex){
    const p = tgt ? getIntersectionPosition(tgt) : null;
    if(p){
      addCirc(p, 26, '#a8a0f8', 0.18, 1, 30);
      addDot(p, 9, '#a8a0f8', 31);
      if(ev.phaseImbalanceIndex) addTag(p, `相位失衡指数 ${ev.phaseImbalanceIndex}`, 'rgba(168,139,250,.93)');
      if(ev.splitDiff) addTag(p, `绿信比差值 ${ev.splitDiff}`, 'rgba(168,139,250,.85)', false);
      if(ev.delay) addTag(p, `延误 ${ev.delay}s`, 'rgba(168,139,250,.82)', false);
    }
  }

  // ====== 绿灯空放 ======
  else if(issueId.includes('green_waste') || ev.greenWasteRatio !== undefined){
    const p = tgt ? getIntersectionPosition(tgt) : null;
    if(p){
      addCirc(p, 26, '#f5a623', 0.18, 1, 30);
      addDot(p, 9, '#f5a623', 31);
      if(ev.greenWasteRatio != null) addTag(p, `绿灯空放率 ${Math.round(ev.greenWasteRatio*100)}%`, 'rgba(245,166,35,.93)');
      if(ev.stopRate) addTag(p, `停车率 ${Math.round(ev.stopRate*100)}%`, 'rgba(245,166,35,.85)', false);
    }
  }

  // ====== 低车速 / 延误偏高 ======
  else if(issueId.includes('low_speed') || issueId.includes('high_delay')){
    if(selectedObjType==='corridor' && tgt?.path){
      // 干线 — 紫色低速覆盖
      const col = issueId.includes('delay') ? '#f5a623' : '#a8a0f8';
      const line = new AMap.Polyline({path:tgt.path, strokeColor:col, strokeWeight:10, strokeOpacity:0.5, lineJoin:'round', lineCap:'round', zIndex:29});
      map.add(line); marks.push(line);
    } else if(tgtPos){
      addCirc(tgtPos, 26, '#a8a0f8', 0.18, 1, 30);
    }
    if(tgtPos){
      if(ev.avgSpeed) addTag(tgtPos, `实际 ${ev.avgSpeed} km/h${ev.designSpeed?' / 设计 '+ev.designSpeed+' km/h':''}`, 'rgba(168,139,250,.93)');
      if(ev.avgDelay||ev.delay) addTag(tgtPos, `平均延误 ${ev.avgDelay||ev.delay}s`, 'rgba(245,166,35,.9)', false);
    }
    affected.forEach(id => { const p=getIP(id); if(p) addCirc(p, 13, '#a8a0f8', 0.2, 0.75, 30); });
  }

  // ====== 静态路网问题（路网稀疏、停车缺口等）======
  else if(issueId.startsWith('static_')){
    if(tgtPos){
      addCirc(tgtPos, 28, '#1a7fff', 0.1, 0.7, 29);
      addTag(tgtPos, `📋 ${issueName||'静态路网问题'}`, 'rgba(26,127,255,.88)');
      if(ev.parkingGapRate) addTag(tgtPos, `停车缺口率 ${Math.round(ev.parkingGapRate*100)}%`, 'rgba(26,127,255,.82)', false);
      if(ev.roadDensity) addTag(tgtPos, `路网密度 ${ev.roadDensity} km/km²`, 'rgba(26,127,255,.82)', false);
    }
  }

  // ====== 默认兜底：高亮选中对象 + 显示 issue 标签 ======
  else {
    addSelectedHighlight(selectedObjType, tgt);
    if(tgtPos && issueName) addTag(tgtPos, `⚠️ ${issueName}`, 'rgba(255,71,87,.92)');
    if(tgtPos && ev.saturation) addTag(tgtPos, `饱和度 ${Math.round(ev.saturation*100)}%`, 'rgba(13,25,41,.88)', false);
  }

  issueHighlightMarkers = marks;
}

function findDemoIntersectionByAlert(alert){
  if(!demoData?.intersections) return null;
  const name = String(alert.name||'').replace(/口$/,'');
  return demoData.intersections.find(i=>{
    const n = String(i.name||'').replace(/口$/,'');
    return n === name || n.includes(name) || name.includes(n);
  }) || null;
}

function getDynamicAlertPosition(alert){
  if(alert.center && alert.center.length >= 2) return alert.center;
  const matched = findDemoIntersectionByAlert(alert);
  if(matched) return getIntersectionPosition(matched);
  return [117.02, 36.65];
}

function clearDynamicAlertOverlays(){
  if(dynamicAlertLayers.length && map){
    map.remove(dynamicAlertLayers);
  }
  dynamicAlertLayers = [];
}

function renderDynamicAlertOverlays(){
  if(!map) return;
  clearDynamicAlertOverlays();
  dynamicAlerts.forEach((alert, idx)=>{
    const pos = getDynamicAlertPosition(alert);
    const selected = reasoningState?.alertId === alert.id && !reasoningState?.cancelled;
    const deployed = !!alert._deployed;
    const color = deployed ? '#a8a0f8' : selected ? '#f5a623' : '#ff4757';
    const radius = deployed ? 55 : selected ? 110 : Math.max(64, Math.round((alert.sat||0.85) * 96));
    const circle = new AMap.Circle({
      center: pos,
      radius,
      strokeColor: color,
      strokeWeight: selected ? 3 : 2,
      strokeOpacity: deployed ? 0.45 : 0.82,
      fillColor: color,
      fillOpacity: deployed ? 0.08 : selected ? 0.18 : 0.11,
      zIndex: 44 + idx,
      cursor: 'pointer',
    });
    circle.on('click',()=>selectDynAlert(alert.id));
    map.add(circle);
    dynamicAlertLayers.push(circle);

    const marker = new AMap.Marker({
      position: pos,
      anchor: 'center',
      zIndex: 260 + idx,
      content: `<div class="dyn-alert-marker${selected?' selected':''}${deployed?' deployed':''}">
        <div class="dyn-alert-core"></div>
        <div class="dyn-alert-label">${deployed?'优化中':selected?'处理中':'新告警'} · ${alert.issueName}</div>
      </div>`,
    });
    marker.on('click',()=>selectDynAlert(alert.id));
    map.add(marker);
    dynamicAlertLayers.push(marker);
  });
}

function focusDynamicAlertOnMap(alert){
  if(!map || !alert) return;
  const pos = getDynamicAlertPosition(alert);
  try { map.resize(); } catch(e) {}
  map.setZoomAndCenter(15.2, pos, false, 300);
  requestAnimationFrame(()=>map.setCenter(pos));
}

function locateDynAlert(alertId){
  const alert = dynamicAlerts.find(a=>a.id===alertId);
  if(!alert) return;
  switchLeftTab('dynIssue');
  clearIssueHighlights();
  clearSelectedHighlight();
  focusDynamicAlertOnMap(alert);
  showDynamicAlertPopup(alert);
  updateDynamicAlertSelection(alert);
  renderDynamicReasoningFlow(alert);
  renderDynamicAlertOverlays();
}

function selectDynAlert(alertId){
  const alert = dynamicAlerts.find(a=>a.id===alertId);
  if(!alert) return;
  switchLeftTab('dynIssue');
  clearIssueHighlights();
  clearSelectedHighlight();
  focusDynamicAlertOnMap(alert);
  showDynamicAlertPopup(alert);
  updateDynamicAlertSelection(alert);
  renderDynamicReasoningFlow(alert);
  renderDynamicAlertOverlays();
}

function updateDynamicAlertSelection(alert){
  selectedObjType = 'intersection';
  selectedObjId = alert.id;
  document.getElementById('rsbRunId').textContent = 'AI智能处理 · '+alert.name;
  document.getElementById('rsbAutoStatus').textContent = '🧠 推理中';
  document.getElementById('rsbAutoStatus').className = 'rsb-status rsb-pending';
  document.getElementById('rsbPhaseRow').innerHTML = '';
}

function renderDynamicReasoningFlow(alert){
  cancelDynamicReasoning();
  const seq = ++reasoningSeq;
  reasoningState = {alertId:alert.id,seq,phase:0,timers:[],cancelled:false};
  const el = document.getElementById('rightDetail');
  const phaseNames = ['🔍 场景认知','🩺 问题诊断','📐 控制策略','📋 方案生成','🚀 方案下发'];
  el.innerHTML = `
    <div class="phase-progress" id="reasoningProgress">
      ${phaseNames.map((p,i)=>`<div class="pp-step"><div class="pp-dot${i===0?' active':''}" id="ppDot${i}">${p.split(' ')[0]}</div>${i<4?'<div class="pp-arrow" id="ppArrow'+i+'"></div>':''}</div>`).join('')}
    </div>
    <div style="padding:6px 12px;font-size:10px;color:var(--muted);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:4px">
      <span style="font-size:12px">⚡</span> 动态告警 · ${alert.name} · ${alert.issueName}
      <span style="margin-left:auto;font-size:9px;color:var(--danger);font-weight:700">饱和度 ${Math.round(alert.sat*100)}%</span>
    </div>
    <div id="reasoningContent" style="flex:1;overflow-y:auto;padding:0"></div>`;
  startReasoningPhase(alert,0,seq);
}

function updateProgressDots(currentIdx){
  for(let i=0;i<5;i++){
    const dot=document.getElementById('ppDot'+i);
    if(!dot) continue;
    dot.className = i<currentIdx?'pp-dot done':i===currentIdx?'pp-dot active':'pp-dot';
    const arrow=document.getElementById('ppArrow'+i);
    if(arrow) arrow.className = i<currentIdx?'pp-arrow done':'pp-arrow';
  }
}

function startReasoningPhase(alert,idx,seq=reasoningState?.seq){
  if(!isReasoningActiveFor(alert.id, seq)) return;
  reasoningState.phase = idx;
  updateProgressDots(idx);
  const container = document.getElementById('reasoningContent');
  if(!container) return;
  const names = ['场景认知','问题诊断','控制策略','方案生成','方案下发'];
  const icons = ['🔍','🩺','📐','📋','🚀'];
  const colors = ['var(--accent2)','var(--danger)','var(--accent)','var(--purple)','var(--success)'];
  const block = document.createElement('div');
  block.className = 'detail-block';
  block.id = 'phase_'+idx;
  block.innerHTML = `
    <div class="detail-title">
      <div class="detail-dot" style="background:${colors[idx]}"></div>${icons[idx]} ${names[idx]}
      <span class="llm-thinking-badge" id="thinkBadge${idx}">🧠 大模型推理中...</span>
    </div>
    <div class="llm-shimmer" id="thinkAnim${idx}">
      <div class="thinking-dots"><span></span><span></span><span></span></div>
      <div style="font-size:10px;color:var(--muted);text-align:center;margin-top:4px">正在调用大模型进行${names[idx]}分析...</div>
    </div>
    <div id="phaseContent${idx}" style="display:none"></div>`;
  container.appendChild(block);
  const scrollP = document.getElementById('rightScroll');
  if(scrollP) scrollP.scrollTop = scrollP.scrollHeight;
  const thinkDelay = 4200+Math.random()*2600;
  const t = setTimeout(()=>showPhaseResults(alert,idx,seq), thinkDelay);
  reasoningState.timers.push(t);
}

function showPhaseResults(alert,idx,seq=reasoningState?.seq){
  if(!isReasoningActiveFor(alert.id, seq)) return;
  const anim = document.getElementById('thinkAnim'+idx);
  if(anim) anim.style.display='none';
  const badge = document.getElementById('thinkBadge'+idx);
  if(badge){badge.textContent='✅ 推理完成';badge.style.background='rgba(46,213,115,.12)';badge.style.color='var(--success)';badge.style.animation='none';}
  const content = document.getElementById('phaseContent'+idx);
  if(!content) return;
  content.style.display='block';
  const lines = getPhaseLines(alert,idx);
  streamLines(content,lines,()=>{
    if(!isReasoningActiveFor(alert.id, seq)) return;
    if(idx===2){
      showCountdown(content,15,'⏱️ 人工干预窗口 · 策略确认',2,()=>{
        if(!isReasoningActiveFor(alert.id, seq)) return;
        startReasoningPhase(alert,3,seq);
      }, alert.id, seq);
    } else if(idx===3){
      showCountdown(content,15,'⏱️ 人工干预窗口 · 方案下发确认',3,()=>{
        if(!isReasoningActiveFor(alert.id, seq)) return;
        showAutoDeploy(alert,seq);
      }, alert.id, seq);
    } else if(idx<2){
      const t=setTimeout(()=>startReasoningPhase(alert,idx+1,seq),1300);
      reasoningState.timers.push(t);
    }
  }, alert.id, seq);
}

function getPhaseLines(alert,idx){
  if(idx===0) return [
    {type:'kv',k:'📍 分析对象',v:alert.name},
    {type:'kv',k:'⏰ 触发时间',v:alert.timestamp||new Date().toLocaleTimeString('zh-CN')},
    {type:'kv',k:'🏷️ 场景分类',v:alert.sceneType},
    {type:'kv',k:'📊 当前饱和度',v:Math.round(alert.sat*100)+'% （'+( alert.sat>=0.9?'严重超载':alert.sat>=0.8?'重度拥堵':'中度拥堵')+'）'},
    {type:'kv',k:'🚗 实时车速',v:alert.speed+' km/h'+( alert.speed<15?' ⚠️ 严重低速':'')},
    {type:'kv',k:'⏱️ 平均延误',v:alert.delay+'s'+( alert.delay>100?' ⚠️ 延误过高':'')},
    {type:'kv',k:'📌 核心指标',v:alert.keyMetric},
    {type:'kv',k:'🌐 影响范围',v:alert.range},
    {type:'conclusion',text:'💡 <strong>场景认知结论：</strong>'+alert.sceneSummary},
  ];
  if(idx===1){
    const lines = alert.diagItems.map(d=>({type:'kv',k:'⚠️ '+d.lv+' '+d.n,v:d.d}));
    lines.push({type:'conclusion',text:'🩺 <strong>诊断结论：</strong>'+alert.diagSummary});
    return lines;
  }
  if(idx===2){
    const lines = [{type:'kv',k:'🎯 推荐策略',v:alert.stratName}];
    alert.stratItems.forEach(([k,v])=>lines.push({type:'kv',k,v}));
    lines.push({type:'conclusion',text:'📐 <strong>策略结论：</strong>'+alert.stratSummary});
    return lines;
  }
  if(idx===3) return [
    {type:'kv',k:'📋 方案名称',v:alert.stratName+' 实施方案'},
    {type:'kv',k:'📝 方案详情',v:alert.plan},
    {type:'kv',k:'⏰ 生效时间',v:'确认后立即生效'},
    {type:'kv',k:'📊 闭环监控',v:'15分钟后自动效果评估'},
    {type:'kv',k:'🔄 回退机制',v:'如效果不达标自动恢复原方案'},
    {type:'conclusion',text:'📋 <strong>方案已生成：</strong>等待确认后下发执行。如无人工干预，系统将自动下发。'},
  ];
  return [];
}

function streamLines(container,lines,onComplete,alertId=reasoningState?.alertId,seq=reasoningState?.seq){
  let idx=0;
  function next(){
    if(!isReasoningActiveFor(alertId, seq)) return;
    if(idx>=lines.length){
      if(onComplete){
        const t = setTimeout(onComplete,900);
        if(isReasoningActiveFor(alertId, seq)) reasoningState.timers.push(t);
      }
      return;
    }
    const line = lines[idx];
    const el = document.createElement('div');
    el.className = line.type==='conclusion'?'llm-conclusion':'llm-stream-line';
    if(line.type==='kv') el.innerHTML = `<span class="llm-stream-key">${line.k}：</span><span class="llm-stream-val">${line.v}</span>`;
    else el.innerHTML = line.text;
    container.appendChild(el);
    const scrollP = document.getElementById('rightScroll');
    if(scrollP) scrollP.scrollTop = scrollP.scrollHeight;
    idx++;
    const t = setTimeout(next,680+Math.random()*420);
    if(isReasoningActiveFor(alertId, seq)) reasoningState.timers.push(t);
  }
  next();
}

function showCountdown(container,seconds,title,phase,onComplete,alertId=reasoningState?.alertId,seq=reasoningState?.seq){
  if(!isReasoningActiveFor(alertId, seq)) return;
  const cdId='cd_'+Date.now();
  const div=document.createElement('div');
  div.className='countdown-bar';div.id=cdId;
  div.innerHTML=`
    <div class="countdown-title">${title}</div>
    <div class="countdown-progress"><div class="countdown-fill" id="${cdId}_fill" style="width:100%"></div></div>
    <div class="countdown-seconds" id="${cdId}_sec">${seconds}</div>
    <div style="font-size:10px;color:var(--muted);text-align:center;margin-top:4px">⏳ 无人工干预将自动执行</div>
    <div class="countdown-actions">
      <button class="countdown-btn" style="background:rgba(245,166,35,.08);border-color:rgba(245,166,35,.3);color:var(--warn)" onclick="handleIntervene('${cdId}',${phase})">🔧 人工干预</button>
      <button class="countdown-btn" style="background:rgba(46,213,115,.08);border-color:rgba(46,213,115,.3);color:var(--success)" onclick="handleConfirm('${cdId}')">✅ 确认执行</button>
    </div>`;
  container.appendChild(div);
  const scrollP=document.getElementById('rightScroll');
  if(scrollP) scrollP.scrollTop=scrollP.scrollHeight;
  let remaining=seconds;
  const interval=setInterval(()=>{
    if(!isReasoningActiveFor(alertId, seq)){clearInterval(interval);return;}
    remaining--;
    const secEl=document.getElementById(cdId+'_sec');
    const fillEl=document.getElementById(cdId+'_fill');
    if(secEl) secEl.textContent=remaining;
    if(fillEl) fillEl.style.width=(remaining/seconds*100)+'%';
    if(remaining<=0){
      clearInterval(interval);
      div.innerHTML=`<div style="text-align:center;padding:8px;font-size:11px;color:var(--success);font-weight:700">✅ 无人工干预，系统自动执行</div>`;
      const t = setTimeout(onComplete,800);
      if(isReasoningActiveFor(alertId, seq)) reasoningState.timers.push(t);
    }
  },1000);
  reasoningState._interval=interval;
  reasoningState._cdCallback=onComplete;
  reasoningState._cdId=cdId;
}

function handleIntervene(cdId, phase){
  if(reasoningState){
    if(reasoningState._interval) clearInterval(reasoningState._interval);
    reasoningState.cancelled = true;
    reasoningState.timers.forEach(t=>clearTimeout(t));
    reasoningState._intervenePhase = phase;
  }
  const alertId = reasoningState?.alertId || '';
  const alert = dynamicAlerts.find(a=>a.id===alertId);
  const el = document.getElementById(cdId);

  document.getElementById('rsbAutoStatus').textContent = '人工接管';
  document.getElementById('rsbAutoStatus').className = 'rsb-status rsb-takeover';

  if(!el || !alert){ showToast('🔧 人工干预已激活，自动执行已暂停','warn'); return; }

  if(phase === 2){
    const itemsHtml = alert.stratItems.map((item,i)=>`
      <div class="intervene-field">
        <label class="intervene-label">${item[0]}</label>
        <input class="intervene-input" id="stratField_${i}" value="${item[1].replace(/"/g,'&quot;')}" />
      </div>`).join('');
    el.innerHTML = `<div class="intervene-editor">
      <div class="intervene-header">🔧 人工干预 · 控制策略调整</div>
      <div class="intervene-desc">请修改以下策略参数，确认后将进入方案生成阶段</div>
      <div class="intervene-field">
        <label class="intervene-label">🎯 推荐策略名称</label>
        <input class="intervene-input" id="stratNameField" value="${alert.stratName.replace(/"/g,'&quot;')}" />
      </div>
      ${itemsHtml}
      <div class="intervene-actions">
        <button class="intervene-btn intervene-btn-primary" onclick="submitStrategyEdit('${cdId}')">✅ 确认策略，进入方案生成</button>
        <button class="intervene-btn intervene-btn-cancel" onclick="cancelIntervene('${cdId}')">❌ 放弃修改</button>
      </div>
    </div>`;
  } else if(phase === 3){
    el.innerHTML = `<div class="intervene-editor">
      <div class="intervene-header">🔧 人工干预 · 方案调整</div>
      <div class="intervene-desc">请修改以下方案内容，确认后将立即下发执行</div>
      <div class="intervene-field">
        <label class="intervene-label">📋 方案名称</label>
        <input class="intervene-input" id="planNameField" value="${(alert.stratName+' 实施方案').replace(/"/g,'&quot;')}" />
      </div>
      <div class="intervene-field">
        <label class="intervene-label">📝 方案详情</label>
        <textarea class="intervene-textarea" id="planDetailField" rows="4">${alert.plan}</textarea>
      </div>
      <div class="intervene-field">
        <label class="intervene-label">⏰ 生效时间</label>
        <input class="intervene-input" id="planTimeField" value="确认后立即生效" />
      </div>
      <div class="intervene-field">
        <label class="intervene-label">📊 闭环监控周期</label>
        <input class="intervene-input" id="planMonitorField" value="15分钟后自动效果评估" />
      </div>
      <div class="intervene-actions">
        <button class="intervene-btn intervene-btn-primary" onclick="submitPlanEdit('${cdId}')">🚀 确认并下发方案</button>
        <button class="intervene-btn intervene-btn-cancel" onclick="cancelIntervene('${cdId}')">❌ 放弃修改</button>
      </div>
    </div>`;
  }
  showToast('🔧 人工干预已激活，请直接修改策略/方案','warn');
  const scrollP = document.getElementById('rightScroll');
  if(scrollP) scrollP.scrollTop = scrollP.scrollHeight;
}

function submitStrategyEdit(cdId){
  const alertId = reasoningState?.alertId || '';
  const alert = dynamicAlerts.find(a=>a.id===alertId);
  if(!alert) return;
  const newName = document.getElementById('stratNameField')?.value;
  if(newName) alert.stratName = newName;
  alert.stratItems = alert.stratItems.map((item,i)=>{
    const inp = document.getElementById('stratField_'+i);
    return inp ? [item[0], inp.value] : item;
  });
  const el = document.getElementById(cdId);
  if(el) el.innerHTML = `<div style="text-align:center;padding:8px;font-size:11px;color:var(--success);font-weight:700">✅ 策略已修改，进入方案生成...</div>`;
  reasoningState.cancelled = false;
  showToast('✅ 策略修改已应用，继续推理','success');
  const seq = reasoningState?.seq;
  const t = setTimeout(()=>startReasoningPhase(alert,3,seq), 800);
  reasoningState.timers.push(t);
}

function submitPlanEdit(cdId){
  const alertId = reasoningState?.alertId || '';
  const alert = dynamicAlerts.find(a=>a.id===alertId);
  if(!alert) return;
  const planDetail = document.getElementById('planDetailField')?.value;
  if(planDetail) alert.plan = planDetail;
  const el = document.getElementById(cdId);
  if(el) el.innerHTML = `<div style="text-align:center;padding:8px;font-size:11px;color:var(--success);font-weight:700">✅ 方案已确认，即将下发...</div>`;
  showToast('✅ 方案已确认，即将下发执行','success');
  reasoningState.cancelled = false;
  const seq = reasoningState?.seq;
  const t = setTimeout(()=>showAutoDeploy(alert,seq), 800);
  reasoningState.timers.push(t);
}

function cancelIntervene(cdId){
  const el = document.getElementById(cdId);
  if(el) el.innerHTML = `<div style="text-align:center;padding:12px;font-size:11px;color:var(--muted);line-height:1.8">已放弃修改，流程暂停。<br><span style="color:var(--warn);font-weight:700">⚠️ 自动执行已取消</span></div>`;
  showToast('已放弃修改，自动执行取消','warn');
}

function handleConfirm(cdId){
  if(reasoningState?._interval) clearInterval(reasoningState._interval);
  const el=document.getElementById(cdId);
  if(el) el.innerHTML=`<div style="text-align:center;padding:8px;font-size:11px;color:var(--success);font-weight:700">✅ 已人工确认，立即执行</div>`;
  if(reasoningState?._cdCallback) setTimeout(reasoningState._cdCallback,500);
  showToast('✅ 已确认执行','success');
}

function showAutoDeploy(alert,seq=reasoningState?.seq){
  if(!isReasoningActiveFor(alert.id, seq)) return;
  reasoningState.phase=4;
  updateProgressDots(5);
  document.getElementById('rsbAutoStatus').textContent='已下发';
  document.getElementById('rsbAutoStatus').className='rsb-status rsb-auto';
  document.getElementById('rsbRunId').textContent = '已完成 · '+alert.name;
  const container=document.getElementById('reasoningContent');
  const div=document.createElement('div');
  div.className='detail-block auto-deploy-block';
  div.innerHTML=`
    <div style="font-size:44px;margin-bottom:10px">🚀</div>
    <div style="font-size:17px;font-weight:800;color:var(--success);margin-bottom:8px">方案已自动下发</div>
    <div style="font-size:13px;color:var(--text);font-weight:700;margin-bottom:8px">${alert.name} · ${alert.stratName}</div>
    <div style="font-size:11px;color:var(--muted);line-height:1.8;max-width:320px;margin:0 auto;text-align:left;padding:10px 14px;background:rgba(46,213,115,.04);border:1px solid rgba(46,213,115,.15);border-radius:8px">
      ${alert.plan}<br><br>
      <span style="color:var(--accent)">📊 智能体将持续监控优化效果</span><br>
      <span style="color:var(--accent2)">⏰ 15分钟后自动进行效果评估</span><br>
      <span style="color:var(--purple)">🔄 效果不达标将自动回退并重新优化</span>
    </div>`;
  container.appendChild(div);
  const scrollP=document.getElementById('rightScroll');
  if(scrollP) scrollP.scrollTop=scrollP.scrollHeight;
  showToast('🚀 '+alert.name+' 方案已自动下发执行','success');
  setTimeout(()=>{
    if(!isReasoningActiveFor(alert.id, seq)) return;
    const idx=dynamicAlerts.findIndex(a=>a.id===alert.id);
    if(idx>=0) dynamicAlerts[idx]._deployed=true;
    renderAgentQueue();
    renderDynamicAlertOverlays();
  },2000);
}

function showAlertNotification(alert){
  const container=document.getElementById('alertNotification');
  if(!container) return;
  const el=document.createElement('div');
  el.className='alert-pop';
  el.innerHTML=`<span style="font-size:14px">⚡</span> 新动态告警：${alert.name} · ${alert.issueName} <span style="font-size:10px;opacity:.8;margin-left:4px">点击处理</span>`;
  el.onclick=()=>{selectDynAlert(alert.id);el.remove();};
  container.appendChild(el);
  setTimeout(()=>{if(el.parentNode){el.style.opacity='0';el.style.transition='opacity .5s';setTimeout(()=>el.remove(),500);}},10000);
  const tab=document.querySelector('[data-tab="dynIssue"]');
  if(tab){tab.classList.add('tab-pulse');setTimeout(()=>tab.classList.remove('tab-pulse'),2500);}
}

function addNewDynamicAlert(){
  if(dynamicAlertIdx>=DYN_ALERT_TEMPLATES.length) return;
  const tpl=DYN_ALERT_TEMPLATES[dynamicAlertIdx];
  const alert={...tpl,id:'dyn_'+Date.now(),timestamp:new Date().toLocaleTimeString('zh-CN'),_isNew:true};
  dynamicAlerts.unshift(alert);
  dynamicAlertIdx++;
  renderAgentQueue();
  renderDynamicAlertOverlays();
  showAlertNotification(alert);
  showToast('⚡ 新动态告警：'+alert.name+' · '+alert.issueName,'warn');
  setTimeout(()=>{alert._isNew=false;renderAgentQueue();},3000);
}

function initDynamicAlerts(){
  const initialCount = Math.min(4, DYN_ALERT_TEMPLATES.length);
  for(let i=0;i<initialCount;i++){
    const tpl=DYN_ALERT_TEMPLATES[i];
    const mins = (initialCount-i)*3;
    const t=new Date(Date.now()-mins*60000);
    dynamicAlerts.push({...tpl,id:'dyn_init_'+i,timestamp:t.toLocaleTimeString('zh-CN'),_isNew:false});
    dynamicAlertIdx++;
  }
  renderAgentQueue();
  renderDynamicAlertOverlays();
  dynamicAlertTimer=setInterval(addNewDynamicAlert,60000);
}

// ===== BOOT =====
async function boot(){
  try{
    await loadFrontendConfig();
    await loadAmapScript(mapConfig.amapJsApiKey);
    initMap();
    await loadData();
    // 启动调度器
    try{ await fetch(`${API}/v1/demo/scheduler/start`, {method:'POST'}); }catch(e){}
    // 轮询 Run 状态（每 5 秒）
    await pollRuns();
    pollInterval = setInterval(pollRuns, 5000);
    initDynamicAlerts();
    if(!mapConfig.amapSecurityJsCode) console.warn('高德底图可能为空白：未配置 AMAP_SECURITY_JS_CODE');
  }catch(e){
    document.getElementById('map').innerHTML = `<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#ffb4bd;background:#0d1929;font-size:13px;">地图初始化失败：${e.message}</div>`;
  }
}

boot();
</script>
