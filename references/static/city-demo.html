<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>城市级信控智能体 · 济南市全自动驾驶舱</title>
<link rel="stylesheet" href="/debug/assets/debug-shell.css"/>
<script defer src="/debug/assets/debug-ui.js"></script>
<style>
:root{
  --bg:#070e1a;--surface:#0d1929;--surface2:#111f33;--surface3:#162436;
  --border:#1e3152;--border2:#25406a;
  --accent:#1a7fff;--accent2:#00d4b4;--warn:#f5a623;--danger:#ff4757;
  --success:#2ed573;--purple:#a8a0f8;
  --text:#e8f0ff;--muted:#6b8cb0;--muted2:#4a6688;--r:8px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:"PingFang SC",-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;height:100vh;overflow:hidden;display:flex;flex-direction:column;}

/* ===== TOP NAV ===== */
.topnav{display:flex;align-items:center;gap:12px;padding:0 16px;height:48px;background:linear-gradient(90deg,#040c1a,#0a1628);border-bottom:1px solid var(--border);flex-shrink:0;}
.logo{display:flex;align-items:center;gap:8px;}
.logo-icon{width:28px;height:28px;background:linear-gradient(135deg,#1a7fff,#00d4b4);border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:14px;}
.logo-text{font-size:14px;font-weight:700;background:linear-gradient(90deg,#6eb8ff,#00d4b4);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.logo-sub{font-size:10px;color:var(--muted);margin-top:1px;}
.nav-links{display:flex;gap:2px;margin-left:16px;}
.nav-link{padding:4px 10px;border-radius:5px;font-size:11px;font-weight:500;color:var(--muted);cursor:pointer;text-decoration:none;border:1px solid transparent;transition:all .2s;}
.nav-link:hover{color:var(--text);border-color:var(--border);}
.nav-link.active{background:rgba(26,127,255,.15);color:var(--accent);border-color:rgba(26,127,255,.35);}
.topnav-right{margin-left:auto;display:flex;align-items:center;gap:8px;}
.badge-pill{padding:3px 10px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;transition:all .15s;}
.badge-pill:hover{filter:brightness(1.2);}
.badge-danger{background:rgba(255,71,87,.15);color:var(--danger);border:1px solid rgba(255,71,87,.3);}
.badge-warn{background:rgba(245,166,35,.12);color:var(--warn);border:1px solid rgba(245,166,35,.3);}
.badge-success{background:rgba(46,213,115,.12);color:var(--success);border:1px solid rgba(46,213,115,.3);}
.badge-blue{background:rgba(26,127,255,.12);color:var(--accent);border:1px solid rgba(26,127,255,.3);}
.clock{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;}

/* ===== BADGE DRAWER ===== */
.badge-drawer-overlay{position:fixed;inset:0;z-index:2000;background:rgba(0,0,0,.45);backdrop-filter:blur(4px);display:none;}
.badge-drawer-overlay.open{display:block;}
.badge-drawer{position:fixed;top:0;right:0;bottom:0;width:480px;z-index:2100;background:var(--surface);border-left:1px solid var(--border);display:flex;flex-direction:column;box-shadow:-12px 0 48px rgba(0,20,80,.5);transform:translateX(100%);transition:transform .25s cubic-bezier(.4,0,.2,1);}
.badge-drawer.open{transform:translateX(0);}
.drawer-header{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;flex-shrink:0;}
.drawer-title{font-size:15px;font-weight:700;flex:1;}
.drawer-close{width:28px;height:28px;border-radius:7px;border:1px solid var(--border);background:rgba(255,255,255,.04);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--muted);transition:all .15s;}
.drawer-close:hover{border-color:var(--danger);color:var(--danger);}
.drawer-body{flex:1;overflow-y:auto;padding:12px 16px;display:flex;flex-direction:column;gap:8px;}
.drawer-body::-webkit-scrollbar{width:3px;}
.drawer-body::-webkit-scrollbar-thumb{background:var(--border2);}
.drawer-item{background:var(--surface2);border:1px solid var(--border);border-radius:9px;padding:11px 13px;cursor:pointer;transition:all .15s;}
.drawer-item:hover{border-color:var(--accent);background:rgba(26,127,255,.04);}
.drawer-item-head{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
.drawer-item-icon{font-size:15px;flex-shrink:0;}
.drawer-item-name{font-size:13px;font-weight:700;flex:1;}
.drawer-item-badge{font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px;}
.drawer-item-desc{font-size:11px;color:var(--muted);line-height:1.6;margin-bottom:7px;}
.drawer-item-metrics{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:7px;}
.drawer-metric{background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:6px;padding:4px 9px;font-size:11px;}
.drawer-metric-label{color:var(--muted);}
.drawer-metric-val{font-weight:700;margin-left:4px;}
.drawer-item-actions{display:flex;gap:6px;padding-top:7px;border-top:1px solid var(--border);}
.drawer-action{flex:1;padding:6px 8px;border-radius:6px;border:1px solid var(--border);background:rgba(255,255,255,.03);color:var(--text);font-size:11px;font-weight:600;cursor:pointer;text-align:center;text-decoration:none;transition:all .15s;}
.drawer-action:hover{border-color:var(--accent);color:var(--accent);}
.drawer-action.primary{background:rgba(26,127,255,.12);border-color:rgba(26,127,255,.35);color:var(--accent);}
.drawer-action.warn{background:rgba(245,166,35,.08);border-color:rgba(245,166,35,.3);color:var(--warn);}
.drawer-action.danger{background:rgba(255,71,87,.08);border-color:rgba(255,71,87,.25);color:var(--danger);}
.drawer-action.success{background:rgba(46,213,115,.08);border-color:rgba(46,213,115,.25);color:var(--success);}
.drawer-filter{display:flex;gap:6px;padding:8px 0 4px;}
.drawer-filter-btn{padding:4px 10px;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--muted);font-size:11px;font-weight:600;cursor:pointer;transition:all .15s;}
.drawer-filter-btn.active{background:rgba(26,127,255,.1);border-color:rgba(26,127,255,.35);color:var(--accent);}
.drawer-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:48px 24px;color:var(--muted);text-align:center;}
.drawer-empty-icon{font-size:36px;margin-bottom:10px;opacity:.5;}
.drawer-count-bar{display:flex;align-items:center;justify-content:space-between;padding:6px 0 10px;border-bottom:1px solid var(--border);margin-bottom:4px;}
.drawer-count-text{font-size:12px;color:var(--muted);}
.drawer-count-num{font-size:14px;font-weight:700;}
.scheduler-dot{width:7px;height:7px;border-radius:50%;background:var(--success);box-shadow:0 0 6px rgba(46,213,115,.5);}
.scheduler-dot.paused{background:var(--muted);box-shadow:none;}

/* ===== MAIN 3-COLUMN ===== */
.main{display:flex;flex:1;min-height:0;overflow:hidden;}

/* ===== LEFT PANEL ===== */
.left-panel{width:380px;min-height:0;flex-shrink:0;display:flex;flex-direction:column;overflow:hidden;background:var(--surface);border-right:1px solid var(--border);}
.panel-header{padding:9px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:6px;flex-shrink:0;}
.panel-header-title{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;}
.panel-scroll{flex:1;min-height:0;overflow-y:scroll;display:flex;flex-direction:column;gap:0;scrollbar-gutter:stable;}
.panel-scroll::-webkit-scrollbar{width:6px;}
.panel-scroll::-webkit-scrollbar-track{background:rgba(255,255,255,.025);}
.panel-scroll::-webkit-scrollbar-thumb{background:var(--border2);border-radius:999px;}

/* 智能体监控 KPI 面板 */
.monitor-scope{padding:10px 12px 8px;border-bottom:1px solid var(--border);}
.scope-title{font-size:10px;font-weight:700;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-bottom:8px;}
.scope-nums{display:flex;align-items:center;}
.scope-item{flex:1;text-align:center;}
.scope-val{font-size:21px;font-weight:800;color:var(--accent);line-height:1;}
.scope-lbl{font-size:10px;color:var(--muted);margin-top:3px;}
.scope-sep{width:1px;height:34px;background:var(--border);flex-shrink:0;}
.issue-kpi-row{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:8px 12px;border-bottom:1px solid var(--border);}
.issue-kpi{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:8px 10px;}
.issue-kpi-num{font-size:22px;font-weight:800;line-height:1;}
.issue-kpi-lbl{font-size:10px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ikpi-static .issue-kpi-num{color:var(--warn);}
.ikpi-dynamic .issue-kpi-num{color:var(--danger);}
.ikpi-running .issue-kpi-num{color:var(--purple);}
.ikpi-done .issue-kpi-num{color:var(--success);}
.effect-strip{display:flex;align-items:center;padding:7px 12px;border-bottom:1px solid var(--border);background:rgba(46,213,115,.04);}
.eff-chip{flex:1;text-align:center;font-size:11px;color:var(--muted);}
.eff-chip strong{color:var(--text);font-weight:700;}
.eff-sep{width:1px;height:20px;background:var(--border);flex-shrink:0;}
/* toast 通知 */
.toast-container{position:fixed;top:62px;left:50%;transform:translateX(-50%);z-index:9999;display:flex;flex-direction:column;gap:6px;pointer-events:none;}
.toast{padding:8px 18px;border-radius:8px;font-size:13px;font-weight:600;box-shadow:0 4px 16px rgba(0,0,0,.18);opacity:0;transform:translateY(-8px);transition:all .25s;pointer-events:none;white-space:nowrap;}
.toast.show{opacity:1;transform:translateY(0);}
.toast-success{background:#1da462;color:#fff;}
.toast-warn{background:#e68a00;color:#fff;}
.toast-info{background:#1a7fff;color:#fff;}
/* scope 优化数量子标签 */
.scope-opt{font-size:10px;font-weight:700;margin-top:3px;}
.scope-opt.has-opt{color:var(--purple);}
.scope-opt.no-opt{color:var(--muted);}
/* 审批确认弹窗 */
.modal-overlay{position:fixed;inset:0;background:rgba(5,20,50,.58);z-index:2000;display:none;align-items:center;justify-content:center;}
.approval-modal{background:#fff;border-radius:14px;width:540px;max-width:96vw;max-height:88vh;display:flex;flex-direction:column;box-shadow:0 12px 48px rgba(0,0,0,.28);animation:modalIn .22s ease;}
@keyframes modalIn{from{opacity:0;transform:scale(.95) translateY(10px)}to{opacity:1;transform:scale(1) translateY(0)}}
.approval-header{padding:16px 20px 13px;border-bottom:1px solid var(--border);display:flex;align-items:center;flex-shrink:0;}
.approval-title{font-size:15px;font-weight:700;flex:1;color:var(--text);}
.approval-close{border:none;background:none;font-size:20px;cursor:pointer;color:var(--muted);line-height:1;padding:0 4px;border-radius:4px;}
.approval-close:hover{background:var(--surface2);}
.approval-body{flex:1;overflow-y:auto;padding:16px 20px;}
.approval-body::-webkit-scrollbar{width:4px;}
.approval-body::-webkit-scrollbar-thumb{background:var(--border);}
.approval-footer{padding:13px 20px;border-top:1px solid var(--border);flex-shrink:0;}
.approval-notes-label{font-size:11px;font-weight:700;color:var(--muted);margin-bottom:5px;}
.approval-notes{width:100%;border:1px solid var(--border);border-radius:7px;padding:8px 10px;font-size:12px;color:var(--text);resize:none;outline:none;font-family:inherit;background:var(--surface2);}
.approval-notes:focus{border-color:var(--accent);}
.approval-actions{display:flex;gap:8px;margin-top:10px;}
.approval-btn{flex:1;padding:9px 12px;border-radius:8px;border:1px solid;font-size:12px;font-weight:700;cursor:pointer;transition:all .15s;}
.apv-approve{background:rgba(29,164,98,.08);border-color:rgba(29,164,98,.3);color:var(--success);}
.apv-approve:hover{background:var(--success);color:#fff;}
.apv-reject{background:rgba(229,57,53,.06);border-color:rgba(229,57,53,.2);color:var(--danger);}
.apv-reject:hover{background:var(--danger);color:#fff;}
.apv-takeover{background:rgba(230,138,0,.06);border-color:rgba(230,138,0,.2);color:var(--warn);}
.apv-cancel{background:var(--surface2);border-color:var(--border);color:var(--muted);}
/* approval body components */
.apv-target{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--surface2);border-radius:8px;margin-bottom:10px;border:1px solid var(--border);}
.apv-type-tag{padding:3px 8px;border-radius:6px;font-size:11px;font-weight:700;}
.apv-risk-badge{margin-left:auto;font-size:11px;font-weight:700;padding:3px 9px;border-radius:6px;border:1px solid;}
.apv-reason{padding:8px 11px;border-radius:7px;margin-bottom:10px;border:1px solid;}
.apv-section{margin-bottom:12px;}
.apv-section-title{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px;}
.apv-metric-row{display:flex;gap:8px;margin-bottom:8px;}
.apv-metric{flex:1;background:var(--surface2);border:1px solid var(--border);border-radius:7px;padding:8px;text-align:center;}
.apv-metric-val{font-size:16px;font-weight:800;line-height:1;}
.apv-metric-lbl{font-size:10px;color:var(--muted);margin-top:3px;}
.apv-issue-row{display:flex;align-items:center;gap:6px;padding:5px 8px;border-radius:6px;background:var(--surface2);margin-bottom:3px;}
.apv-strat-row{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:7px;border:1px solid var(--border);margin-bottom:4px;background:var(--surface2);}
.apv-effect-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
.apv-effect-item{background:rgba(29,164,98,.04);border:1px solid rgba(29,164,98,.15);border-radius:7px;padding:7px 10px;}
.apv-effect-val{font-size:15px;font-weight:800;color:var(--success);}
.apv-effect-lbl{font-size:10px;color:var(--muted);margin-top:2px;}
/* 队列项类型标签 */
.q-type-tag{display:inline-block;font-size:9px;font-weight:700;padding:1px 5px;border-radius:4px;margin-right:3px;vertical-align:middle;line-height:1.4;}
.q-type-region{background:rgba(26,127,255,.12);color:var(--accent);}
.q-type-corridor{background:rgba(0,181,163,.12);color:var(--accent2);}
.q-type-intersection{background:rgba(108,58,203,.1);color:var(--purple);}
/* 已完成列表评价摘要 */
.completed-eval{margin-top:4px;padding:4px 7px;border-radius:5px;background:rgba(46,213,115,.05);border:1px solid rgba(46,213,115,.15);display:flex;align-items:center;gap:5px;}
.completed-score{font-size:11px;font-weight:800;padding:1px 6px;border-radius:4px;}
.completed-score.meets{background:rgba(29,164,98,.12);color:var(--success);}
.completed-score.fails{background:rgba(229,57,53,.1);color:var(--danger);}
.completed-conclusion{font-size:9px;color:var(--muted);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
/* 兼容旧 kpi-grid（留空，避免 JS 用到） */
.kpi-grid{border-bottom:1px solid var(--border);}
.kpi-card,.kpi-val,.kpi-label,.kpi-danger,.kpi-warn,.kpi-ok,.kpi-info,.kpi-purple{}

/* 智能体运行效果统计 */
.agent-stat-block{padding:10px 12px;border-bottom:1px solid var(--border);}
.astat-head{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:7px;}
.astat-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:5px;}
.astat-label{font-size:12px;color:var(--muted);}
.astat-val{font-size:13px;font-weight:700;}
.astat-bar{height:3px;border-radius:2px;background:var(--border);overflow:hidden;margin-top:3px;}
.astat-fill{height:100%;border-radius:2px;}

/* 队列 Tab */
.queue-tabs{display:flex;flex-shrink:0;border-bottom:1px solid var(--border);background:var(--surface2);}
.queue-tab{flex:1;padding:7px 3px;text-align:center;font-size:9px;font-weight:700;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;transition:all .15s;user-select:none;display:flex;align-items:center;justify-content:center;gap:2px;white-space:nowrap;}
.queue-tab.active{color:var(--accent);border-bottom-color:var(--accent);background:rgba(26,127,255,.06);}
.queue-tab:hover:not(.active){color:var(--text);background:rgba(255,255,255,.02);}
.queue-tab-cnt{padding:1px 5px;border-radius:8px;font-size:9px;font-weight:800;}
.queue-tab-content{display:flex;flex-direction:column;}

/* 运行队列 */
.queue-section{display:flex;flex-direction:column;}
.queue-group{border-bottom:1px solid var(--border);}
.queue-group-header{display:flex;align-items:center;gap:7px;padding:9px 12px;cursor:pointer;user-select:none;transition:background .15s;}
.queue-group-header:hover{background:rgba(255,255,255,.03);}
.queue-group-icon{font-size:14px;flex-shrink:0;}
.queue-group-title{font-size:12px;font-weight:700;flex:1;}
.queue-group-count{font-size:10px;font-weight:700;padding:2px 7px;border-radius:20px;background:rgba(26,127,255,.12);color:var(--accent);}
.queue-group-toggle{font-size:10px;color:var(--muted);transition:transform .2s;}
.queue-group-toggle.collapsed{transform:rotate(-90deg);}
.queue-group-body{display:flex;flex-direction:column;}
.queue-group-body.collapsed{display:none;}
.queue-sub-label{font-size:10px;font-weight:700;color:var(--muted2);letter-spacing:.05em;padding:5px 12px 3px;text-transform:uppercase;}
.queue-item{display:flex;align-items:center;gap:8px;padding:6px 12px;cursor:pointer;border-left:2px solid transparent;transition:all .15s;}
.queue-item:hover{background:rgba(255,255,255,.03);border-left-color:var(--accent);}
.queue-item.selected{background:rgba(26,127,255,.06);border-left-color:var(--accent);}
.queue-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.q-dot-critical{background:var(--danger);box-shadow:0 0 5px rgba(255,71,87,.5);}
.q-dot-warning{background:var(--warn);box-shadow:0 0 5px rgba(245,166,35,.4);}
.q-dot-running{background:var(--purple);box-shadow:0 0 5px rgba(168,139,250,.5);}
.q-dot-ok{background:var(--success);box-shadow:0 0 4px rgba(46,213,115,.4);}
.queue-item-info{flex:1;min-width:0;}
.queue-item-name{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.queue-item-desc{font-size:10px;color:var(--muted);margin-top:2px;}
.queue-item-badge{font-size:9px;font-weight:700;padding:2px 6px;border-radius:8px;flex-shrink:0;white-space:nowrap;}
.qb-pending{background:rgba(245,166,35,.12);color:var(--warn);border:1px solid rgba(245,166,35,.25);}
.qb-running{background:rgba(168,139,250,.12);color:var(--purple);border:1px solid rgba(168,139,250,.25);}
.qb-done{background:rgba(46,213,115,.1);color:var(--success);border:1px solid rgba(46,213,115,.2);}
.qb-critical{background:rgba(255,71,87,.12);color:var(--danger);border:1px solid rgba(255,71,87,.25);}

/* 历史榜单 */
.rank-item{display:flex;align-items:flex-start;gap:7px;padding:6px 10px;background:var(--surface2);border-radius:7px;border:1px solid var(--border);cursor:pointer;margin-bottom:4px;transition:all .15s;}
.rank-item:hover{border-color:var(--accent);}
.rank-item.selected{border-color:var(--accent);background:rgba(26,127,255,.07);}
.rank-sev{width:26px;height:26px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;flex-shrink:0;}
.sev-critical{background:rgba(255,71,87,.15);color:var(--danger);}
.sev-warning{background:rgba(245,166,35,.12);color:var(--warn);}
.sev-ok{background:rgba(46,213,115,.12);color:var(--success);}
.sev-info{background:rgba(26,127,255,.12);color:var(--accent);}
.rank-info{flex:1;min-width:0;}
.rank-name{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.rank-desc{font-size:11px;color:var(--muted);margin-top:2px;}
.rank-badge{font-size:10px;padding:2px 6px;border-radius:8px;font-weight:600;flex-shrink:0;margin-top:1px;}
.tag-region{background:rgba(26,127,255,.1);color:var(--accent);}
.tag-corridor{background:rgba(0,212,180,.1);color:var(--accent2);}
.tag-intersection{background:rgba(168,139,250,.1);color:var(--purple);}

/* ===== MAP CENTER ===== */
.map-area{flex:1;min-width:0;min-height:0;position:relative;overflow:hidden;}
#map{width:100%;height:100%;}

.analysis-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:7px;}
.analysis-title{font-size:11px;font-weight:800;color:var(--text);}
.analysis-target{font-size:9px;color:var(--muted);max-width:170px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:right;}
.analysis-node{position:relative;width:16px;height:16px;border-radius:50%;background:var(--accent);border:2px solid rgba(255,255,255,.84);box-shadow:0 0 14px rgba(26,127,255,.75),0 0 36px rgba(26,127,255,.24);cursor:pointer;}
.analysis-node.warn{background:var(--warn);box-shadow:0 0 16px rgba(245,166,35,.78),0 0 36px rgba(245,166,35,.24);}
.analysis-node.danger{background:var(--danger);box-shadow:0 0 18px rgba(255,71,87,.88),0 0 42px rgba(255,71,87,.3);}
.analysis-node.success{background:var(--success);box-shadow:0 0 16px rgba(46,213,115,.76),0 0 38px rgba(46,213,115,.2);}
.analysis-node::after{content:"";position:absolute;inset:-9px;border-radius:50%;border:1px solid currentColor;color:inherit;animation:analysisRipple 2.2s ease-out infinite;}
.analysis-node.danger::after{color:rgba(255,71,87,.78);}
.analysis-node.warn::after{color:rgba(245,166,35,.72);}
.analysis-node.success::after{color:rgba(46,213,115,.68);}
.analysis-flow-dot{width:9px;height:9px;border-radius:50%;background:var(--accent2);border:1px solid rgba(255,255,255,.8);box-shadow:0 0 10px rgba(0,212,180,.85);animation:flowDot 1.8s ease-in-out infinite;}
.analysis-flow-dot.hot{background:var(--danger);box-shadow:0 0 12px rgba(255,71,87,.9);}
.signal-flow-particle{width:8px;height:8px;border-radius:50%;background:#00d4b4;border:1px solid rgba(255,255,255,.9);box-shadow:0 0 12px rgba(0,212,180,.95),0 0 26px rgba(26,127,255,.45);}
.signal-hop-label{background:rgba(6,12,24,.9);border:1px solid rgba(0,212,180,.38);border-radius:999px;color:#d9fff8;font-size:9px;font-weight:800;padding:2px 6px;white-space:nowrap;box-shadow:0 4px 14px rgba(0,0,0,.35);}
.signal-flow-note{background:rgba(6,12,24,.94);border:1px solid rgba(0,212,180,.42);border-radius:8px;color:#d9fff8;font-size:10px;font-weight:800;padding:5px 8px;white-space:nowrap;box-shadow:0 6px 22px rgba(0,0,0,.42);}
.analysis-label{background:rgba(6,12,24,.94);border:1px solid rgba(26,127,255,.35);border-radius:8px;padding:5px 8px;color:var(--text);font-size:10px;font-weight:800;line-height:1.35;white-space:nowrap;box-shadow:0 6px 22px rgba(0,0,0,.42);}
.analysis-label small{display:block;color:var(--muted);font-size:8px;font-weight:600;margin-top:1px;}
.analysis-label.danger{border-color:rgba(255,71,87,.42);color:#ffd7dc;}
.analysis-label.success{border-color:rgba(46,213,115,.42);color:#d9ffe7;}
@keyframes analysisRipple{0%{opacity:.88;transform:scale(.45)}75%,100%{opacity:0;transform:scale(2.15)}}
@keyframes flowDot{0%,100%{opacity:.45;transform:scale(.72)}50%{opacity:1;transform:scale(1.25)}}

/* 智能体五环节时间线 */
.agent-timeline{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);z-index:1000;background:rgba(13,25,41,.95);border:1px solid var(--border);border-radius:10px;padding:7px 12px;backdrop-filter:blur(12px);display:flex;align-items:center;gap:0;}
.phase-step{display:flex;align-items:center;gap:0;}
.phase-node{display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;}
.phase-circle{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;border:2px solid var(--border);transition:all .3s;}
.phase-circle.done{background:rgba(26,127,255,.2);border-color:var(--accent);color:var(--accent);}
.phase-circle.running{background:rgba(0,212,180,.15);border-color:var(--accent2);color:var(--accent2);animation:pulse 1.2s ease-in-out infinite;}
.phase-circle.pending{background:rgba(107,140,176,.06);border-color:rgba(107,140,176,.25);color:var(--muted);}
.phase-circle.failed{background:rgba(255,71,87,.12);border-color:var(--danger);color:var(--danger);}
.phase-label{font-size:8px;color:var(--muted);white-space:nowrap;}
.phase-arrow{width:22px;height:2px;background:linear-gradient(90deg,var(--accent),transparent 60%);margin:0 2px;opacity:.4;}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(0,212,180,.4);}50%{box-shadow:0 0 0 6px rgba(0,212,180,0);}}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:.4;}}

/* 地图弹层面板 */
.map-popup-panel{
  position:absolute;top:130px;left:10px;z-index:1100;
  width:330px;max-height:calc(100vh - 300px);
  background:rgba(6,12,24,.97);border:1px solid rgba(26,127,255,.4);
  border-radius:12px;display:flex;flex-direction:column;
  box-shadow:0 12px 48px rgba(0,20,80,.6);
  backdrop-filter:blur(16px);
  transition:transform .22s cubic-bezier(.34,1.56,.64,1),opacity .18s;
  transform:translateY(-12px);opacity:0;pointer-events:none;
}
.map-popup-panel.visible{transform:translateY(0);opacity:1;pointer-events:all;}
.mpp-header{display:flex;align-items:flex-start;gap:7px;padding:9px 11px 8px;border-bottom:1px solid rgba(30,49,82,.8);flex-shrink:0;}
.mpp-type-icon{font-size:16px;line-height:1.3;flex-shrink:0;}
.mpp-title-col{flex:1;min-width:0;}
.mpp-title{font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.mpp-sub{font-size:9px;color:var(--muted);margin-top:2px;line-height:1.4;}
.mpp-sev-badge{padding:2px 7px;border-radius:20px;font-size:9px;font-weight:700;flex-shrink:0;white-space:nowrap;align-self:flex-start;}
.mpp-close{width:20px;height:20px;border-radius:50%;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:10px;flex-shrink:0;color:var(--muted);transition:all .15s;}
.mpp-close:hover{background:rgba(255,71,87,.15);border-color:var(--danger);color:var(--danger);}
.mpp-tabs{display:flex;gap:2px;padding:5px 8px;border-bottom:1px solid rgba(30,49,82,.5);flex-shrink:0;}
.mpp-tab{flex:1;padding:4px 3px;text-align:center;font-size:10px;font-weight:600;border-radius:5px;cursor:pointer;color:var(--muted);border:1px solid transparent;transition:all .15s;white-space:nowrap;}
.mpp-tab.active{background:rgba(26,127,255,.12);color:var(--accent);border-color:rgba(26,127,255,.3);}
.mpp-content{flex:1;overflow-y:auto;padding:9px 10px;display:flex;flex-direction:column;gap:6px;}
.mpp-content::-webkit-scrollbar{width:3px;}
.mpp-content::-webkit-scrollbar-thumb{background:rgba(30,49,82,.8);}
.mpp-card{background:rgba(255,255,255,.02);border:1px solid var(--border);border-radius:7px;padding:7px 9px;}
.mpp-card-title{font-size:9px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:5px;display:flex;align-items:center;gap:3px;}
.mpp-kpi-row{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;}
.mpp-kpi{background:rgba(255,255,255,.025);border:1px solid var(--border);border-radius:6px;padding:6px 5px;text-align:center;}
.mpp-kpi-val{font-size:14px;font-weight:800;line-height:1;}
.mpp-kpi-label{font-size:8px;color:var(--muted);margin-top:2px;}
.mpp-footer{padding:7px 10px;border-top:1px solid rgba(30,49,82,.6);display:flex;gap:4px;flex-shrink:0;}
.mpp-action{flex:1;padding:6px 4px;border-radius:6px;border:1px solid var(--border);background:rgba(255,255,255,.025);color:var(--text);font-size:10px;font-weight:600;text-align:center;text-decoration:none;cursor:pointer;transition:all .2s;display:block;}
.mpp-action:hover{border-color:var(--accent);background:rgba(26,127,255,.08);color:var(--accent);}
.mpp-action.primary{background:rgba(26,127,255,.15);border-color:rgba(26,127,255,.4);color:var(--accent);}
.mpp-action.warn-btn{background:rgba(245,166,35,.08);border-color:rgba(245,166,35,.3);color:var(--warn);}
.mpp-metric-note{font-size:9px;color:var(--muted);line-height:1.6;margin-bottom:2px;}
.mpp-legend{display:flex;align-items:center;gap:10px;font-size:9px;color:var(--muted);margin-bottom:3px;}
.mpp-legend-item{display:inline-flex;align-items:center;gap:4px;}
.mpp-legend-line{width:18px;height:2px;border-radius:2px;display:inline-block;}
.mpp-chart-card{background:rgba(255,255,255,.02);border:1px solid var(--border);border-radius:7px;padding:7px 8px;}
.mpp-chart-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:3px;}
.mpp-chart-title{font-size:10px;font-weight:800;color:var(--text);}
.mpp-chart-unit{font-size:8px;color:var(--muted);white-space:nowrap;}
.mpp-chart-svg{width:100%;height:72px;display:block;overflow:visible;}
.mpp-chart-axis{stroke:rgba(107,140,176,.22);stroke-width:1;}
.mpp-chart-grid{stroke:rgba(107,140,176,.14);stroke-width:1;stroke-dasharray:2 3;}
.mpp-chart-weekday{fill:none;stroke:var(--accent);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;}
.mpp-chart-weekend{fill:none;stroke:var(--warn);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:4 3;}
.mpp-chart-dot-weekday{fill:var(--accent);}
.mpp-chart-dot-weekend{fill:var(--warn);}
.mpp-chart-labels{display:flex;justify-content:space-between;color:var(--muted);font-size:8px;margin-top:1px;}

/* ===== RIGHT PANEL ===== */
.right-panel{width:420px;min-height:0;flex-shrink:0;display:flex;flex-direction:column;overflow:hidden;background:var(--surface);border-left:1px solid var(--border);}

/* Run 状态条 */
.run-status-bar{padding:9px 14px;border-bottom:1px solid var(--border);flex-shrink:0;background:var(--surface2);}
.rsb-row{display:flex;align-items:center;gap:6px;}
.rsb-label{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.06em;}
.rsb-id{font-size:10px;color:var(--muted);font-family:monospace;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.rsb-status{font-size:10px;font-weight:700;padding:2px 7px;border-radius:8px;}
.rsb-auto{background:rgba(46,213,115,.12);color:var(--success);border:1px solid rgba(46,213,115,.25);}
.rsb-pending{background:rgba(245,166,35,.12);color:var(--warn);border:1px solid rgba(245,166,35,.25);}
.rsb-takeover{background:rgba(255,71,87,.12);color:var(--danger);border:1px solid rgba(255,71,87,.25);}
.rsb-phase-row{display:flex;align-items:center;gap:3px;margin-top:5px;flex-wrap:nowrap;overflow:hidden;}
.rsb-phase{font-size:10px;padding:2px 6px;border-radius:5px;font-weight:600;white-space:nowrap;}
.rsb-phase.done{background:rgba(26,127,255,.12);color:var(--accent);}
.rsb-phase.running{background:rgba(0,212,180,.12);color:var(--accent2);animation:blink 1s ease-in-out infinite;}
.rsb-phase.pending{background:rgba(107,140,176,.08);color:var(--muted2);}
.rsb-phase.failed{background:rgba(255,71,87,.1);color:var(--danger);}

/* 右侧内容区 */
.right-scroll{flex:1;min-height:0;overflow-y:scroll;display:flex;flex-direction:column;scrollbar-gutter:stable;}
.right-scroll::-webkit-scrollbar{width:6px;}
.right-scroll::-webkit-scrollbar-track{background:rgba(255,255,255,.025);}
.right-scroll::-webkit-scrollbar-thumb{background:var(--border2);border-radius:999px;}

/* Run 列表 */
.run-list-block{padding:10px 12px;border-bottom:1px solid var(--border);}
.run-list-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;}
.run-list-title{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;}
.run-list{display:flex;flex-direction:column;gap:4px;max-height:200px;overflow-y:auto;}
.run-item{display:flex;align-items:center;gap:7px;padding:6px 9px;border-radius:7px;border:1px solid var(--border);background:var(--surface2);cursor:pointer;transition:all .15s;}
.run-item:hover{border-color:var(--accent);}
.run-item.active-run{border-color:var(--accent);background:rgba(26,127,255,.07);}
.run-item-icon{font-size:13px;flex-shrink:0;}
.run-item-info{flex:1;min-width:0;}
.run-item-name{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.run-item-desc{font-size:10px;color:var(--muted);margin-top:2px;}
.run-item-status{font-size:10px;font-weight:700;flex-shrink:0;}

/* 详情模块 */
.detail-block{padding:10px 12px;border-bottom:1px solid var(--border);}
.detail-title{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:7px;display:flex;align-items:center;gap:4px;flex-wrap:wrap;}
.wb-phase-detail-link{font-size:9px;font-weight:600;color:var(--accent);text-decoration:none;padding:2px 8px;border-radius:5px;border:1px solid rgba(26,127,255,.35);background:rgba(26,127,255,.06);white-space:nowrap;flex-shrink:0;}
.wb-phase-detail-link:hover{border-color:var(--accent);background:rgba(26,127,255,.12);color:var(--accent);}
.detail-dot{width:5px;height:5px;border-radius:50%;}

/* 体检单 */
.checkup-list{display:flex;flex-direction:column;gap:4px;}
.checkup-item{display:flex;align-items:flex-start;gap:7px;padding:7px 9px;border-radius:7px;background:rgba(255,255,255,.02);border:1px solid var(--border);cursor:pointer;}
.checkup-item:hover{border-color:rgba(255,255,255,.15);}
.checkup-rank{width:20px;height:20px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:800;flex-shrink:0;margin-top:1px;}
.p0{background:rgba(255,71,87,.18);color:var(--danger);}
.p1{background:rgba(245,166,35,.15);color:var(--warn);}
.p2{background:rgba(26,127,255,.12);color:var(--accent);}
.p3{background:rgba(107,140,176,.1);color:var(--muted);}
.checkup-body{flex:1;min-width:0;}
.checkup-name{font-size:12px;font-weight:600;}
.checkup-evidence{font-size:11px;color:var(--muted);margin-top:3px;line-height:1.6;}
.checkup-toggle{font-size:10px;color:var(--accent);cursor:pointer;text-decoration:underline;margin-top:3px;display:inline-block;}
.checkup-detail{display:none;margin-top:5px;padding:6px 8px;background:rgba(26,127,255,.04);border-radius:6px;border:1px solid rgba(26,127,255,.12);font-size:10px;color:var(--muted);line-height:1.7;}
.checkup-detail.open{display:block;}

/* 策略推荐 */
.strategy-card{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:9px 11px;margin-bottom:5px;}
.strategy-name{font-size:12px;font-weight:700;}
.strategy-desc{font-size:11px;color:var(--muted);margin-top:3px;line-height:1.6;}
.strategy-risk{font-size:10px;font-weight:700;padding:2px 7px;border-radius:8px;display:inline-block;margin-top:4px;}
.risk-low{background:rgba(46,213,115,.1);color:var(--success);border:1px solid rgba(46,213,115,.2);}
.risk-medium{background:rgba(245,166,35,.1);color:var(--warn);border:1px solid rgba(245,166,35,.2);}
.risk-high{background:rgba(255,71,87,.1);color:var(--danger);border:1px solid rgba(255,71,87,.2);}
.strategy-score-row{display:flex;align-items:center;gap:5px;margin-top:5px;}
.strategy-score-bar{flex:1;height:4px;background:var(--border);border-radius:2px;overflow:hidden;}
.strategy-score-fill{height:100%;border-radius:2px;background:var(--accent);}

/* 效果跟踪 */
.effect-compare{display:grid;grid-template-columns:1fr 1fr;gap:4px;}
.effect-col{background:rgba(255,255,255,.02);border:1px solid var(--border);border-radius:6px;padding:5px 7px;}
.effect-col-title{font-size:9px;font-weight:700;color:var(--muted);margin-bottom:4px;}
.effect-metric{display:flex;justify-content:space-between;font-size:10px;margin-bottom:2px;}
.effect-metric-label{color:var(--muted);}
.effect-metric-val{font-weight:700;}
.improvement-list{margin-top:5px;}
.improvement-row{display:flex;align-items:center;gap:5px;margin-bottom:3px;}
.improvement-name{font-size:9px;color:var(--muted);flex:1;}
.improvement-delta{font-size:10px;font-weight:700;}
.improvement-bar-wrap{width:60px;height:3px;background:var(--border);border-radius:2px;overflow:hidden;}
.improvement-bar-fill{height:100%;border-radius:2px;}
.meets-yes{color:var(--success);}
.meets-no{color:var(--danger);}

/* 人工干预区 */
.intervention-card{background:var(--surface2);border:1px solid var(--border);border-radius:7px;padding:7px 9px;margin-bottom:4px;}
.ic-head{display:flex;align-items:center;gap:5px;margin-bottom:3px;}
.ic-op{font-size:10px;font-weight:600;}
.ic-role{font-size:9px;color:var(--muted);}
.ic-type{font-size:9px;font-weight:700;padding:1px 5px;border-radius:8px;margin-left:auto;}
.ic-approve{background:rgba(46,213,115,.1);color:var(--success);border:1px solid rgba(46,213,115,.2);}
.ic-takeover{background:rgba(255,71,87,.1);color:var(--danger);border:1px solid rgba(255,71,87,.2);}
.ic-adjust{background:rgba(245,166,35,.1);color:var(--warn);border:1px solid rgba(245,166,35,.2);}
.ic-restore{background:rgba(26,127,255,.1);color:var(--accent);border:1px solid rgba(26,127,255,.2);}
.ic-reason{font-size:9px;color:var(--muted);line-height:1.5;}

/* 待处理区 */
.pending-block{padding:8px 10px;border-bottom:1px solid var(--border);background:rgba(245,166,35,.03);}
.pending-title{font-size:9px;font-weight:700;color:var(--warn);text-transform:uppercase;letter-spacing:.06em;margin-bottom:5px;display:flex;align-items:center;gap:4px;}
.pending-item{display:flex;align-items:center;gap:6px;padding:5px 7px;border-radius:6px;background:rgba(245,166,35,.05);border:1px solid rgba(245,166,35,.2);margin-bottom:3px;cursor:pointer;}
.pending-item:hover{background:rgba(245,166,35,.1);}
.pending-item-name{font-size:10px;font-weight:600;flex:1;}
.pending-btn{padding:3px 8px;border-radius:5px;font-size:9px;font-weight:700;border:1px solid rgba(46,213,115,.3);background:rgba(46,213,115,.08);color:var(--success);cursor:pointer;}

/* 空状态 */
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;gap:6px;color:var(--muted);font-size:11px;padding:24px;}
.empty-icon{font-size:28px;opacity:.5;}

/* 通用 */
.sev-tag-critical{background:rgba(255,71,87,.15);color:var(--danger);border:1px solid rgba(255,71,87,.3);}
.sev-tag-warning{background:rgba(245,166,35,.12);color:var(--warn);border:1px solid rgba(245,166,35,.3);}
.section-divider{height:1px;background:var(--border);margin:0;}

/* 人工操作按钮组 */
.action-btn-row{display:flex;gap:4px;margin-top:6px;}
.action-btn{flex:1;padding:5px 4px;border-radius:5px;border:1px solid var(--border);background:rgba(255,255,255,.03);color:var(--text);font-size:9px;font-weight:600;cursor:pointer;text-align:center;transition:all .15s;}
.action-btn:hover{border-color:var(--accent);background:rgba(26,127,255,.08);color:var(--accent);}
.action-btn.approve{background:rgba(46,213,115,.08);border-color:rgba(46,213,115,.3);color:var(--success);}
.action-btn.reject{background:rgba(255,71,87,.06);border-color:rgba(255,71,87,.25);color:var(--danger);}
.action-btn.takeover{background:rgba(245,166,35,.06);border-color:rgba(245,166,35,.25);color:var(--warn);}
.action-btn.restore{background:rgba(26,127,255,.08);border-color:rgba(26,127,255,.25);color:var(--accent);}

/* Dynamic Alert Notification */
.alert-notification{position:absolute;top:55px;left:50%;transform:translateX(-50%);z-index:1500;display:flex;flex-direction:column;gap:6px;pointer-events:none;align-items:center;}
.alert-pop{background:rgba(255,71,87,.95);color:#fff;padding:8px 18px;border-radius:10px;font-size:12px;font-weight:700;box-shadow:0 4px 24px rgba(255,71,87,.45);animation:alertIn .4s ease-out;pointer-events:auto;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:6px;}
@keyframes alertIn{from{opacity:0;transform:translateY(-16px) scale(.92)}to{opacity:1;transform:translateY(0) scale(1)}}
.alert-pop:hover{filter:brightness(1.1);transform:scale(1.02);}
.dyn-alert-marker{position:relative;min-width:110px;transform:translate(-50%,-50%);pointer-events:auto;cursor:pointer;}
.dyn-alert-core{position:absolute;left:50%;top:50%;width:18px;height:18px;border-radius:50%;transform:translate(-50%,-50%);background:var(--danger);border:2px solid rgba(255,255,255,.86);box-shadow:0 0 16px rgba(255,71,87,.95),0 0 42px rgba(255,71,87,.35);animation:dynAlertBreath 1.35s ease-in-out infinite;}
.dyn-alert-core::before,.dyn-alert-core::after{content:"";position:absolute;inset:-12px;border-radius:50%;border:1px solid rgba(255,71,87,.72);animation:dynAlertRipple 2.2s ease-out infinite;}
.dyn-alert-core::after{animation-delay:.8s;border-color:rgba(245,166,35,.62);}
.dyn-alert-label{position:absolute;left:50%;top:20px;transform:translateX(-50%);padding:4px 8px;border-radius:999px;background:rgba(6,12,24,.88);border:1px solid rgba(255,71,87,.42);box-shadow:0 8px 24px rgba(0,0,0,.36);backdrop-filter:blur(8px);font-size:9px;font-weight:800;color:#ffd7dc;white-space:nowrap;}
.dyn-alert-marker.selected .dyn-alert-core{background:#f5a623;box-shadow:0 0 18px rgba(245,166,35,.98),0 0 48px rgba(245,166,35,.42);}
.dyn-alert-marker.deployed .dyn-alert-core{background:var(--purple);box-shadow:0 0 15px rgba(168,160,248,.82),0 0 36px rgba(168,160,248,.28);}
.dyn-alert-marker.deployed .dyn-alert-label{border-color:rgba(168,160,248,.42);color:#e4e0ff;}
@keyframes dynAlertBreath{0%,100%{transform:translate(-50%,-50%) scale(.92)}50%{transform:translate(-50%,-50%) scale(1.18)}}
@keyframes dynAlertRipple{0%{opacity:.86;transform:scale(.45)}75%,100%{opacity:0;transform:scale(2.5)}}

/* LLM Reasoning Animations */
.llm-thinking-badge{font-size:9px;padding:2px 8px;border-radius:12px;background:linear-gradient(90deg,rgba(26,127,255,.15),rgba(0,212,180,.15));color:var(--accent2);animation:thinkPulse 1.5s ease-in-out infinite;font-weight:700;margin-left:auto;}
@keyframes thinkPulse{0%,100%{opacity:1}50%{opacity:.4}}
.thinking-dots{display:flex;gap:5px;padding:10px 0;justify-content:center;}
.thinking-dots span{width:7px;height:7px;border-radius:50%;background:var(--accent);animation:dotBounce 1.4s infinite ease-in-out both;}
.thinking-dots span:nth-child(1){animation-delay:-.32s}
.thinking-dots span:nth-child(2){animation-delay:-.16s}
@keyframes dotBounce{0%,80%,100%{transform:scale(0);opacity:.3}40%{transform:scale(1);opacity:1}}
.llm-shimmer{background:linear-gradient(90deg,transparent 0%,rgba(26,127,255,.06) 50%,transparent 100%);background-size:200% 100%;animation:shimmer 2s linear infinite;border-radius:7px;padding:8px 10px;}
@keyframes shimmer{from{background-position:200% 0}to{background-position:-200% 0}}
.llm-stream-line{animation:streamIn .35s ease forwards;opacity:0;font-size:11px;line-height:1.8;padding:2px 0;}
@keyframes streamIn{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:translateX(0)}}
.llm-stream-key{color:var(--accent);font-weight:700;font-size:10px;}
.llm-stream-val{color:var(--text);font-weight:600;}
.llm-conclusion{margin-top:8px;padding:8px 11px;border-radius:7px;background:rgba(26,127,255,.04);border:1px solid rgba(26,127,255,.12);font-size:11px;color:var(--text);line-height:1.7;animation:fadeUp .5s ease forwards;opacity:0;}
@keyframes fadeUp{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}

/* Countdown Timer */
.countdown-bar{margin-top:10px;padding:10px 12px;border-radius:8px;background:rgba(245,166,35,.05);border:1px solid rgba(245,166,35,.2);}
.countdown-title{font-size:11px;font-weight:700;color:var(--warn);margin-bottom:6px;display:flex;align-items:center;gap:5px;}
.countdown-progress{height:4px;border-radius:2px;background:var(--border);overflow:hidden;margin-bottom:6px;}
.countdown-fill{height:100%;border-radius:2px;background:linear-gradient(90deg,var(--warn),var(--danger));transition:width 1s linear;}
.countdown-seconds{font-size:22px;font-weight:800;color:var(--warn);text-align:center;font-variant-numeric:tabular-nums;}
.countdown-actions{display:flex;gap:6px;margin-top:8px;}
.countdown-btn{flex:1;padding:7px;border-radius:7px;border:1px solid;font-size:11px;font-weight:700;cursor:pointer;text-align:center;transition:all .15s;}
.countdown-btn:hover{filter:brightness(1.15);}
/* Inline Intervention Editor */
.intervene-editor{padding:10px 0;}
.intervene-header{font-size:13px;font-weight:800;color:var(--warn);margin-bottom:4px;}
.intervene-desc{font-size:10px;color:var(--muted);margin-bottom:10px;line-height:1.5;}
.intervene-field{margin-bottom:8px;}
.intervene-label{display:block;font-size:10px;color:var(--muted);margin-bottom:3px;font-weight:600;}
.intervene-input{width:100%;padding:5px 8px;border:1px solid rgba(245,166,35,.3);border-radius:6px;background:rgba(245,166,35,.04);color:var(--text);font-size:11px;box-sizing:border-box;transition:border-color .15s;}
.intervene-textarea{width:100%;padding:5px 8px;border:1px solid rgba(245,166,35,.3);border-radius:6px;background:rgba(245,166,35,.04);color:var(--text);font-size:11px;box-sizing:border-box;resize:vertical;font-family:inherit;line-height:1.6;transition:border-color .15s;}
.intervene-input:focus,.intervene-textarea:focus{outline:none;border-color:rgba(245,166,35,.65);}
.intervene-actions{display:flex;gap:6px;margin-top:12px;}
.intervene-btn{flex:1;padding:7px;border-radius:7px;font-size:11px;font-weight:700;cursor:pointer;transition:all .15s;}
.intervene-btn-primary{background:rgba(26,127,255,.1);border:1px solid rgba(26,127,255,.3);color:var(--accent);}
.intervene-btn-cancel{background:rgba(255,80,80,.06);border:1px solid rgba(255,80,80,.2);color:var(--danger);}

/* Phase Progress */
.phase-progress{display:flex;align-items:center;gap:0;padding:10px 12px;border-bottom:1px solid var(--border);justify-content:center;flex-wrap:nowrap;}
.pp-step{display:flex;align-items:center;gap:0;}
.pp-dot{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;border:2px solid var(--border);transition:all .4s;flex-shrink:0;}
.pp-dot.active{border-color:var(--accent2);background:rgba(0,212,180,.15);animation:pulse 1.2s ease-in-out infinite;}
.pp-dot.done{border-color:var(--accent);background:rgba(26,127,255,.15);color:var(--accent);}
.pp-dot.waiting{border-color:var(--warn);background:rgba(245,166,35,.1);animation:pulse 1.5s ease-in-out infinite;}
.pp-arrow{width:16px;height:2px;background:var(--border);margin:0 1px;flex-shrink:0;transition:background .3s;}
.pp-arrow.done{background:var(--accent);}

/* New alert glow */
.queue-item.new-alert{animation:newGlow 2s ease-in-out;border-left-color:var(--danger)!important;background:rgba(255,71,87,.05)!important;}
@keyframes newGlow{0%{box-shadow:inset 0 0 0 rgba(255,71,87,0)}30%{box-shadow:inset 0 0 12px rgba(255,71,87,.12)}100%{box-shadow:inset 0 0 0 rgba(255,71,87,0)}}

.dyn-alert-locate:hover,.dyn-alert-handle:hover{filter:brightness(1.2);transform:translateY(-1px);}
.dyn-map-marker{position:relative;width:20px;height:20px;border-radius:50%;background:#ff4757;border:2px solid rgba(255,255,255,.82);box-shadow:0 0 18px rgba(255,71,87,.92),0 0 42px rgba(255,71,87,.35);cursor:pointer;}
.dyn-map-marker::before,.dyn-map-marker::after{content:"";position:absolute;inset:-10px;border-radius:50%;border:1px solid rgba(255,71,87,.72);animation:dynMapPulse 2s ease-out infinite;}

.dyn-map-marker.active::before,.dyn-map-marker.active::after{border-color:rgba(245,166,35,.78);}
.dyn-map-label{background:rgba(6,12,24,.92);border:1px solid rgba(255,71,87,.42);border-radius:8px;padding:5px 9px;color:#fff;font-size:10px;font-weight:800;line-height:1.35;white-space:nowrap;box-shadow:0 6px 22px rgba(0,0,0,.45),0 0 18px rgba(255,71,87,.18);}

<script>
const API = '';
let demoData = null;
let map = null;
let mapConfig = null;
let infoWindow = null;
let analysisObjectType = 'all';
let analysisDimension = 'cognition';
let markers = [];
let regionLayers = [];
let corridorLayers = [];
let demoIndex = null;
let selectedObjType = null;
let selectedObjId = null;
let selectedHighlight = null;
let signalFlowAnimationId = null;
let signalFlowParticles = [];
let signalPoiSearchSeq = 0;
let mapPopupType = null;
let mapPopupTarget = null;
let mapPopupTabIdx = 0;
let currentRunId = null;
let activeRuns = [];
let runDetailCache = {};
let pollInterval = null;
let currentQueueTab = 'bgIssue';
let issueHighlightMarkers = [];
let dynamicAlertLayers = [];
let dynamicAlertMapLayers = [];
let dynamicAlerts = [];
let dynamicAlertTimer = null;
let dynamicAlertIdx = 0;
let reasoningState = null;
let reasoningSeq = 0;

function cancelDynamicReasoning(){
  if(!reasoningState) return;
  reasoningState.cancelled = true;
  (reasoningState.timers||[]).forEach(t=>clearTimeout(t));
  if(reasoningState._interval) clearInterval(reasoningState._interval);
}

function isReasoningActiveFor(alertId, seq){
  return !!reasoningState
    && !reasoningState.cancelled
    && reasoningState.alertId === alertId
    && reasoningState.seq === seq;
}

// ===== CLOCK =====
function updateClock(){ document.getElementById('clock').textContent = new Date().toLocaleTimeString('zh-CN'); }
setInterval(updateClock, 1000); updateClock();

// ===== UTIL =====
const TYPE_ICON = { region:'🏙️', corridor:'🛣️', intersection:'🔦' };
const STATUS_COLOR = { critical:'#ff4757', warning:'#f5a623', optimizing:'#a8a0f8', optimized:'#2ed573', normal:'#6b8cb0' };
function getTypeLabel(t){ return {region:'区域',corridor:'干线',intersection:'路口'}[t]||t; }
function getTypeTagCls(t){ return {region:'tag-region',corridor:'tag-corridor',intersection:'tag-intersection'}[t]||'tag-region'; }
function sevCls(s){ return s>=0.88?'sev-critical':s>=0.70?'sev-warning':'sev-ok'; }
function sevLabel(s){ return s>=0.88?'严重':s>=0.70?'预警':'正常'; }
function sevColor(s){ return s>=0.88?'var(--danger)':s>=0.70?'var(--warn)':'var(--success)'; }
function automation2label(s){ return {auto_exec:'自动',pending_approval:'待审批',manual_takeover:'已接管',manual_adjusted:'已调整',failed:'失败',suspended:'已暂停'}[s]||s; }
function automation2cls(s){ return {auto_exec:'rsb-auto',pending_approval:'rsb-pending',manual_takeover:'rsb-takeover',manual_adjusted:'rsb-auto',failed:'rsb-takeover',suspended:'rsb-pending'}[s]||'rsb-auto'; }
function runStatus2color(s){ return {running:'var(--accent2)',awaiting_human:'var(--warn)',completed:'var(--success)',failed:'var(--danger)',triggering:'var(--muted)'}[s]||'var(--muted)'; }
function issueCategory2icon(cat){ return {signal_control:'🚦',dynamic:'⚡',static:'📋'}[cat]||'⚠️'; }
function priorityLevel2cls(lv){ return {P0:'p0',P1:'p1',P2:'p2',P3:'p3'}[lv]||'p3'; }

// ===== 证据字段中文化 =====
const EVIDENCE_LABELS = {
  saturation:'饱和度', demandSupplyRatio:'供需比', congestionPhase:'拥堵阶段',
  avgSpeed:'平均车速(km/h)', inFlow:'进入流量(辆/h)', outFlow:'离开流量(辆/h)',
  flowDiff:'流量差(辆/h)', netAccumulation:'净积压量', peakHourFlow:'高峰小时流量(辆/h)',
  affectedIntersections:'影响路口', phaseImbalanceIndex:'相位失衡指数',
  queueLength:'排队长度(m)', storageCap:'存储容量(m)', bottleneckNode:'瓶颈节点',
  bandwidthLoss:'绿波带宽损失(s)', coordCycle:'协调周期(s)', peakWindow:'峰值时段',
  affectedArea:'影响范围', stopRate:'停车率', greenWasteRatio:'绿灯空放比',
  splitDiff:'绿信比差值', delay:'延误(s)', avgDelay:'平均延误(s)',
};
function fmtEvidence(evidence){
  return Object.entries(evidence).map(([k,v])=>{
    const label = EVIDENCE_LABELS[k]||k;
    const val = Array.isArray(v)?v.join(', '):v;
    return `<span style="white-space:nowrap"><span style="color:var(--muted)">${label}:</span> <strong>${val}</strong></span>`;
  }).join(' · ');
}

// ===== 队列分类 =====
function classifyQueueType(obj, type){
  if(!obj.issues||!obj.issues.length) return 'periodic';
  const hasDynamic = obj.issues.some(i=>i.id&&i.id.startsWith('dynamic_'));
  const hasSignal = obj.issues.some(i=>i.id&&i.id.startsWith('signal_'));
  // 干线绿波优化为规律性；动态流量失衡为动态
  if(type==='corridor' && !hasDynamic) return 'periodic';
  if(hasDynamic && obj.saturation>0.85) return 'dynamic';
  if(hasSignal && !hasDynamic) return 'periodic';
  return hasDynamic?'dynamic':'periodic';
}

function getRunForObj(objId){
  return activeRuns.find(r=>r.targetId===objId)||null;
}

function getQueueItemStatus(obj, run){
  if(run){
    if(run.automationStatus==='pending_approval') return {label:'待审批',cls:'qb-pending'};
    if(run.automationStatus==='manual_takeover') return {label:'人工接管',cls:'qb-critical'};
    if(run.status==='running') return {label:'运行中',cls:'qb-running'};
    if(run.status==='completed'&&run.evaluationStatus==='meets_target') return {label:'已达标',cls:'qb-done'};
    if(run.status==='completed') return {label:'未达标',cls:'qb-pending'};
  }
  if(obj.status==='critical') return {label:'待优化',cls:'qb-critical'};
  if(obj.status==='warning') return {label:'关注中',cls:'qb-pending'};
  return {label:'监测中',cls:'qb-done'};
}

function getPlanBrief(obj){
  const s=(obj.strategies||[])[0];
  if(s) return s.description||s.templateId||'';
  if(obj.primaryIssue) return issueLabel(obj.primaryIssue)+' 应对策略';
  return '';
}

function getPlanForObj(targetId){
  if(!demoData?.plans) return null;
  return demoData.plans.find(p=>p.targetId===targetId)||null;
}

function getEvalForObj(targetId){
  if(!demoData?.evaluations) return null;
  return demoData.evaluations.find(e=>e.targetId===targetId)||null;
}

/** 跳转智能体工作台并打开指定对象对应五环节 tab（phase 1–5） */
function wbWorkbenchPhaseDetailLink(type, id, phase){
  if(!type || !id) return '';
  const href = `/debug/agent-workbench.html?id=${encodeURIComponent(String(id))}&type=${encodeURIComponent(String(type))}&phase=${phase}`;
  return `<a class="wb-phase-detail-link" href="${href}">详情</a>`;
}

function renderPlanBlock(plan, wbTarget){
  const wbLink = wbTarget && wbTarget.type && wbTarget.id ? wbWorkbenchPhaseDetailLink(wbTarget.type, wbTarget.id, 4) : '';
  if(!plan){

        <div style="font-size:12px;font-weight:800;color:var(--purple)">${pp.commonCycle||'—'}s</div>

      <div style="flex:1;min-width:60px;background:rgba(26,127,255,.06);border:1px solid rgba(26,127,255,.15);border-radius:5px;padding:4px 6px;text-align:center">

        <div style="font-size:12px;font-weight:800;color:var(--accent2)">${pp.greenWaveSpeed}km/h</div>

  if(isCorr && pp.direction){
    const dirLabel = pp.direction==='bidirectional'?'双向协调':pp.direction==='eastbound'?'东行优先':pp.direction==='westbound'?'西行优先':pp.direction;
    html += `<div style="font-size:9px;color:var(--muted);margin-bottom:5px">协调方向：<strong style="color:var(--accent2)">${dirLabel}</strong></div>`;

    const phases = ip.phases||[];

function renderEvalBlock(evaluation, objType, wbTarget){
  if(!evaluation) return '';
  const scorePct = Math.round((evaluation.overallScore||0)*100);
  const meets = evaluation.meetsTarget;
  const meetsColor = meets?'var(--success)':'var(--danger)';
  const meetsLabel = meets?'✅ 达标':'❌ 未达标';
  const isIntersection = objType === 'intersection';
  const imps = (evaluation.improvements||[]).filter(imp=>!(isIntersection && imp.metric==='停车率'));
  const sides = evaluation.sideEffects||[];
  const m = evaluation.metrics||{};
  const wbLink = wbTarget && wbTarget.type && wbTarget.id ? wbWorkbenchPhaseDetailLink(wbTarget.type, wbTarget.id, 5) : '';

  let html = `<div class="detail-block">
    <div class="detail-title"><div class="detail-dot" style="background:${meetsColor}"></div>评价效果指标
      <span style="margin-left:auto;display:inline-flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end">
        <span style="font-size:9px;font-weight:700;color:${meetsColor}">${meetsLabel} · ${scorePct}分</span>
        ${wbLink}
      </span>
    </div>
    <div style="font-size:9px;color:var(--muted);margin-bottom:6px">📊 评估窗口：${evaluation.windowMinutes||30}分钟 · ${evaluation.evaluatedAt||'—'}</div>`;

  if(m.before && m.after){
    const metricNames = {avgSpeed:'均速(km/h)',stopRate:'停车率',avgDelay:'延误(s)',saturation:'饱和度',throughputRatio:'通行率',congestionIndex:'拥堵指数'};
    const keys = Object.keys(m.before).filter(k=>m.before[k]!=null && m.after[k]!=null && !(isIntersection && k==='stopRate'));
    if(keys.length){
      html += `<div style="display:grid;grid-template-columns:${keys.length<=3?'repeat('+keys.length+',1fr)':'repeat(3,1fr)'};gap:4px;margin-bottom:6px">`;
      keys.slice(0,6).forEach(k=>{
        const bv = m.before[k];
        const av = m.after[k];
        const tv = m.target?.[k];
        const isRate = k==='stopRate'||k==='saturation'||k==='throughputRatio';
        const fmtV = v=>isRate?Math.round(v*100)+'%':(typeof v==='number'?v.toFixed(1):v);
        const delta = av - bv;
        const good = (k==='avgSpeed'||k==='throughputRatio') ? delta>0 : delta<0;
        const deltaColor = good?'var(--success)':'var(--danger)';
        const arrow = delta>0?'↑':'↓';
        html += `<div style="background:rgba(255,255,255,.025);border:1px solid var(--border);border-radius:5px;padding:4px 5px;text-align:center">
          <div style="font-size:8px;color:var(--muted);margin-bottom:2px">${metricNames[k]||k}</div>
          <div style="font-size:7px;color:var(--muted);text-decoration:line-through">${fmtV(bv)}</div>
          <div style="font-size:11px;font-weight:700;color:${deltaColor}">${fmtV(av)}</div>
          <div style="font-size:7px;color:${deltaColor}">${arrow} ${Math.abs(isRate?Math.round(delta*100):delta).toFixed(1)}${isRate?'%':''}</div>
          ${tv!=null?`<div style="font-size:7px;color:var(--muted)">目标:${fmtV(tv)}</div>`:''}
        </div>`;
      });
      html += `</div>`;
    }
  }

  if(imps.length){
    html += `<div style="margin-bottom:5px">`;
    imps.forEach(imp=>{
      const pct = imp.deltaPercent||0;
      const barW = Math.min(100, Math.abs(pct));
      const barC = imp.meetsTarget?'var(--success)':'var(--danger)';
      const arrow = pct>0?'↑':'↓';
      html += `<div style="display:flex;align-items:center;gap:5px;margin-bottom:3px">
        <span style="font-size:9px;color:var(--text);width:70px;flex-shrink:0">${imp.metric}</span>
        <div style="flex:1;height:5px;background:rgba(255,255,255,.06);border-radius:3px;overflow:hidden"><div style="width:${barW}%;height:100%;background:${barC};border-radius:3px"></div></div>
        <span style="font-size:9px;font-weight:700;color:${barC};width:50px;text-align:right">${arrow}${Math.abs(pct).toFixed(1)}%</span>
        <span style="font-size:8px;width:14px;text-align:center">${imp.meetsTarget?'✅':'❌'}</span>
      </div>`;
    });
    html += `</div>`;
  }

  if(sides.length){
    html += `<div style="margin-top:4px;padding:4px 6px;border-radius:5px;background:rgba(245,166,35,.04);border:1px solid rgba(245,166,35,.12)">
      <div style="font-size:8px;font-weight:700;color:var(--warn);margin-bottom:2px">⚠️ 副作用</div>`;
    sides.forEach(se=>{
      html += `<div style="font-size:8px;color:var(--muted);line-height:1.5">${se.acceptable?'✅':'⚠️'} ${se.description}</div>`;
    });
    html += `</div>`;
  }

  if(evaluation.recommendation){
    html += `<div style="margin-top:5px;padding:5px 7px;border-radius:5px;background:rgba(0,212,180,.04);border:1px solid rgba(0,212,180,.12);font-size:9px;color:var(--accent2);line-height:1.6">💡 <strong>建议：</strong>${evaluation.recommendation}</div>`;
  }

  html += `</div>`;
  return html;
}

function buildQueueItem(obj, type, tabContext=null){
  const run = getRunForObj(obj.id);
  // 已完成的对象显示优化后饱和度（应低于 80%）
  const rawSat = obj.saturation||obj.stopRate||0;
  const sat = tabContext==='completed' && rawSat>=0.8 ? +(rawSat*0.78).toFixed(2) : rawSat;
  let status, dotCls, desc;
  if(tabContext === 'completed'){
    status = {label:'已达标', cls:'qb-done'};
    dotCls = 'q-dot-ok';
    desc = '运行正常';
  } else if(tabContext === 'optimizing'){
    dotCls = 'q-dot-running';
    status = (run&&run.status==='running') ? {label:'优化中',cls:'qb-running'} : {label:'监控中',cls:'qb-running'};
    desc = obj.primaryIssue?issueLabel(obj.primaryIssue):(obj.status==='critical'?'严重异常':'优化中');
  } else {
    status = getQueueItemStatus(obj, run);
    dotCls = obj.status==='critical'?'q-dot-critical':obj.status==='warning'?'q-dot-warning':run&&run.status==='running'?'q-dot-running':'q-dot-ok';
    desc = obj.primaryIssue?issueLabel(obj.primaryIssue):(obj.status==='critical'?'严重异常':'运行中');
  }
  const satTxt = sat>0?` · 饱和度 ${Math.round(sat*100)}%`:'';
  const typeTag = {region:'区域',corridor:'干线',intersection:'路口'}[type]||type;
  const planBrief = getPlanBrief(obj);
  const planLine = planBrief?`<div style="font-size:9px;color:var(--accent);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">📐 ${planBrief}</div>`:'';
  return `<div class="queue-item" onclick="selectObj('${type}','${obj.id}')">
    <div class="queue-dot ${dotCls}"></div>
    <div class="queue-item-info">
      <div class="queue-item-name"><span class="q-type-tag q-type-${type}">${typeTag}</span>${obj.name}</div>
      <div class="queue-item-desc">${desc}${satTxt}</div>
      ${planLine}
    </div>
    <span class="queue-item-badge ${status.cls}">${status.label}</span>
  </div>`;
}

function buildCompletedItem(obj, type, run){
  const base = buildQueueItem(obj, type, 'completed');
  if(!run?.effect) return base;
  const eff = run.effect;
  const scorePct = Math.round((eff.overall_score||0)*100);
  const meetsCls = eff.meets_target?'meets':'fails';
  const meetsLbl = eff.meets_target?'达标':'未达标';
  const conclusion = eff.conclusion||'';
  const evalRow = `<div class="completed-eval"><span class="completed-score ${meetsCls}">${meetsLbl} ${scorePct}%</span><span class="completed-conclusion">${conclusion}</span></div>`;
  // Insert eval row before the closing badge span
  const lastClose = base.lastIndexOf('</div>');
  if(lastClose===-1) return base;
  return base.slice(0, lastClose) + evalRow + base.slice(lastClose);
}

function renderAgentQueue(){
  if(!demoData) return;
  const allRegions = demoData.regions||[];
  const allCorridors = demoData.corridors||[];
  const allIntersections = demoData.intersections||[];

  // 分 4 个列表
  const bgIssue = [];    // 背景方案问题（signal_ / static_ issues）
  const dynIssue = [];   // 实时动态异常（dynamic_ issues）
  const optimizing = []; // 智能体优化中（status=optimizing 或 run 正在运行）
  const completed = [];  // 今日已完成（有 run 且已完成，或 status=optimized）

  function classify(obj, type){
    const run = getRunForObj(obj.id);
    const issues = obj.issues||[];
    const hasDynamic = issues.some(i=>(i.id||'').startsWith('dynamic_'));
    const hasStatic = issues.some(i=>(i.id||'').startsWith('signal_')||(i.id||'').startsWith('static_'));
    if(obj.status==='optimized'||(run&&run.status==='completed')){
      completed.push({obj,type,run});
    } else if(obj.status==='optimizing'||(run&&run.status==='running')){
      optimizing.push({obj,type,run});
    } else if(hasDynamic){
      dynIssue.push({obj,type,run});
    } else if(hasStatic){
      bgIssue.push({obj,type,run});
    }
  }

  allRegions.forEach(r=>classify(r,'region'));
  allCorridors.forEach(c=>classify(c,'corridor'));
  allIntersections.forEach(i=>classify(i,'intersection'));

  // 补充已完成：从 activeRuns 中已完成但没在上述对象中的
  activeRuns.filter(r=>r.status==='completed').forEach(r=>{
    if(!completed.find(c=>c.obj.id===(r.targetId||r.target_id))){
      completed.push({obj:{id:r.targetId||r.target_id,name:r.targetName||r.target_name||'',status:'optimized',saturation:0},type:r.targetType||r.target_type,run:r});
    }
  });

  // 更新计数
  const dynAlertActive = (typeof dynamicAlerts!=='undefined')?dynamicAlerts.filter(a=>!a._deployed):[];
  const dynAlertDeployed = (typeof dynamicAlerts!=='undefined')?dynamicAlerts.filter(a=>a._deployed):[];
  document.getElementById('tabCnt_bgIssue').textContent = bgIssue.length;
  document.getElementById('tabCnt_dynIssue').textContent = dynIssue.length + dynAlertActive.length;
  document.getElementById('tabCnt_optimizing').textContent = optimizing.length + dynAlertDeployed.length;
  document.getElementById('tabCnt_completed').textContent = completed.length;

  const empty = `<div style="font-size:11px;color:var(--muted);padding:10px 12px;text-align:center;font-style:italic">暂无对象</div>`;

  function renderTabItems(list, tabContext=null){
    if(!list.length) return empty;
    return list.map(({obj,type})=>buildQueueItem(obj,type,tabContext)).join('');
  }

  // 统计列表中各类型数量，同步更新顶部 KPI
  const allListedRegions = [...bgIssue,...dynIssue,...optimizing,...completed].filter(({type})=>type==='region').length;
  const allListedCorridors = [...bgIssue,...dynIssue,...optimizing,...completed].filter(({type})=>type==='corridor').length;
  const kpiReg = document.getElementById('kpiRegionCount');
  const kpiCor = document.getElementById('kpiCorridorCount');
  if(kpiReg) kpiReg.textContent = allListedRegions;
  if(kpiCor) kpiCor.textContent = allListedCorridors;

  document.getElementById('tabBody_bgIssue').innerHTML = renderTabItems(bgIssue);
  let dynHtml = dynAlertActive.length?dynAlertActive.map(a=>buildDynAlertItem(a)).join(''):'';
  if(dynIssue.length) dynHtml += renderTabItems(dynIssue);
  document.getElementById('tabBody_dynIssue').innerHTML = dynHtml || empty;
  let optHtml = optimizing.length?renderTabItems(optimizing,'optimizing'):'';
  if(dynAlertDeployed.length) optHtml += dynAlertDeployed.map(a=>`<div class="queue-item"><div class="queue-dot q-dot-running"></div><div class="queue-item-info"><div class="queue-item-name"><span class="q-type-tag q-type-intersection">路口</span>${a.name}</div><div class="queue-item-desc">🔄 ${a.stratName} 执行中</div><div style="font-size:9px;color:var(--accent);margin-top:2px">📐 ${a.plan.slice(0,30)}...</div></div><span class="queue-item-badge qb-running">优化中</span></div>`).join('');
  document.getElementById('tabBody_optimizing').innerHTML = optHtml || empty;
  document.getElementById('tabBody_completed').innerHTML = completed.length
    ? completed.map(({obj,type,run})=>buildCompletedItem(obj,type,run)).join('')
    : empty;
  if(!selectedObjId || mapPopupType === 'dynamicAlert') renderDynamicAlertOverlays();
  else clearDynamicAlertOverlays();
}

let drawerCurrentType = null;
let drawerFilter = 'all';

function openBadgeDrawer(type){
  drawerCurrentType = type;
  drawerFilter = 'all';
  const configs = {
    pending:{icon:'⏳',title:'待人工审批 / 接管列表'},
  };
  const cfg = configs[type]||{icon:'📋',title:'列表'};
  document.getElementById('drawerHeaderIcon').textContent = cfg.icon;
  document.getElementById('drawerTitle').textContent = cfg.title;
  renderDrawerBody(type);
  document.getElementById('badgeDrawerOverlay').classList.add('open');
  document.getElementById('badgeDrawer').classList.add('open');
}

function closeBadgeDrawer(){
  document.getElementById('badgeDrawerOverlay').classList.remove('open');
  document.getElementById('badgeDrawer').classList.remove('open');
}

function renderDrawerBody(type){
  const el = document.getElementById('drawerBody');
  let items = [];
  if(type==='critical'){
    if(demoData){
      const rr = demoData.regions.filter(r=>r.status==='critical'||r.status==='warning').map(r=>({...r,_type:'region'}));
      const cc = demoData.corridors.filter(c=>c.status==='critical'||c.status==='warning').map(c=>({...c,_type:'corridor'}));
      const ii = demoData.intersections.filter(i=>i.status==='critical'||i.status==='warning').sort((a,b)=>b.saturation-a.saturation).map(i=>({...i,_type:'intersection'}));
      items = [...rr,...cc,...ii];
    }
    el.innerHTML = buildDrawerItems(items, type);
  } else if(type==='pending'){
    const pending = activeRuns.filter(r=>r.automationStatus==='pending_approval'||r.automationStatus==='manual_takeover');
    el.innerHTML = buildDrawerRunItems(pending);
  } else if(type==='improved'){
    // 今日优化：overview topImprovements + completed runs
    const top = demoData?.overview?.topImprovements||demoData?.topImprovements||[];
    const completed = activeRuns.filter(r=>r.status==='completed');
    el.innerHTML = buildDrawerImprovedItems(top, completed);
  } else if(type==='auto'){
    const auto = activeRuns.filter(r=>r.status==='completed'&&r.evaluationStatus==='meets_target');
    el.innerHTML = buildDrawerRunItems(auto, true);
  }
}

function buildDrawerItems(items, mode){
  if(!items.length) return `<div class="drawer-empty"><div class="drawer-empty-icon">✅</div><div>暂无${mode==='critical'?'异常':''}对象</div></div>`;
  const total = items.length;
  let html = `<div class="drawer-count-bar"><span class="drawer-count-text">共</span><span class="drawer-count-num" style="margin:0 4px;color:var(--danger)">${total}</span><span class="drawer-count-text">个对象</span></div>`;
  items.forEach(obj=>{
    const type = obj._type;
    const sat = obj.saturation||obj.stopRate||0;
    const run = getRunForObj(obj.id);
    const qStatus = getQueueItemStatus(obj, run);
    const mainIssue = (obj.issues||[])[0];
    const col = obj.status==='critical'?'var(--danger)':'var(--warn)';
    html += `<div class="drawer-item" onclick="closeBadgeDrawer();selectObj('${type}','${obj.id}')">
      <div class="drawer-item-head">
        <span class="drawer-item-icon">${TYPE_ICON[type]||'📍'}</span>
        <span class="drawer-item-name">${obj.name}</span>
        <span class="drawer-item-badge" style="background:${obj.status==='critical'?'rgba(255,71,87,.12)':'rgba(245,166,35,.12)'};color:${col};border:1px solid ${col}33">${obj.status==='critical'?'严重':'预警'}</span>

// ===== DATA INDEX =====
function buildDemoIndex(data){
  const regions = new Map(data.regions.map(r=>[r.id,r]));
  const corridors = new Map(data.corridors.map(c=>[c.id,c]));
  const intersections = new Map(data.intersections.map(i=>[i.id,i]));
  const corridorByIntersection = new Map();
  data.corridors.forEach(c=>{ (c.intersectionIds||[]).forEach(id=>{ if(!corridorByIntersection.has(id)) corridorByIntersection.set(id,c.id); }); });
  return { regions, corridors, intersections, corridorByIntersection };
}
function getObj(type, id){
  if(!demoIndex) return null;
  return demoIndex[type==='region'?'regions':type==='corridor'?'corridors':'intersections'].get(id)||null;
}
function getIntersectionPosition(inter){ return [inter.lng||inter.center?.[0]||117.02, inter.lat||inter.center?.[1]||36.65]; }

const DYN_ALERT_POSITIONS = {
  '经十路-舜耕路口':[117.0125,36.6462],
  '纬二路-经七路口':[117.0014,36.6596],
  '解放桥-黑虎泉西路':[117.0317,36.6671],
  '北园大街-历山路口':[117.0492,36.6885],
  '泉城路-趵突泉北路':[117.0208,36.6668],
  '工业南路-化纤厂路':[117.1154,36.6884],
  '经四路-纬一路口':[117.0062,36.6635],
  '历山路-文化东路口':[117.0487,36.6569],
};

function getDynAlertPosition(alert){
  if(!alert) return [117.02,36.65];
  if(alert.lng && alert.lat) return [alert.lng, alert.lat];
  const exact = (demoData?.intersections||[]).find(i => i.name === alert.name);
  if(exact) return getIntersectionPosition(exact);
  const fuzzy = (demoData?.intersections||[]).find(i => {
    const n = i.name || '';
    return n.includes(alert.name) || alert.name.includes(n);
  });
  if(fuzzy) return getIntersectionPosition(fuzzy);
  return DYN_ALERT_POSITIONS[alert.name] || [117.02,36.65];
}

function clearDynamicAlertMapLayers(){
  if(dynamicAlertMapLayers.length && map) map.remove(dynamicAlertMapLayers);
  dynamicAlertMapLayers = [];
}

function renderDynamicAlertMapLayer(activeAlertId=null, fit=false){
  if(!map) return;
  clearDynamicAlertMapLayers();
  const alerts = (dynamicAlerts||[]).filter(a=>!a._deployed);
  if(!alerts.length) return;
  const positions = [];
  alerts.forEach((alert, idx)=>{
    const pos = getDynAlertPosition(alert);
    positions.push(pos);
    const isActive = activeAlertId === alert.id;
    const color = isActive ? '#f5a623' : '#ff4757';
    const radius = isActive ? 620 : 360;
    const circle = new AMap.Circle({
      center: pos,
      radius,
      strokeColor: color,
      strokeWeight: isActive ? 3 : 2,
      strokeOpacity: isActive ? 0.78 : 0.42,
      fillColor: color,
      fillOpacity: isActive ? 0.13 : 0.07,
      zIndex: isActive ? 36 : 31,
    });
    circle.on('click',()=>selectDynAlert(alert.id));
    map.add(circle);
    dynamicAlertMapLayers.push(circle);

    const marker = new AMap.Marker({
      position: pos,
      anchor: 'center',
      zIndex: isActive ? 45 : 40 + idx,
      content: `<div class="dyn-map-marker${isActive?' active':''}" title="${alert.issueName}"></div>`,
    });
    marker.on('click',()=>selectDynAlert(alert.id));
    map.add(marker);
    dynamicAlertMapLayers.push(marker);

    const label = new AMap.Marker({
      position: pos,
      anchor: 'bottom-center',
      offset: new AMap.Pixel(0, isActive ? -22 : -18),
      zIndex: isActive ? 46 : 41 + idx,
      content: `<div class="dyn-map-label">${alert.name}<small>${alert.issueName} · ${alert.keyMetric}</small></div>`,
    });
    label.on('click',()=>selectDynAlert(alert.id));
    map.add(label);
    dynamicAlertMapLayers.push(label);
  });
  if(activeAlertId){
    const alert = alerts.find(a=>a.id===activeAlertId);
    if(alert) map.setZoomAndCenter(15.4, getDynAlertPosition(alert));
  } else if(fit && positions.length){
    try { map.setFitView(dynamicAlertMapLayers, false, [90, 460, 90, 420]); } catch(e) {}
  }
}

function showToast(msg, type='info', duration=2800){
  const container = document.getElementById('toastContainer');
  if(!container) return;
  const el = document.createElement('div');
  el.className = `toast toast-${type}`;
  el.textContent = msg;
  container.appendChild(el);
  requestAnimationFrame(()=>{ el.classList.add('show'); });

  }, duration);
}

function renderRunDetail(run, target){
  const type = run.targetType || run.target_type;
  const wbId = run.targetId || run.target_id;
  const wbType = run.targetType || run.target_type;
  const issues = (target?.issues||[]);
  const strategies = (target?.strategies||[]);
  const phases = run.phases||[];
  const humanActions = run.humanActions||[];
  const effect = run.effect;
  const report = run.report;
  const phaseData = {};
  phases.forEach(p=>{ phaseData[p.phase]=p; });

  let html = '';

  // 1. 场景认知卡
  const sceneCog = phaseData['scene_cognition']||{};
  const cogEv = sceneCog.evidence||{};
  const sc = target.sceneCognition||{};
  const sceneTypeLabel = run.sceneType==='periodic'?'规律性场景':'动态场景';

  // 工作台入口
  html += `<div class="detail-block">
    <a class="mpp-action primary" href="/debug/agent-workbench.html?id=${run.targetId}&type=${type}" style="display:block;text-align:center;padding:6px 0;font-size:10px">🔬 进入智能体工作台查看完整闭环</a>
