# 信控智能体依赖服务 - 本地开发/联调用（对应架构数据底座与消息中间件）
# agent：API 服务；业务规则可挂载 ./config/business_rules 覆盖镜像内默认

version: "3.8"

services:
  agent:
    build: .
    ports:
      - "8000:8000"
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      SIGNAL_AGENT_BUSINESS_RULES_PATH: /app/config/business_rules/default.yaml
    volumes:
      - ./config/business_rules:/app/config/business_rules:ro
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  kafka:
    image: bitnami/kafka:3.6
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      KAFKA_CFG_NODE_ID: 0
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
    volumes:
      - kafka_data:/bitnami/kafka

  # 以下可按需启用
  # mysql:
  #   image: mysql:8.0
  #   environment:
  #     MYSQL_ROOT_PASSWORD: example
  #     MYSQL_DATABASE: signal_control
  #   ports:
  #     - "3306:3306"
  # influxdb:
  #   image: influxdb:2.7
  #   ports:
  #     - "8086:8086"
  # neo4j:
  #   image: neo4j:5
  #   ports:
  #     - "7474:7474"
  #     - "7687:7687"
  # minio:
  #   image: minio/minio:latest
  #   command: server /data
  #   ports:
  #     - "9000:9000"
  #   volumes:
  #     - minio_data:/data

volumes:
  redis_data:
  kafka_data:
